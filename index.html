<script>
'use strict';
/* =====================================================================
   HOME HUB – single-file household organiser
   ---------------------------------------------------------------------
   Sections:
     1. Constants & configuration
     2. Utility helpers (dates, money, escaping)
     3. State: defaults, sample data, load / save / normalise
     4. Domain helpers (birthdays, Christmas stats, renewals)
     5. UI primitives (icons, pills, inputs, modal, toast)
     6. Views: Dashboard, Tasks, Birthdays, Christmas, Vault, Settings, Other tools, Finance planner
     7. Forms (modals)
     7b. Bank CSV regular-payment finder (in-memory only)
     8. Backup: export / import / share
     9. Cloud sync (Firebase Realtime DB, modular SDK v10 – signed-in users only)
    10. Actions & event delegation
    11. Router, authentication gate & boot

/* =========================== 1. CONSTANTS =========================== */

];

const XMAS_BOUGHT_IDX = XMAS_IDX.purchased; // purchased or beyond counts as "spent"

/* ---- Category colours & icons (full Tailwind class names so the CDN generates them) ---- */
const COLOURS = {
  teal:    { bg: 'bg-teal-50',    fg: 'text-teal-600',    dot: 'bg-teal-500' },
  emerald: { bg: 'bg-emerald-50', fg: 'text-emerald-600', dot: 'bg-emerald-500' },

  'shield', 'briefcase', 'graduation-cap', 'plane', 'dog', 'baby', 'stethoscope', 'receipt', 'credit-card', 'wallet', 'file-text', 'key-round',
  'building-2', 'bike', 'gem', 'umbrella', 'wrench', 'sprout', 'laptop', 'gift'];

/* ---- Household Vault categories: these are only the starting set – users can edit them (state.vaultCats) ---- */
const DEFAULT_VAULT_CATS = [
  { id: 'mortgage',    label: 'Mortgages',               icon: 'landmark',    colour: 'indigo' },
  { id: 'home',        label: 'Home Insurance',          icon: 'house',       colour: 'teal' },
  { id: 'car',         label: 'Car Insurance',           icon: 'car',         colour: 'sky' },
  { id: 'life',        label: 'Life / Health Insurance', icon: 'heart-pulse', colour: 'rose' },
  { id: 'utilities',   label: 'Utilities / Broadband',   icon: 'wifi',        colour: 'amber' },
  { id: 'investments', label: 'Investments / Savings',   icon: 'piggy-bank',  colour: 'emerald' },
  { id: 'other',       label: 'Other',                   icon: 'folder',      colour: 'slate' }   // 'other' is permanent (fallback)
];
function vcats() { return (state && Array.isArray(state.vaultCats) && state.vaultCats.length) ? state.vaultCats : DEFAULT_VAULT_CATS; }
/** Category lookup with colour classes; unknown/deleted ids fall back to "Other". */
function vcat(id) {
  const L = vcats();
  const c = L.find(x => x.id === id) || L.find(x => x.id === 'other') || DEFAULT_VAULT_CATS[DEFAULT_VAULT_CATS.length - 1];
  return { ...c, ...(COLOURS[c.colour] || COLOURS.slate) };
}

/* ---- Finance planner ---- */
const FIN_FREQ  = { monthly: 'Monthly', yearly: 'Yearly' };
const FIN_TYPES = { essential: 'Essential', discretionary: 'Discretionary' };
function defaultFinance() {
  return {
    incomeCats: [
      { id: 'salary', label: 'Salary' },

    ],

      { id: 'insurance', label: 'Insurance', essential: true },
      { id: 'transport', label: 'Transport', essential: true },
      { id: 'food', label: 'Food & groceries', essential: true },
      { id: 'childcare', label: 'Childcare', essential: true },

      { id: 'subscriptions', label: 'Subscriptions', essential: false },

    ],
    incomes: [],     // { id, name, amount, frequency: monthly|yearly, categoryId, notes }
    outgoings: [],   // { id, name, amount, frequency, categoryId, type: essential|discretionary, dueDate, notes }
    pots: [],        // { id, name, mode: fixed|percent, value, target, balance, targetDate, notes }

    csvProfiles: {}  // remembered column mappings per CSV layout (no transaction data)
  };
}

/* ---- Other tools registry – add future tools here (and to TITLES / VIEWS) ---- */
const TOOLS = [
  { route: 'finance', title: 'Finance planner', icon: 'wallet', tone: 'bg-emerald-50 text-emerald-600',
    desc: 'Joint take-home budget, regular outgoings, annual bills pot and savings allocation – with a bank CSV regular-payment finder.',
    status: () => { const s = finStats(); return s.income ? `Left to spend: ${money(s.left)} a month` : 'Not set up yet'; } }
];

/* ========================= 2. UTILITY HELPERS ======================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GBP = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const money = n => GBP.format(Number(n) || 0);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[£,\s]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const sum = (arr, f) => arr.reduce((t, x) => t + (f ? f(x) : x), 0);
const byId = (arr, id) => arr.find(x => x.id === id);
const touch = o => { if (o) o.updatedAt = Date.now(); return o; };
const clone = o => JSON.parse(JSON.stringify(o));

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayStr = () => ymd(new Date());
function parseYMD(s) { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYMD(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysUntil(s) { if (!s) return null; return Math.round((parseYMD(s) - parseYMD(todayStr())) / 864e5); }
function fmtDate(s, opts) { if (!s) return '—'; return parseYMD(s).toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short', year: 'numeric' }); }
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
function relDays(d) {
  if (d === null) return '';
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d === -1) return 'Yesterday';
  return d < 0 ? `${-d} days ago` : `in ${d} days`;
}
function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u)) return 'https://' + u;
  return '';
}
function initials(n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'; }
const AVATAR_COLOURS = ['bg-teal-100 text-teal-700', 'bg-sky-100 text-sky-700', 'bg-violet-100 text-violet-700', 'bg-rose-100 text-rose-700', 'bg-amber-100 text-amber-700', 'bg-emerald-100 text-emerald-700', 'bg-indigo-100 text-indigo-700'];
function avatarCls(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLOURS[h % AVATAR_COLOURS.length]; }

      ideas: [idea('Lego Technic set', 90, 'https://www.lego.com/en-gb'), idea('Craft beer subscription', 30, '')],

/** Fill in any missing keys so older/imported data never crashes the UI. */
function normalise(raw) {
  const d = defaultState();
  const s = Object.assign(d, raw || {});
  s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
  s.checklists = (Array.isArray(s.checklists) ? s.checklists : []).map(c => ({ items: [], ...c, items: Array.isArray(c.items) ? c.items : [] }));
  s.people = (Array.isArray(s.people) ? s.people : []).map(p => ({ ideas: [], history: [], finalGift: null, cardBought: false, cardSent: false, yearKnown: true, ...p,
    ideas: Array.isArray(p.ideas) ? p.ideas : [], history: Array.isArray(p.history) ? p.history : [] }));
  s.christmas = Object.assign({ year: new Date().getFullYear(), budget: 0, recipients: [], archive: [] }, s.christmas || {});
  s.christmas.recipients = (s.christmas.recipients || []).map(r => ({ gifts: [], ...r, gifts: Array.isArray(r.gifts) ? r.gifts : [] }));
  s.vault = Array.isArray(s.vault) ? s.vault : [];
  s.vaultCats = (Array.isArray(s.vaultCats) && s.vaultCats.length ? s.vaultCats : clone(DEFAULT_VAULT_CATS)).filter(c => c && c.id && c.label);
  if (!s.vaultCats.some(c => c.id === 'other')) s.vaultCats.push({ id: 'other', label: 'Other', icon: 'folder', colour: 'slate' });
  const fdef = defaultFinance(), f = Object.assign(defaultFinance(), s.finance || {});
  ['incomes', 'outgoings', 'pots'].forEach(k => { f[k] = Array.isArray(f[k]) ? f[k] : []; });
  ['incomeCats', 'outCats'].forEach(k => { f[k] = Array.isArray(f[k]) && f[k].length ? f[k] : fdef[k]; });
  if (!f.incomeCats.some(c => c.id === 'inc_other')) f.incomeCats.push({ id: 'inc_other', label: 'Other income' });
  if (!f.outCats.some(c => c.id === 'out_other')) f.outCats.push({ id: 'out_other', label: 'Other', essential: false });
  f.billsPot = Object.assign({ name: 'Annual bills pot (Monzo)', balance: 0 }, f.billsPot || {});
  f.csvProfiles = f.csvProfiles && typeof f.csvProfiles === 'object' ? f.csvProfiles : {};
  s.finance = f;
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  const oldSync = s.settings.sync || {};
  s.settings.sync = { enabled: !!oldSync.enabled, householdId: String(oldSync.householdId || ''), lastSync: oldSync.lastSync || null };
  if (oldSync.provider === 'supabase') s.settings.sync.enabled = false;           // Supabase removed – Firebase + Google sign-in only
  if (CFG.defaultHouseholdId && !s.settings.sync.householdId) {                    // optional hard-coded household
    s.settings.sync.householdId = CFG.defaultHouseholdId; s.settings.sync.enabled = true;
  }
  s.meta = Object.assign({ updatedAt: Date.now(), updatedBy: CLIENT_ID }, s.meta || {});
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalise(JSON.parse(raw));
  } catch (e) { console.warn('Could not read saved data', e); }
  const s = normalise(sampleState());
  s.meta.updatedAt = 0;   // sample data must never overwrite real data already in the cloud
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  return s;
}

/** Write to localStorage only (no timestamp bump, no cloud push). */
function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/** Record a user change: bump timestamp, persist and (if enabled) push to the cloud. */
function save() {
  state.meta.updatedAt = Date.now();
  state.meta.updatedBy = CLIENT_ID;
  try { persist(); } catch (e) { toast('Could not save – storage may be full', 'error'); }
  Sync.schedulePush();
}
function commit() { save(); render(); }

/** The shareable part of state (device-specific sync settings are excluded). */
function exportable() {

/* ======================== 4. DOMAIN HELPERS ========================== */
function bdayInYear(dob, year) {
  const [, m, d] = dob.split('-').map(Number);
  const day = (m === 2 && d === 29 && !isLeap(year)) ? 28 : d;
  return ymd(new Date(year, m - 1, day));
}
/** Next occurrence (today counts) – returns { date, days, turning } */
function nextBirthday(p) {
  if (!p.dob) return { date: null, days: 9999, turning: null };
  const t = todayStr();
  const y = new Date().getFullYear();
  let date = bdayInYear(p.dob, y);
  if (date < t) date = bdayInYear(p.dob, y + 1);
  const turning = p.yearKnown !== false ? Number(date.slice(0, 4)) - Number(p.dob.slice(0, 4)) : null;
  return { date, days: daysUntil(date), turning };
}

/** Once a birthday has passed, archive the chosen gift and reset card/gift trackers for next year. */
function ensureCycles() {
  let changed = false;
  const t = todayStr();
  state.people.forEach(p => {
    if (!p.dob) return;
    const nb = nextBirthday(p).date;
    if (!p.cycleFor) { p.cycleFor = nb; changed = true; return; }
    if (p.cycleFor < t) {
      if (p.finalGift && p.finalGift.title) {
        p.history.unshift({ id: uid(), year: Number(p.cycleFor.slice(0, 4)), occasion: 'Birthday', gift: p.finalGift.title, price: num(p.finalGift.price), notes: 'Auto-archived after birthday' });
      }
      p.finalGift = null; p.cardBought = false; p.cardSent = false; p.cycleFor = nb;
      touch(p); changed = true;
    }
  });
  if (changed) save();
}

const recipientDone = r => r.gifts.length > 0 && r.gifts.every(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX);
const recipientSpent = r => sum(r.gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX), g => num(g.price));
function xmasStats() {
  const c = state.christmas, R = c.recipients;
  const gifts = R.flatMap(r => r.gifts);
  const spent = sum(gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX), g => num(g.price));
  return {
    budget: num(c.budget), spent,
    planned: sum(gifts, g => num(g.price)),
    budgeted: sum(R, r => num(r.budget)),
    remaining: num(c.budget) - spent,
    done: R.filter(recipientDone).length, total: R.length,
    giftsTotal: gifts.length, giftsBought: gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX).length,
    days: daysUntil(`${c.year}-12-25`)
  };
}


/* ---------- Finance calculations ---------- */
const fin = () => state.finance;
const monthlyOf = x => x.frequency === 'yearly' ? num(x.amount) / 12 : num(x.amount);
function finCat(kind, id) {
  const L = kind === 'income' ? fin().incomeCats : fin().outCats;
  const fb = kind === 'income' ? 'inc_other' : 'out_other';
  return L.find(c => c.id === id) || L.find(c => c.id === fb) || { id: fb, label: 'Other' };
}
const VAULT_TO_FIN = { mortgage: 'housing', home: 'insurance', car: 'insurance', life: 'insurance', utilities: 'utilities' };
function vaultFinCat(v) {
  const c = v.finCat || VAULT_TO_FIN[v.category] || 'out_other';
  return fin().outCats.some(x => x.id === c) ? c : 'out_other';
}
/** Manual outgoings plus vault entries ticked "Include in budget" (the vault stays the single source of truth for those). */
function finOutgoings() {
  const manual = fin().outgoings.map(o => ({ ...o, src: 'manual' }));
  const vault = state.vault.filter(v => v.inBudget && num(v.cost) > 0).map(v => ({
    id: 'v_' + v.id, vaultId: v.id, src: 'vault',
    name: v.provider + (v.name ? ' – ' + v.name : ''),
    amount: num(v.cost), frequency: v.costPeriod === 'annual' ? 'yearly' : 'monthly',
    categoryId: vaultFinCat(v), type: v.finType === 'discretionary' ? 'discretionary' : 'essential',
    dueDate: v.renewalDate || '', notes: ''
  }));
  return [...manual, ...vault];
}
/** Next anniversary of a date (today counts). Future dates are returned unchanged. */
function nextAnnual(s) {
  if (!s) return null;
  const t = todayStr();
  if (s >= t) return s;
  const y = new Date().getFullYear();
  let d = bdayInYear(s, y);
  if (d < t) d = bdayInYear(s, y + 1);
  return d;
}
/** Income → monthly outgoings → annual bills pot (yearly ÷ 12) → savings → left to spend. */
function finStats() {
  const F = fin(), outs = finOutgoings();
  const income = sum(F.incomes, monthlyOf);
  const monthlyItems = outs.filter(o => o.frequency !== 'yearly');
  const yearlyItems = outs.filter(o => o.frequency === 'yearly');
  const monthlyOut = sum(monthlyItems, o => num(o.amount));
  const yearlyTotal = sum(yearlyItems, o => num(o.amount));
  const billsPot = yearlyTotal / 12;
  const essential = sum(outs.filter(o => o.type !== 'discretionary'), monthlyOf);
  const discretionary = sum(outs.filter(o => o.type === 'discretionary'), monthlyOf);
  const available = income - monthlyOut - billsPot;
  const potAlloc = F.pots.map(p => ({ p, monthly: p.mode === 'percent' ? Math.max(0, available) * num(p.value) / 100 : num(p.value) }));
  const savings = sum(potAlloc, x => x.monthly);
  const byCat = {};
  outs.forEach(o => { const c = finCat('out', o.categoryId).id; byCat[c] = (byCat[c] || 0) + monthlyOf(o); });
  return { income, outs, monthlyItems, yearlyItems, monthlyOut, yearlyTotal, billsPot, essential, discretionary, available, potAlloc, savings, left: available - savings, byCat };
}
/** What the annual bills pot should hold today: each yearly bill needs (12 − months until due) / 12 of its cost saved. */
function billsPotStatus() {
  const items = finOutgoings().filter(o => o.frequency === 'yearly').map(o => {
    const due = nextAnnual(o.dueDate);
    if (!due) return { o, due: null, expected: null };
    const days = daysUntil(due);
    const monthsLeft = Math.min(12, Math.max(0, Math.ceil(days / 30.44)));
    return { o, due, days, monthsLeft, expected: num(o.amount) * (12 - monthsLeft) / 12 };
  }).sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1);
  const expected = sum(items.filter(i => i.due), i => i.expected);
  const balance = num(fin().billsPot.balance);
  return { items, expected, balance, diff: balance - expected, undated: items.filter(i => !i.due).length };
}

function sortTasks(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
  if (ad !== bd) return ad < bd ? -1 : 1;
  return (PRIORITIES[a.priority]?.rank ?? 1) - (PRIORITIES[b.priority]?.rank ?? 1);
}

  return `<li class="flex items-start gap-3 py-3">

      class="mt-0.5 shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${t.done ? 'bg-teal-500 border-teal-500 text-white' : 'border-slate-300 hover:border-teal-500 text-transparent hover:text-teal-400'}">${icon('check', 'w-3.5 h-3.5')}</button>
    <div class="flex-1 min-w-0">
      <p class="text-sm ${t.done ? 'line-through text-slate-400' : 'text-slate-800 font-medium'} break-words">${esc(t.title)}</p>
      <div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1">${pill(p.label, p.cls)}<span class="text-xs text-slate-500">${TASK_CATS[t.category] || 'General'}</span>${due}</div>
      ${t.notes ? `<p class="text-xs text-slate-500 mt-1 break-words">${esc(t.notes)}</p>` : ''}
    </div>
    <div class="flex shrink-0 -mr-2">
      <button type="button" data-action="task-edit" data-id="${t.id}" class="${ICON_BTN}" aria-label="Edit">${icon('pencil')}</button>
      <button type="button" data-action="task-delete" data-id="${t.id}" class="${ICON_BTN} hover:!text-rose-600" aria-label="Delete">${icon('trash-2')}</button>
    </div>
  </li>`;
}

function giftStatusPill(p) {
  if (!p.finalGift) return pill(`${icon('gift', 'w-3 h-3')} No gift yet`, 'bg-rose-50 text-rose-700 ring-rose-200');
  if (p.finalGift.status === 'ready') return pill(`${icon('gift', 'w-3 h-3')} Gift ready`, 'bg-emerald-50 text-emerald-700 ring-emerald-200');
  if (p.finalGift.status === 'ordered') return pill(`${icon('package', 'w-3 h-3')} Gift ordered`, 'bg-sky-50 text-sky-700 ring-sky-200');
  return pill(`${icon('lightbulb', 'w-3 h-3')} Gift: idea only`, 'bg-amber-50 text-amber-700 ring-amber-200');
}
function cardStatusPill(p) {
  if (!p.cardBought) return pill(`${icon('mail', 'w-3 h-3')} Card needed`, 'bg-rose-50 text-rose-700 ring-rose-200');
  if (!p.cardSent) return pill(`${icon('mail', 'w-3 h-3')} Card to write/send`, 'bg-amber-50 text-amber-700 ring-amber-200');
  return pill(`${icon('mail', 'w-3 h-3')} Card sent`, 'bg-emerald-50 text-emerald-700 ring-emerald-200');
}
function daysPill(d) {
  if (d === 0) return pill('🎉 Today', 'bg-teal-600 text-white ring-teal-600');
  if (d <= 7) return pill(relDays(d), 'bg-rose-50 text-rose-700 ring-rose-200');
  if (d <= 30) return pill(relDays(d), 'bg-amber-50 text-amber-700 ring-amber-200');
  return pill(relDays(d), 'bg-slate-50 text-slate-600 ring-slate-200');
}

function statTile(route, iconName, value, label, tone) {
  return `<a href="#/${route}" class="${CARD} p-4 flex items-center gap-3 hover:border-teal-300 transition">
    <div class="w-10 h-10 rounded-xl ${tone} flex items-center justify-center shrink-0">${icon(iconName, 'w-5 h-5')}</div>
    <div class="min-w-0"><p class="text-2xl font-bold text-slate-900 leading-none">${value}</p><p class="text-xs text-slate-500 mt-1 truncate">${label}</p></div>
  </a>`;
}

function renderDashboard() {
  const t = todayStr();
  const open = state.tasks.filter(x => !x.done);
  const overdue = open.filter(x => x.due && x.due < t);
  const dueToday = open.filter(x => x.due === t);
  const focus = [...overdue, ...dueToday].sort(sortTasks);

  const bdays = state.people.filter(p => p.dob).map(p => ({ p, nb: nextBirthday(p) })).filter(o => o.nb.days <= 30).sort((a, b) => a.nb.days - b.nb.days);
  const bdayMissing = bdays.filter(o => !o.p.finalGift || o.p.finalGift.status === 'idea' || !o.p.cardBought || !o.p.cardSent).length;
  const renewals = state.vault.filter(v => v.renewalDate).map(v => ({ v, d: daysUntil(v.renewalDate) })).filter(o => o.d <= 60 && o.d >= -30).sort((a, b) => a.d - b.d);
  const xs = xmasStats();
  const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const activeLists = state.checklists.filter(c => c.items.length && c.items.some(i => i.done) && c.items.some(i => !i.done));

  const quick = [['quick-task', 'list-todo', 'Task'], ['person-new', 'cake', 'Birthday'], ['xmas-gift-new', 'gift', 'Christmas gift'], ['vault-new', 'shield-check', 'Policy / account'], ['cl-new', 'list-checks', 'Checklist']];

  return `
  <div class="mb-6">
    <p class="text-sm text-slate-500">${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
    <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mt-1">${greet} 👋</h2>
  </div>

  <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 md:mx-0 md:px-0 mb-6">
    ${quick.map(([a, i, l]) => `<button type="button" data-action="${a}" class="shrink-0 ${BTN_GHOST} !rounded-full">${icon('plus', 'w-3.5 h-3.5 text-teal-600')}${icon(i, 'w-4 h-4 text-slate-500')}${l}</button>`).join('')}
  </div>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
    ${statTile('tasks', 'calendar-check', dueToday.length, 'Tasks due today', 'bg-teal-50 text-teal-600')}
    ${statTile('tasks', 'triangle-alert', overdue.length, 'Overdue tasks', overdue.length ? 'bg-rose-50 text-rose-600' : 'bg-slate-100 text-slate-500')}
    ${statTile('birthdays', 'cake', bdays.length, 'Birthdays · next 30 days', 'bg-violet-50 text-violet-600')}
    ${statTile('vault', 'shield-check', renewals.length, 'Renewals · next 60 days', renewals.some(r => r.d < 14) ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600')}
  </div>

  <div class="grid lg:grid-cols-2 gap-4">
    <!-- Tasks -->
    <section class="${CARD} p-5">
      <div class="flex items-center justify-between mb-1">
        <h3 class="font-semibold text-slate-900 flex items-center gap-2">${icon('list-todo', 'w-5 h-5 text-teal-600')} Today &amp; overdue</h3>
        <a href="#/tasks" class="text-sm text-teal-700 hover:underline">All tasks</a>
      </div>
      ${focus.length ? `<ul class="divide-y divide-slate-100">${focus.slice(0, 6).map(taskRow).join('')}</ul>${focus.length > 6 ? `<p class="text-xs text-slate-500 mt-2">+ ${focus.length - 6} more</p>` : ''}`
        : emptyBox('circle-check', 'All clear!', 'Nothing due today or overdue.')}
    </section>

    <!-- Birthdays -->
    <section class="${CARD} p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-slate-900 flex items-center gap-2">${icon('cake', 'w-5 h-5 text-violet-600')} Upcoming birthdays</h3>
        <a href="#/birthdays" class="text-sm text-teal-700 hover:underline">View all</a>
      </div>
      ${bdayMissing ? `<div class="mb-3 rounded-xl bg-amber-50 text-amber-800 text-sm px-3 py-2 flex gap-2 items-center">${icon('triangle-alert', 'w-4 h-4 shrink-0')} ${bdayMissing} upcoming birthday${bdayMissing > 1 ? 's' : ''} still need a card or gift sorting</div>` : ''}
      ${bdays.length ? `<ul class="space-y-3">${bdays.map(({ p, nb }) => `
        <li><a href="#/birthdays" data-action="person-open" data-id="${p.id}" class="flex items-start gap-3 rounded-xl hover:bg-slate-50 -mx-2 px-2 py-1.5">
          <div class="w-10 h-10 rounded-full ${avatarCls(p.name)} flex items-center justify-center text-sm font-semibold shrink-0">${initials(p.name)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2"><p class="font-medium text-slate-800 truncate">${esc(p.name)}</p>${daysPill(nb.days)}</div>
            <p class="text-xs text-slate-500">${fmtDate(nb.date, { weekday: 'short', day: 'numeric', month: 'short' })}${nb.turning !== null ? ` · turning ${nb.turning}` : ''}</p>
            <div class="flex flex-wrap gap-1.5 mt-1.5">${giftStatusPill(p)}${cardStatusPill(p)}</div>
          </div></a></li>`).join('')}</ul>`
        : emptyBox('cake', 'No birthdays in the next 30 days', '')}
    </section>

    <!-- Renewals -->
    <section class="${CARD} p-5">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-slate-900 flex items-center gap-2">${icon('shield-check', 'w-5 h-5 text-amber-600')} Renewals due (60 days)</h3>
        <a href="#/vault" class="text-sm text-teal-700 hover:underline">Open vault</a>
      </div>
      ${renewals.length ? `<ul class="space-y-2">${renewals.map(({ v }) => { const c = vcat(v.category); return `
        <li class="flex items-center gap-3 rounded-xl bg-slate-50 px-3 py-2.5">
          <div class="w-9 h-9 rounded-lg ${c.bg} ${c.fg} flex items-center justify-center shrink-0">${icon(c.icon)}</div>
          <div class="flex-1 min-w-0"><p class="text-sm font-medium text-slate-800 truncate">${esc(v.provider)} <span class="font-normal text-slate-500">· ${esc(v.name || c.label)}</span></p>
          <p class="text-xs text-slate-500">${fmtDate(v.renewalDate)} · ${v.autoRenew ? 'Auto-renews' : '<span class="text-rose-600 font-medium">Does NOT auto-renew</span>'}</p></div>
          ${renewalBadge(v.renewalDate)}
        </li>`; }).join('')}</ul>`
        : emptyBox('shield-check', 'No renewals in the next 60 days', '')}
    </section>

    <!-- Christmas -->
    <section class="${CARD} p-5 relative overflow-hidden">
      <div class="absolute -right-6 -top-6 w-28 h-28 rounded-full bg-emerald-50"></div>
      <div class="relative">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-slate-900 flex items-center gap-2">${icon('tree-pine', 'w-5 h-5 text-emerald-600')} Christmas ${state.christmas.year}</h3>
          <a href="#/christmas" class="text-sm text-teal-700 hover:underline">Planner</a>
        </div>
        <p class="text-sm text-slate-500 mb-4">${xs.days > 0 ? `<span class="font-semibold text-slate-800">${xs.days}</span> days to go` : xs.days === 0 ? '🎄 Merry Christmas!' : 'Christmas has passed – start next year in the planner'}</p>
        <div class="space-y-4">
          <div>
            <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-600">Spent vs budget</span><span class="font-medium ${xs.spent > xs.budget && xs.budget ? 'text-rose-600' : 'text-slate-800'}">${money(xs.spent)} / ${money(xs.budget)}</span></div>
            ${progress(xs.budget ? xs.spent / xs.budget * 100 : 0, xs.spent > xs.budget && xs.budget ? 'bg-rose-500' : 'bg-emerald-500', 'h-2.5')}
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1.5"><span class="text-slate-600">People sorted</span><span class="font-medium text-slate-800">${xs.done} / ${xs.total}</span></div>
            ${progress(xs.total ? xs.done / xs.total * 100 : 0, 'bg-teal-500', 'h-2.5')}
          </div>
          <p class="text-xs text-slate-500">${xs.giftsBought} of ${xs.giftsTotal} gifts bought · ${money(xs.remaining)} remaining</p>
        </div>
      </div>
    </section>

    ${activeLists.length ? `<section class="${CARD} p-5 lg:col-span-2">
      <h3 class="font-semibold text-slate-900 flex items-center gap-2 mb-3">${icon('list-checks', 'w-5 h-5 text-sky-600')} Checklists in progress</h3>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${activeLists.map(c => { const d = c.items.filter(i => i.done).length; return `
        <a href="#/tasks" data-action="tasks-tab" data-val="checklists" class="rounded-xl bg-slate-50 hover:bg-slate-100 p-3 block">
          <div class="flex justify-between text-sm mb-2"><span class="font-medium text-slate-800 truncate">${esc(c.title)}</span><span class="text-slate-500">${d}/${c.items.length}</span></div>
          ${progress(d / c.items.length * 100, 'bg-sky-500')}</a>`; }).join('')}</div>
    </section>` : ''}
  </div>`;
}

/* ---------- 6.2 TASKS & CHECKLISTS ---------- */
function renderTasks() {
  const tabs = `<div class="inline-flex rounded-xl bg-slate-100 p-1 mb-5">
    ${[['tasks', 'Tasks', 'list-todo'], ['checklists', 'Checklists', 'list-checks']].map(([v, l, i]) => `
      <button type="button" data-action="tasks-tab" data-val="${v}" class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition ${ui.tasksTab === v ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500 hover:text-slate-700'}">${icon(i)}${l}</button>`).join('')}
  </div>`;
  return tabs + (ui.tasksTab === 'checklists' ? renderChecklists() : renderTaskList());
}

function renderTaskList() {
  const t = todayStr();
  const T = state.tasks;
  const filters = {
    open: x => !x.done,
    today: x => !x.done && x.due === t,
    overdue: x => !x.done && x.due && x.due < t,
    upcoming: x => !x.done && x.due && x.due > t,
    done: x => x.done,
    all: () => true
  };
  const catOk = x => ui.taskCat === 'all' || x.category === ui.taskCat;
  const list = T.filter(filters[ui.taskFilter] || filters.open).filter(catOk).sort(sortTasks);
  const count = k => T.filter(filters[k]).filter(catOk).length;
  const doneCount = T.filter(x => x.done).length;

  return `
  <form data-form="task-quick" class="${CARD} p-3 md:p-4 mb-5">
    <div class="flex gap-2">
      <input name="title" required placeholder="Add a task… e.g. Book dentist" class="${INPUT} flex-1">
      <button type="submit" class="${BTN_PRIMARY} shrink-0">${icon('plus')}<span class="hidden sm:inline">Add</span></button>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <input type="date" name="due" class="${INPUT} !py-2" aria-label="Due date">
      ${sel('priority', Object.entries(PRIORITIES).map(([k, v]) => [k, v.label + ' priority']), 'medium').replace(INPUT, INPUT + ' !py-2')}
      ${sel('category', Object.entries(TASK_CATS), 'general').replace(INPUT, INPUT + ' !py-2')}
    </div>
  </form>

  <div class="space-y-2 mb-4">
    ${filterPills([['open', 'Open', count('open')], ['today', 'Today', count('today')], ['overdue', 'Overdue', count('overdue')], ['upcoming', 'Upcoming', count('upcoming')], ['done', 'Completed', count('done')], ['all', 'All', count('all')]], ui.taskFilter, 'task-filter')}
    ${filterPills([['all', 'All categories'], ...Object.entries(TASK_CATS)], ui.taskCat, 'task-cat')}
  </div>

  <section class="${CARD} px-4 md:px-5">
    ${list.length ? `<ul class="divide-y divide-slate-100">${list.map(taskRow).join('')}</ul>` : emptyBox('circle-check', 'No tasks here', ui.taskFilter === 'done' ? 'Completed tasks will appear here.' : 'Use the box above to add one.')}
  </section>
  ${doneCount ? `<div class="mt-3 text-right"><button type="button" data-action="tasks-clear-done" class="text-sm text-slate-500 hover:text-rose-600">Clear ${doneCount} completed</button></div>` : ''}`;
}

function renderChecklists() {
  const C = state.checklists;
  return `
  <div class="flex items-center justify-between mb-4">
    <p class="text-sm text-slate-500">Reusable templates can be reset or copied each time you need them.</p>
    <button type="button" data-action="cl-new" class="${BTN_PRIMARY} shrink-0">${icon('plus')}New</button>
  </div>
  ${C.length ? `<div class="grid md:grid-cols-2 gap-4 items-start">${C.map(checklistCard).join('')}</div>`
    : `<div class="${CARD}">${emptyBox('list-checks', 'No checklists yet', 'Create one for packing, food shops, projects…', `<button type="button" data-action="cl-new" class="${BTN_SOFT}">${icon('plus')}Create checklist</button>`)}</div>`}`;
}

function checklistCard(c) {
  const done = c.items.filter(i => i.done).length, total = c.items.length;
  const pct = total ? done / total * 100 : 0;
  const collapsed = !!ui.clCollapsed[c.id];
  return `<section class="${CARD} overflow-hidden">
    <button type="button" data-action="cl-collapse" data-id="${c.id}" class="w-full text-left p-4 md:p-5">
      <div class="flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap"><h3 class="font-semibold text-slate-900">${esc(c.title)}</h3>
            ${c.reusable ? pill(`${icon('repeat', 'w-3 h-3')} Reusable`, 'bg-sky-50 text-sky-700 ring-sky-200') : ''}
            ${total && done === total ? pill(`${icon('check', 'w-3 h-3')} Complete`, 'bg-emerald-50 text-emerald-700 ring-emerald-200') : ''}</div>
          <p class="text-xs text-slate-500 mt-1">${done} of ${total} done</p>
        </div>
        <span class="text-slate-400 transition ${collapsed ? '' : 'rotate-180'}">${icon('chevron-down', 'w-5 h-5')}</span>
      </div>
      <div class="mt-3">${progress(pct, done === total && total ? 'bg-emerald-500' : 'bg-sky-500')}</div>
    </button>
    ${collapsed ? '' : `
    <div class="px-4 md:px-5 pb-4">
      <ul class="space-y-1">${c.items.map(i => `
        <li class="flex items-center gap-2 group">
          <button type="button" data-action="cl-toggle-item" data-id="${c.id}" data-item="${i.id}" class="flex-1 flex items-center gap-3 rounded-lg px-2 py-2 hover:bg-slate-50 text-left">
            <span class="w-5 h-5 shrink-0 rounded-md border-2 flex items-center justify-center ${i.done ? 'bg-sky-500 border-sky-500 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'w-3 h-3')}</span>
            <span class="text-sm ${i.done ? 'line-through text-slate-400' : 'text-slate-700'} break-words">${esc(i.text)}</span>
          </button>
          <button type="button" data-action="cl-del-item" data-id="${c.id}" data-item="${i.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Remove item">${icon('x', 'w-3.5 h-3.5')}</button>
        </li>`).join('')}</ul>
      <form data-form="cl-add-item" data-id="${c.id}" class="flex gap-2 mt-2">
        <input name="text" required placeholder="Add item…" class="${INPUT} !py-2" data-focus-key="cl-${c.id}">
        <button type="submit" class="${BTN_SOFT} shrink-0" aria-label="Add item">${icon('plus')}</button>
      </form>
      <div class="flex flex-wrap gap-2 mt-4 pt-3 border-t border-slate-100">
        ${c.reusable ? `<button type="button" data-action="cl-reset" data-id="${c.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('rotate-ccw', 'w-3.5 h-3.5')}Reset ticks</button>` : ''}
        <button type="button" data-action="cl-dup" data-id="${c.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('copy-plus', 'w-3.5 h-3.5')}${c.reusable ? 'Use as new list' : 'Duplicate'}</button>
        <button type="button" data-action="cl-edit" data-id="${c.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('pencil', 'w-3.5 h-3.5')}Edit</button>
        <button type="button" data-action="cl-delete" data-id="${c.id}" class="${BTN_DANGER} !py-1.5 !text-xs ml-auto">${icon('trash-2', 'w-3.5 h-3.5')}Delete</button>
      </div>
    </div>`}
  </section>`;
}

/* ---------- 6.3 BIRTHDAYS ---------- */
function renderBirthdays() {
  const list = state.people.map(p => ({ p, nb: nextBirthday(p) })).sort((a, b) => a.nb.days - b.nb.days);
  let lastMonth = '';
  const rows = list.map(({ p, nb }) => {
    const m = nb.date ? parseYMD(nb.date).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : 'No date';
    const header = m !== lastMonth ? `<h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 pt-4 pb-1 px-1">${m}</h3>` : '';
    lastMonth = m;
    return header + personCard(p, nb);
  }).join('');

  return `
  <div class="flex items-center justify-between gap-3 mb-2">
    <p class="text-sm text-slate-500">${state.people.length} ${state.people.length === 1 ? 'person' : 'people'} · sorted by next birthday</p>
    <button type="button" data-action="person-new" class="${BTN_PRIMARY}">${icon('user-plus')}Add person</button>
  </div>
  ${list.length ? `<div class="space-y-3">${rows}</div>` : `<div class="${CARD}">${emptyBox('cake', 'No birthdays yet', 'Add family and friends to start tracking.', `<button type="button" data-action="person-new" class="${BTN_SOFT}">${icon('user-plus')}Add person</button>`)}</div>`}`;
}

function personCard(p, nb) {
  const open = !!ui.personOpen[p.id];
  const fg = p.finalGift;
  const givenBefore = title => {
    const tl = String(title || '').toLowerCase().trim();
    if (!tl) return null;
    const h = p.history.find(x => { const g = String(x.gift || '').toLowerCase(); return g && (g.includes(tl) || tl.includes(g)); });
    return h ? h.year : null;
  };

  return `<article class="${CARD} overflow-hidden" id="person-${p.id}">
    <button type="button" data-action="person-toggle" data-id="${p.id}" class="w-full text-left p-4 flex items-start gap-3">
      <div class="w-12 h-12 rounded-full ${avatarCls(p.name)} flex items-center justify-center font-semibold shrink-0">${initials(p.name)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0"><p class="font-semibold text-slate-900 truncate">${esc(p.name)}</p>
          <p class="text-xs text-slate-500">${p.relationship ? esc(p.relationship) + ' · ' : ''}${nb.date ? fmtDate(nb.date, { weekday: 'short', day: 'numeric', month: 'long' }) : 'No date set'}${nb.turning !== null && nb.date ? ` · <span class="font-medium text-slate-700">turning ${nb.turning}</span>` : ''}</p></div>
          ${nb.date ? daysPill(nb.days) : ''}
        </div>
        <div class="flex flex-wrap gap-1.5 mt-2">${giftStatusPill(p)}${cardStatusPill(p)}${p.ideas.length ? pill(`${icon('lightbulb', 'w-3 h-3')} ${p.ideas.length} idea${p.ideas.length > 1 ? 's' : ''}`, 'bg-slate-50 text-slate-600 ring-slate-200') : ''}</div>
      </div>

      </div>

      <!-- Gift ideas -->
      <div>
        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Gift ideas</h4>
        ${p.ideas.length ? `<ul class="space-y-2 mb-2">${p.ideas.map(idea => { const isSel = fg && fg.ideaId === idea.id; const yr = givenBefore(idea.title); const url = safeUrl(idea.link); return `

            <div class="flex-1 min-w-[10rem]"><p class="text-sm font-medium text-slate-800 break-words">${esc(idea.title)}</p>
              <p class="text-xs text-slate-500 flex flex-wrap gap-x-3">${idea.price ? `<span>${money(idea.price)}</span>` : ''}${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="text-teal-700 hover:underline inline-flex items-center gap-1">${icon('external-link', 'w-3 h-3')}Link</a>` : ''}
              ${yr ? `<span class="text-amber-700 font-medium">${icon('triangle-alert', 'w-3 h-3 inline -mt-0.5')} Similar gift given in ${yr}</span>` : ''}</p></div>
            ${isSel ? pill(`${icon('star', 'w-3 h-3')} Selected`, 'bg-teal-50 text-teal-700 ring-teal-200')
              : `<button type="button" data-action="idea-select" data-id="${p.id}" data-item="${idea.id}" class="${BTN_SOFT} !py-1.5 !text-xs">${icon('star', 'w-3.5 h-3.5')}Select as final gift</button>`}
            <button type="button" data-action="idea-delete" data-id="${p.id}" data-item="${idea.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Delete idea">${icon('trash-2', 'w-3.5 h-3.5')}</button>
          </li>`; }).join('')}</ul>` : ''}

            <button type="button" data-action="history-delete" data-id="${p.id}" data-item="${h.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Delete history entry">${icon('x', 'w-3.5 h-3.5')}</button>

  </article>`;
}

/* ---------- 6.4 CHRISTMAS ---------- */
function renderChristmas() {
  const c = state.christmas, xs = xmasStats();
  const R = c.recipients;
  const filtered = R.filter(r => ui.xmasFilter === 'all' ? true : ui.xmasFilter === 'done' ? recipientDone(r) : !recipientDone(r))
    .sort((a, b) => (recipientDone(a) - recipientDone(b)) || a.name.localeCompare(b.name));
  const over = xs.budget && xs.spent > xs.budget;

  const tile = (label, val, sub = '', cls = 'text-slate-900') => `<div class="${CARD} p-4"><p class="text-xs text-slate-500">${label}</p><p class="text-xl md:text-2xl font-bold ${cls} mt-1">${val}</p>${sub ? `<p class="text-xs text-slate-500 mt-0.5">${sub}</p>` : ''}</div>`;

  return `
  <div class="rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-5 md:p-6 mb-4 shadow-sm relative overflow-hidden">
    <div class="absolute right-4 top-4 opacity-20">${icon('snowflake', 'w-20 h-20')}</div>
    <div class="relative flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="text-emerald-100 text-sm">Christmas ${c.year}</p>
        <p class="text-3xl font-bold mt-1">${xs.days > 0 ? `${xs.days} days to go` : xs.days === 0 ? 'Merry Christmas! 🎄' : 'All done for this year'}</p>
        <p class="text-emerald-100 text-sm mt-1">${xs.done} of ${xs.total} people sorted · ${xs.giftsBought} of ${xs.giftsTotal} gifts bought</p>
      </div>
      <button type="button" data-action="xmas-budget" class="${BTN} bg-white/15 hover:bg-white/25 text-white ring-1 ring-white/30">${icon('wallet')}Overall budget: ${money(xs.budget)}</button>
    </div>
    <div class="relative mt-4 space-y-2">
      <div class="flex justify-between text-xs text-emerald-50"><span>Spent ${money(xs.spent)}</span><span>${over ? 'Over budget!' : money(xs.remaining) + ' left'}</span></div>
      <div class="h-2.5 rounded-full bg-white/20 overflow-hidden"><div class="h-full rounded-full ${over ? 'bg-rose-300' : 'bg-white'}" style="width:${Math.min(100, xs.budget ? xs.spent / xs.budget * 100 : 0)}%"></div></div>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
    ${tile('Overall budget', money(xs.budget))}
    ${tile('Total budgeted (per person)', money(xs.budgeted), xs.budget && xs.budgeted > xs.budget ? '<span class="text-rose-600">Exceeds overall budget</span>' : `${money(xs.budget - xs.budgeted)} unallocated`)}
    ${tile('Total spent', money(xs.spent), `${money(xs.planned)} incl. ideas`)}
    ${tile('Remaining budget', money(xs.remaining), '', xs.remaining < 0 ? 'text-rose-600' : 'text-emerald-700')}
  </div>

  <div class="flex flex-wrap items-center gap-2 mb-4">
    <button type="button" data-action="xmas-recipient-new" class="${BTN_PRIMARY}">${icon('user-plus')}Add recipient</button>
    <button type="button" data-action="xmas-import" class="${BTN_GHOST}">${icon('users')}Import from birthdays</button>
    <button type="button" data-action="xmas-new-year" class="${BTN_GHOST} sm:ml-auto">${icon('archive')}Start ${c.year + 1}</button>
  </div>
  <div class="mb-4">${filterPills([['all', 'Everyone', R.length], ['todo', 'Still need to buy', R.filter(r => !recipientDone(r)).length], ['done', 'Completed', xs.done]], ui.xmasFilter, 'xmas-filter')}</div>

  ${filtered.length ? `<div class="grid md:grid-cols-2 gap-4 items-start">${filtered.map(recipientCard).join('')}</div>`
    : `<div class="${CARD}">${emptyBox('gift', R.length ? 'Nobody in this view' : 'No recipients yet', R.length ? '' : 'Import people from your birthday list or add Christmas-only recipients.')}</div>`}`;
}

function recipientCard(r) {
  const spent = recipientSpent(r), budget = num(r.budget), planned = sum(r.gifts, g => num(g.price));
  const done = recipientDone(r);
  const person = r.personId ? byId(state.people, r.personId) : null;
  const past = person ? [...person.history].sort((a, b) => b.year - a.year).slice(0, 3) : [];
  return `<article class="${CARD} p-4 md:p-5">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-full ${avatarCls(r.name)} flex items-center justify-center text-sm font-semibold shrink-0">${initials(r.name)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap"><h3 class="font-semibold text-slate-900 break-words">${esc(r.name)}</h3>
          ${person ? `<span title="Linked to birthday list" class="text-violet-500">${icon('link', 'w-3.5 h-3.5')}</span>` : ''}
          ${done ? pill(`${icon('check', 'w-3 h-3')} Done`, 'bg-emerald-50 text-emerald-700 ring-emerald-200') : ''}</div>
        <p class="text-xs text-slate-500">${money(spent)} spent of ${money(budget)} target${planned > spent ? ` · ${money(planned)} planned` : ''}</p>
      </div>
      <button type="button" data-action="xmas-recipient-edit" data-id="${r.id}" class="${ICON_BTN}" aria-label="Edit recipient">${icon('pencil')}</button>
      <button type="button" data-action="xmas-recipient-delete" data-id="${r.id}" class="${ICON_BTN} -mr-2" aria-label="Remove recipient">${icon('trash-2')}</button>
    </div>
    <div class="mt-3">${progress(budget ? spent / budget * 100 : 0, budget && spent > budget ? 'bg-rose-500' : 'bg-emerald-500')}</div>
    ${budget && spent > budget ? `<p class="text-xs text-rose-600 mt-1">${money(spent - budget)} over target</p>` : ''}
    ${r.notes ? `<p class="text-xs text-slate-500 mt-2">${esc(r.notes)}</p>` : ''}

    <ul class="mt-3 space-y-2">${r.gifts.map(g => { const url = safeUrl(g.link); return `
      <li class="rounded-xl bg-slate-50 p-2.5 flex flex-wrap items-center gap-2">
        <div class="flex-1 min-w-[8rem]">
          <p class="text-sm font-medium text-slate-800 break-words">${esc(g.title)}</p>
          <p class="text-xs text-slate-500">${g.price ? money(g.price) : 'No price'}${url ? ` · <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="text-teal-700 hover:underline">link</a>` : ''}</p>
        </div>
        <select data-change="xmas-gift-status" data-id="${r.id}" data-item="${g.id}" aria-label="Gift status"
          class="rounded-lg border-0 ring-1 ring-inset text-xs font-medium py-1.5 pl-2 pr-7 ${(XMAS_STATUS[XMAS_IDX[g.status]] || XMAS_STATUS[0]).cls}">
          ${XMAS_STATUS.map(s => `<option value="${s.id}" ${s.id === g.status ? 'selected' : ''}>${s.label}</option>`).join('')}
        </select>
        <button type="button" data-action="xmas-gift-edit" data-id="${r.id}" data-item="${g.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Edit gift">${icon('pencil', 'w-3.5 h-3.5')}</button>
        <button type="button" data-action="xmas-gift-delete" data-id="${r.id}" data-item="${g.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Delete gift">${icon('x', 'w-3.5 h-3.5')}</button>
      </li>`; }).join('')}</ul>
    <button type="button" data-action="xmas-gift-new" data-id="${r.id}" class="mt-2 w-full rounded-xl border-2 border-dashed border-slate-200 hover:border-teal-300 hover:bg-teal-50/50 text-sm text-slate-500 hover:text-teal-700 py-2 flex items-center justify-center gap-2 transition">${icon('plus')}Add gift</button>
    ${past.length ? `<details class="mt-3"><summary class="text-xs text-slate-500 flex items-center gap-1">${icon('history', 'w-3.5 h-3.5')} Previously given (avoid repeats)<span class="chev transition">${icon('chevron-down', 'w-3.5 h-3.5')}</span></summary>
      <ul class="mt-2 text-xs text-slate-600 space-y-1 pl-5 list-disc">${past.map(h => `<li>${esc(h.year)} ${esc(h.occasion || '')}: ${esc(h.gift)}</li>`).join('')}</ul></details>` : ''}
  </article>`;
}

/* ---------- 6.5 HOUSEHOLD VAULT ---------- */
function vaultMatches(v) {
  const q = ui.vaultSearch.trim().toLowerCase();
  if (ui.vaultCat !== 'all' && v.category !== ui.vaultCat) return false;
  if (!q) return true;
  return [v.provider, v.name, v.accountNo, v.location, v.notes, vcat(v.category).label].some(x => String(x || '').toLowerCase().includes(q));
}
function vaultListHTML() {
  const items = state.vault.filter(vaultMatches).sort((a, b) => (a.renewalDate || '9999') < (b.renewalDate || '9999') ? -1 : 1);
  if (!items.length) return `<div class="${CARD}">${emptyBox('search', state.vault.length ? 'No matches' : 'Your vault is empty', state.vault.length ? 'Try a different search or category.' : 'Add mortgages, insurance, utilities and savings so you both know where everything lives.', state.vault.length ? '' : `<button type="button" data-action="vault-new" class="${BTN_SOFT}">${icon('plus')}Add first entry</button>`)}</div>`;
  const cats = ui.vaultCat === 'all' ? vcats().map(c => vcat(c.id)) : [vcat(ui.vaultCat)];
  return cats.map(c => {
    const group = items.filter(v => vcat(v.category).id === c.id);
    if (!group.length) return '';
    return `<section class="mb-6">
      <h3 class="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-3"><span class="w-7 h-7 rounded-lg ${c.bg} ${c.fg} flex items-center justify-center">${icon(c.icon, 'w-4 h-4')}</span>${c.label}<span class="text-slate-400 font-normal">${group.length}</span></h3>
      <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 items-start">${group.map(vaultCard).join('')}</div>
    </section>`;
  }).join('');
}
function vaultCard(v) {

      <div class="w-10 h-10 rounded-xl ${c.bg} ${c.fg} flex items-center justify-center shrink-0">${icon(c.icon, 'w-5 h-5')}</div>
      <div class="flex-1 min-w-0"><h4 class="font-semibold text-slate-900 break-words">${esc(v.provider)}</h4><p class="text-xs text-slate-500 break-words">${esc(v.name || c.label)}</p></div>
      ${renewalBadge(v.renewalDate)}
    </div>
    <dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
      <div class="col-span-2"><dt class="text-xs text-slate-500">Policy / account number</dt>
        <dd class="flex items-center gap-1 font-mono text-[13px] text-slate-800 break-all">${v.accountNo ? `${esc(v.accountNo)}<button type="button" data-action="copy" data-val="${esc(v.accountNo)}" class="${ICON_BTN} !w-7 !h-7" aria-label="Copy number">${icon('copy', 'w-3.5 h-3.5')}</button>` : '—'}</dd></div>

      <div class="col-span-2"><dt class="text-xs text-slate-500">Cost</dt><dd class="text-slate-800">${cost ? `<span class="font-semibold">${money(cost)}</span> / ${monthly ? 'month' : 'year'} <span class="text-xs text-slate-400">(≈ ${monthly ? money(cost * 12) + ' a year' : money(cost / 12) + ' a month'})</span>` : '—'}</dd></div>
    </dl>
    ${v.location ? `<div class="rounded-xl bg-teal-50 ring-1 ring-teal-100 p-3 flex gap-2.5">
        <span class="text-teal-600 mt-0.5">${icon('map-pin', 'w-4 h-4')}</span>
        <div><p class="text-[11px] font-semibold text-teal-800 uppercase tracking-wider">Where to find it</p><p class="text-sm text-teal-900 break-words">${esc(v.location)}</p></div></div>`
      : `<button type="button" data-action="vault-edit" data-id="${v.id}" class="rounded-xl bg-amber-50 ring-1 ring-amber-100 p-3 text-left text-sm text-amber-800 flex gap-2">${icon('map-pin', 'w-4 h-4 mt-0.5')}Add where the documents are kept</button>`}
    ${v.notes ? `<p class="text-sm text-slate-600 whitespace-pre-line bg-slate-50 rounded-xl p-3 break-words">${esc(v.notes)}</p>` : ''}
    <div class="flex items-center gap-2 pt-1 mt-auto">
      ${v.inBudget ? pill(`${icon('wallet', 'w-3 h-3')} In budget`, 'bg-emerald-50 text-emerald-700 ring-emerald-200') : ''}
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="${BTN_SOFT} !py-1.5 !text-xs">${icon('external-link', 'w-3.5 h-3.5')}Login / portal</a>` : ''}
      <button type="button" data-action="vault-edit" data-id="${v.id}" class="${ICON_BTN} ml-auto" aria-label="Edit">${icon('pencil')}</button>
      <button type="button" data-action="vault-delete" data-id="${v.id}" class="${ICON_BTN} -mr-2 hover:!text-rose-600" aria-label="Delete">${icon('trash-2')}</button>
    </div>
  </article>`;

function renderVault() {
  const V = state.vault;
  const monthlyTotal = sum(V, v => v.costPeriod === 'monthly' ? num(v.cost) : num(v.cost) / 12);
  const soon = V.filter(v => { const d = daysUntil(v.renewalDate); return d !== null && d < 60; }).length;
  const noLoc = V.filter(v => !v.location).length;
  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Entries</p><p class="text-2xl font-bold text-slate-900 mt-1">${V.length}</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Monthly outgoings</p><p class="text-2xl font-bold text-slate-900 mt-1">${money(monthlyTotal)}</p><p class="text-xs text-slate-500">${money(monthlyTotal * 12)} a year</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Renewing within 60 days</p><p class="text-2xl font-bold ${soon ? 'text-amber-600' : 'text-slate-900'} mt-1">${soon}</p></div>

        <div class="flex-1 min-w-0"><p class="text-sm font-medium text-slate-800 truncate">${esc(Auth.user?.displayName || 'Signed in')}</p><p class="text-xs text-slate-500 truncate">${esc(Auth.email())}</p></div>

    <section class="${CARD} p-5">
      <h3 class="font-semibold text-slate-900 flex items-center gap-2 mb-1">${icon('layout-grid', 'w-5 h-5 text-violet-600')} Other tools</h3>
      <p class="text-sm text-slate-500 mb-4">Occasional tools kept out of the main menu – currently the ${TOOLS.map(t => t.title.toLowerCase()).join(', ')}.</p>

      <p class="text-sm text-slate-500 mb-4">Both phones share one Household ID in your Firebase Realtime Database. Only the approved Google accounts can read or write it.</p>
      <form data-form="sync-settings" class="space-y-4">

        ${chk('enabled', 'Enable automatic sync on this device', sc.enabled)}
        <div class="flex flex-wrap gap-2">
          <button type="submit" class="${BTN_PRIMARY}">${icon('check')}Save &amp; connect</button>

      <div class="flex flex-wrap gap-2">
        <button type="button" data-action="clear-sample" class="${BTN_GHOST}" ${sampleCount ? '' : 'disabled style="opacity:.5"'}>${icon('eraser')}Clear sample data</button>
        <button type="button" data-action="load-sample" class="${BTN_GHOST}">${icon('rotate-ccw')}Reload sample data</button>
        <button type="button" data-action="reset-all" class="${BTN_DANGER}">${icon('trash-2')}Erase everything</button>

/* ---------- 6.8 FINANCE PLANNER ---------- */
/** Like field(), but a <div> wrapper – for groups of radios (nested <label>s are invalid HTML). */
const fieldDiv = (label, input, hint = '') => `<div><span class="block text-sm font-medium text-slate-700 mb-1.5">${label}</span>${input}${hint ? `<span class="block text-xs text-slate-500 mt-1">${hint}</span>` : ''}</div>`;
const seg = (name, opts, val) => `<div class="flex rounded-xl bg-slate-100 p-1">${opts.map(([k, l]) => `<label class="flex-1 cursor-pointer"><input type="radio" name="${name}" value="${k}" class="peer sr-only" ${val === k ? 'checked' : ''}><span class="block text-center rounded-lg px-3 py-2 text-sm font-medium text-slate-500 peer-checked:bg-white peer-checked:shadow-sm peer-checked:text-slate-900">${l}</span></label>`).join('')}</div>`;
const perLabel = o => o.frequency === 'yearly' ? 'yr' : 'mo';

function renderFinance() {
  const st = finStats();
  const tabs = [['overview', 'Overview', 'layout-dashboard'], ['income', 'Income', 'arrow-down-left'], ['outgoings', 'Outgoings', 'arrow-up-right'], ['savings', 'Savings', 'piggy-bank'], ['import', 'Find from bank CSV', 'file-search']];
  const body = { overview: finOverview, income: finIncomeTab, outgoings: finOutTab, savings: finSavingsTab, import: finImportTab }[ui.finTab] || finOverview;
  return `
  <a href="#/tools" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 mb-3">${icon('arrow-left')}Other tools</a>
  <div class="flex gap-1 overflow-x-auto no-scrollbar rounded-xl bg-slate-100 p-1 mb-5">
    ${tabs.map(([v, l, i]) => `<button type="button" data-action="fin-tab" data-val="${v}" class="shrink-0 inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium transition ${ui.finTab === v ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500 hover:text-slate-700'}">${icon(i)}${l}</button>`).join('')}
  </div>
  ${body(st)}`;
}

function finRow(o, kind) {
  const yearly = o.frequency === 'yearly';
  return `<li class="flex items-center gap-3 py-3">
    <div class="flex-1 min-w-0">
      <p class="text-sm font-medium text-slate-800 break-words">${esc(o.name)}</p>
      <div class="flex flex-wrap items-center gap-1.5 mt-1">
        ${pill(FIN_FREQ[o.frequency] || 'Monthly', yearly ? 'bg-amber-50 text-amber-700 ring-amber-200' : 'bg-slate-50 text-slate-600 ring-slate-200')}
        ${kind === 'out' ? pill(FIN_TYPES[o.type] || 'Essential', o.type === 'discretionary' ? 'bg-violet-50 text-violet-700 ring-violet-200' : 'bg-teal-50 text-teal-700 ring-teal-200') : ''}
        ${o.src === 'vault' ? pill(`${icon('shield-check', 'w-3 h-3')} From vault`, 'bg-indigo-50 text-indigo-700 ring-indigo-200') : ''}
        ${yearly && o.dueDate ? `<span class="text-xs text-slate-500">next due ${fmtDate(nextAnnual(o.dueDate))}</span>` : ''}
        ${yearly && kind === 'out' && !o.dueDate ? `<span class="text-xs text-amber-700">no due date</span>` : ''}
      </div>
      ${o.notes ? `<p class="text-xs text-slate-500 mt-1 break-words">${esc(o.notes)}</p>` : ''}
    </div>
    <div class="text-right shrink-0">
      <p class="text-sm font-semibold text-slate-900 tabular-nums">${money(o.amount)}<span class="text-xs font-normal text-slate-500">/${perLabel(o)}</span></p>
      ${yearly ? `<p class="text-xs text-slate-500 tabular-nums">${money(num(o.amount) / 12)}/mo</p>` : ''}
    </div>
    <div class="flex shrink-0 -mr-2">
      <button type="button" data-action="fin-edit-${kind}" data-id="${o.id}" class="${ICON_BTN}" aria-label="Edit">${icon('pencil')}</button>
      <button type="button" data-action="fin-del-${kind}" data-id="${o.id}" class="${ICON_BTN} hover:!text-rose-600" aria-label="${o.src === 'vault' ? 'Remove from budget' : 'Delete'}">${icon(o.src === 'vault' ? 'unlink' : 'trash-2')}</button>
    </div>
  </li>`;
}

function finBillsPotCard() {
  const F = fin(), bp = billsPotStatus(), st = finStats();
  const has = bp.items.length > 0;
  const ok = bp.diff >= -0.5;
  const upcoming = bp.items.filter(i => i.due).slice(0, 5);
  return `<section class="${CARD} p-5">
    <div class="flex items-start justify-between gap-2 mb-3">
      <h3 class="font-semibold text-slate-900 flex items-center gap-2">${icon('piggy-bank', 'w-5 h-5 text-amber-600')}${esc(F.billsPot.name)}</h3>
      <button type="button" data-action="billspot-edit" class="${BTN_GHOST} !py-1.5 !text-xs shrink-0">${icon('pencil', 'w-3.5 h-3.5')}Update balance</button>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="rounded-xl bg-slate-50 p-2.5"><p class="text-[11px] text-slate-500">Pay in monthly</p><p class="font-semibold text-slate-900 tabular-nums">${money(st.billsPot)}</p></div>
      <div class="rounded-xl bg-slate-50 p-2.5"><p class="text-[11px] text-slate-500">Balance</p><p class="font-semibold text-slate-900 tabular-nums">${money(bp.balance)}</p></div>
      <div class="rounded-xl bg-slate-50 p-2.5"><p class="text-[11px] text-slate-500">Should hold now</p><p class="font-semibold text-slate-900 tabular-nums">${money(bp.expected)}</p></div>
    </div>
    ${!has ? '<p class="text-sm text-slate-500 mt-3">No yearly bills yet – add outgoings set to “Yearly” and they’ll be saved for here at ÷ 12 a month.</p>'
      : ok ? `<p class="mt-3 text-sm rounded-xl bg-emerald-50 text-emerald-800 px-3 py-2 flex gap-2 items-center">${icon('circle-check', 'w-4 h-4 shrink-0')}On track${bp.diff > 1 ? ` – ${money(bp.diff)} ahead` : ''}.</p>`
      : `<p class="mt-3 text-sm rounded-xl bg-amber-50 text-amber-800 px-3 py-2 flex gap-2 items-start">${icon('triangle-alert', 'w-4 h-4 shrink-0 mt-0.5')}<span>Short by <b>${money(-bp.diff)}</b>. Top up the pot now, or spread it before the next bill${upcoming[0] ? ` on ${fmtDate(upcoming[0].due)}` : ''}.</span></p>`}
    ${bp.undated ? `<p class="text-xs text-slate-500 mt-2">${bp.undated} yearly bill${bp.undated > 1 ? 's have' : ' has'} no due date, so ${bp.undated > 1 ? 'they are' : 'it is'} not included in “should hold now”.</p>` : ''}
    ${upcoming.length ? `<ul class="mt-3 divide-y divide-slate-100">${upcoming.map(i => `
      <li class="flex items-center gap-3 py-2 text-sm">
        <span class="flex-1 min-w-0"><span class="block text-slate-800 truncate">${esc(i.o.name)}</span><span class="block text-xs text-slate-500">${fmtDate(i.due)} · ${relDays(i.days)}</span></span>
        <span class="text-right"><span class="block font-medium tabular-nums">${money(i.o.amount)}</span><span class="block text-xs text-slate-500 tabular-nums">${money(i.expected)} saved by now</span></span>
      </li>`).join('')}</ul>` : ''}
  </section>`;
}

function finOverview(st) {
  const F = fin();
  if (!F.incomes.length && !st.outs.length && !F.pots.length) {
    return `<div class="${CARD}">${emptyBox('wallet', 'Set up your budget', 'Add your take-home pay and regular outgoings, or let the bank CSV finder suggest them.',
      `<div class="flex flex-wrap justify-center gap-2"><button type="button" data-action="fin-add-income" class="${BTN_PRIMARY}">${icon('plus')}Add income</button>
       <button type="button" data-action="fin-add-out" class="${BTN_GHOST}">${icon('plus')}Add outgoing</button>
       <button type="button" data-action="fin-tab" data-val="import" class="${BTN_GHOST}">${icon('file-search')}Find from bank CSV</button></div>`)}</div>`;
  }
  const row = (label, val, sub = '', cls = 'text-slate-900', strong = false) => `<div class="flex items-baseline justify-between gap-3 py-2">
    <div class="min-w-0"><p class="text-sm ${strong ? 'font-semibold text-slate-900' : 'text-slate-700'}">${label}</p>${sub ? `<p class="text-xs text-slate-500">${sub}</p>` : ''}</div>
    <p class="${strong ? 'text-lg font-bold' : 'font-semibold'} tabular-nums whitespace-nowrap ${cls}">${val}</p></div>`;
  const pct = v => st.income > 0 ? Math.max(0, v / st.income * 100) : 0;
  const segs = [[st.monthlyOut, 'bg-rose-400', 'Monthly outgoings'], [st.billsPot, 'bg-amber-400', 'Bills pot'], [st.savings, 'bg-sky-500', 'Savings'], [Math.max(0, st.left), 'bg-emerald-500', 'Left to spend']];
  const cats = Object.entries(st.byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = cats.length ? cats[0][1] : 0;
  const ed = st.essential + st.discretionary;
  return `
  <div class="grid lg:grid-cols-2 gap-4 items-start">
    <section class="${CARD} p-5 lg:row-span-2">
      <h3 class="font-semibold text-slate-900 flex items-center gap-2 mb-2">${icon('scale', 'w-5 h-5 text-teal-600')} Monthly budget</h3>
      <div class="divide-y divide-slate-100">
        ${row('Take-home income', money(st.income), `${F.incomes.length} source${F.incomes.length === 1 ? '' : 's'}`, 'text-emerald-700')}
        ${row('Monthly outgoings', '− ' + money(st.monthlyOut), `${st.monthlyItems.length} item${st.monthlyItems.length === 1 ? '' : 's'}`)}
        ${row('Annual bills pot (yearly ÷ 12)', '− ' + money(st.billsPot), `${money(st.yearlyTotal)} a year → ${esc(F.billsPot.name)}`)}
        ${row('Available after bills', money(st.available), '', st.available < 0 ? 'text-rose-600' : 'text-slate-900', true)}
        ${row('Savings pots', '− ' + money(st.savings), `${F.pots.length} pot${F.pots.length === 1 ? '' : 's'}`)}
        ${row('Left to spend each month', money(st.left), st.left < 0 ? 'Over-committed – reduce savings or outgoings' : '', st.left < 0 ? 'text-rose-600' : 'text-emerald-700', true)}
      </div>
      ${st.income > 0 ? `<div class="mt-4">
        <div class="h-3 rounded-full bg-slate-100 overflow-hidden flex">${segs.map(([v, c]) => `<div class="${c} h-full" style="width:${Math.min(100, pct(v))}%"></div>`).join('')}</div>
        <div class="flex flex-wrap gap-x-4 gap-y-1 mt-2">${segs.map(([v, c, l]) => `<span class="inline-flex items-center gap-1.5 text-xs text-slate-600"><span class="w-2.5 h-2.5 rounded-full ${c}"></span>${l} ${Math.round(pct(v))}%</span>`).join('')}</div>
      </div>` : ''}
    </section>

    <section class="${CARD} p-5">
      <h3 class="font-semibold text-slate-900 mb-3">Essential vs discretionary <span class="text-xs font-normal text-slate-500">(monthly, incl. yearly ÷ 12)</span></h3>
      <div class="grid grid-cols-2 gap-3 mb-3">
        <div><p class="text-xs text-slate-500">Essential</p><p class="text-xl font-bold text-teal-700 tabular-nums">${money(st.essential)}</p></div>
        <div><p class="text-xs text-slate-500">Discretionary</p><p class="text-xl font-bold text-violet-700 tabular-nums">${money(st.discretionary)}</p></div>
      </div>
      <div class="h-2.5 rounded-full bg-slate-100 overflow-hidden flex"><div class="bg-teal-500 h-full" style="width:${ed ? st.essential / ed * 100 : 0}%"></div><div class="bg-violet-400 h-full" style="width:${ed ? st.discretionary / ed * 100 : 0}%"></div></div>
    </section>

    ${finBillsPotCard()}

    <section class="${CARD} p-5 lg:col-span-2">
      <h3 class="font-semibold text-slate-900 mb-3">Outgoings by category <span class="text-xs font-normal text-slate-500">(monthly equivalent)</span></h3>
      ${cats.length ? `<ul class="space-y-3">${cats.map(([id, v]) => `<li>
        <div class="flex justify-between gap-3 text-sm mb-1"><span class="text-slate-700">${esc(finCat('out', id).label)}</span><span class="tabular-nums text-slate-900 font-medium">${money(v)} <span class="text-xs font-normal text-slate-500">${st.income ? Math.round(v / st.income * 100) + '% of income' : ''}</span></span></div>
        ${progress(maxCat ? v / maxCat * 100 : 0, 'bg-teal-500')}</li>`).join('')}</ul>` : '<p class="text-sm text-slate-500">No outgoings yet.</p>'}
    </section>
  </div>`;
}

function finIncomeTab(st) {
  const F = fin();
  const groups = F.incomeCats.map(c => ({ c, items: F.incomes.filter(o => finCat('income', o.categoryId).id === c.id) })).filter(g => g.items.length);
  return `
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
    <div><p class="text-xs text-slate-500">Joint monthly take-home</p><p class="text-2xl font-bold text-emerald-700 tabular-nums">${money(st.income)}</p></div>
    <div class="flex gap-2"><button type="button" data-action="fin-cats" data-val="income" class="${BTN_GHOST}">${icon('tags')}Categories</button>
    <button type="button" data-action="fin-add-income" class="${BTN_PRIMARY}">${icon('plus')}Add income</button></div>
  </div>
  <p class="text-sm text-slate-500 mb-4">Enter take-home pay only (after tax, NI and pension). Yearly amounts are spread ÷ 12.</p>
  ${groups.length ? `<div class="space-y-4">${groups.map(g => `<section class="${CARD} px-4 md:px-5 pt-3">
      <div class="flex justify-between text-sm"><h3 class="font-semibold text-slate-800">${esc(g.c.label)}</h3><span class="text-slate-500 tabular-nums">${money(sum(g.items, monthlyOf))}/mo</span></div>
      <ul class="divide-y divide-slate-100">${g.items.map(o => finRow(o, 'income')).join('')}</ul></section>`).join('')}</div>`
