<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Home Hub" />
  <title>Home Hub · Household Organiser</title>
  <!-- Application configuration is kept separate from the page markup. -->
  <script src="js/config.js"></script>

  <!-- Tailwind CSS (CDN, no build step needed for GitHub Pages) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Lucide icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>

<body class="bg-slate-50 text-slate-800 antialiased font-sans">
  <!-- ============ SIGN-IN GATE (shown until an allowed Google account is signed in) ============ -->
  <div id="auth-gate" class="fixed inset-0 z-[70] bg-gradient-to-br from-slate-50 via-teal-50/40 to-emerald-50/60 flex items-center justify-center p-6 overflow-y-auto"></div>

  <!-- ============ APP SHELL (hidden until authorised) ============ -->
  <div id="app-shell" class="hidden" aria-hidden="true">
  <div class="min-h-screen md:flex">

    <!-- ============ DESKTOP SIDEBAR ============ -->
    <aside class="hidden md:flex md:flex-col w-64 shrink-0 bg-white border-r border-slate-200 h-screen sticky top-0">
      <div class="px-6 py-6 flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 text-white flex items-center justify-center shadow-sm">
          <i data-lucide="house" class="w-5 h-5"></i>
        </div>
        <div>
          <p class="font-bold text-slate-900 leading-tight">Home Hub</p>
          <p class="text-xs text-slate-500">Household organiser</p>
        </div>
      </div>
      <nav id="side-nav" class="flex-1 px-3 space-y-1"></nav>
      <div class="p-4 border-t border-slate-100">
        <button type="button" data-action="open-backup" class="w-full flex items-center gap-2 text-xs text-slate-500 hover:text-slate-700">
          <span id="sync-indicator-side"></span>
        </button>
        <div class="mt-3 flex items-center gap-2">
          <p id="account-side" class="flex-1 min-w-0 truncate text-xs text-slate-500"></p>
          <button type="button" data-action="sign-out" class="inline-flex items-center gap-1 rounded-lg px-2 py-1 text-xs font-medium text-slate-500 hover:text-rose-600 hover:bg-rose-50">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>Sign out
          </button>
        </div>
      </div>
    </aside>

    <!-- ============ MAIN COLUMN ============ -->
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-slate-200/70">
        <div class="max-w-6xl mx-auto px-4 md:px-8 h-16 flex items-center gap-3">
          <div class="md:hidden w-9 h-9 rounded-xl bg-gradient-to-br from-teal-500 to-emerald-600 text-white flex items-center justify-center">
            <i data-lucide="house" class="w-5 h-5"></i>
          </div>
          <h1 id="page-title" class="text-lg md:text-xl font-semibold text-slate-900 flex-1 truncate">Home</h1>
          <span id="sync-indicator-head" class="hidden sm:inline-flex"></span>
          <button type="button" data-action="open-backup"
            class="inline-flex items-center gap-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 text-sm font-medium shadow-sm transition">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i><span class="hidden sm:inline">Backup / Sync</span><span class="sm:hidden">Sync</span>
          </button>
          <a href="#/settings" class="md:hidden w-10 h-10 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-600" aria-label="Settings">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </a>
          <button type="button" data-action="sign-out" class="md:hidden w-10 h-10 rounded-xl hover:bg-rose-50 hover:text-rose-600 flex items-center justify-center text-slate-600" aria-label="Sign out">
            <i data-lucide="log-out" class="w-5 h-5"></i>
          </button>
        </div>
      </header>

      <main id="view" class="flex-1 w-full max-w-6xl mx-auto px-4 md:px-8 pt-5 md:pt-8 pb-32 md:pb-12"></main>
    </div>
  </div>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav id="bottom-nav" class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white/95 backdrop-blur border-t border-slate-200 safe-bottom">
    <div id="bottom-nav-inner" class="grid grid-cols-5"></div>
  </nav>

  <!-- ============ QUICK-ADD FLOATING BUTTON ============ -->
  <button type="button" data-action="open-quickadd" aria-label="Quick add"
    class="fixed z-30 right-4 bottom-24 md:bottom-8 md:right-8 w-14 h-14 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white shadow-lg shadow-teal-600/30 flex items-center justify-center transition active:scale-95">
    <i data-lucide="plus" class="w-7 h-7"></i>
  </button>
  </div><!-- /#app-shell -->

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed z-[60] inset-x-0 bottom-24 md:bottom-8 flex flex-col items-center gap-2 pointer-events-none px-4"></div>
  <input type="file" id="import-file" accept="application/json,.json" class="hidden" />
<script src="js/constants.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/domain.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/tasks.js"></script>
<script src="js/views/birthdays.js"></script>
<script src="js/views/christmas.js"></script>
<script src="js/views/vault.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/tools.js"></script>
<script src="js/views/finance.js"></script>
<script src="js/forms.js"></script>
<script src="js/csv.js"></script>
<script src="js/backup.js"></script>
<script src="js/sync.js"></script>
<script src="js/actions.js"></script>
<script src="js/app.js"></script>

<!-- Firebase modular SDK v10 (Auth + Realtime Database) -->
<script type="module" src="js/firebase.js"></script>
</body>
</html>
