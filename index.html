<script>
'use strict';
/* =====================================================================
   HOME HUB – single-file household organiser
   ---------------------------------------------------------------------
   Sections:
     1. Constants & configuration
     2. Utility helpers (dates, money, escaping)
     3. State: defaults, sample data, load / save / normalise
     4. Domain helpers (birthdays, Christmas stats, renewals)
     5. UI primitives (icons, pills, inputs, modal, toast)
     6. Views: Dashboard, Tasks, Birthdays, Christmas, Vault, Settings
     7. Forms (modals)
     8. Backup: export / import / share
     9. Cloud sync (Firebase Realtime DB via REST+SSE, or Supabase REST)
    10. Actions & event delegation
    11. Router & boot
   ===================================================================== */

/* =========================== 1. CONSTANTS =========================== */
const STORE_KEY  = 'homehub.data.v1';
const CLIENT_KEY = 'homehub.clientId';
const CLIENT_ID  = localStorage.getItem(CLIENT_KEY) || (() => {
  const id = 'c_' + Math.random().toString(36).slice(2, 10);

  return id;
})();

/* ========================= 2. UTILITY HELPERS ======================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GBP = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
const money = n => GBP.format(Number(n) || 0);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[£,\s]/g, '')); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const sum = (arr, f) => arr.reduce((t, x) => t + (f ? f(x) : x), 0);
const byId = (arr, id) => arr.find(x => x.id === id);
const touch = o => { if (o) o.updatedAt = Date.now(); return o; };
const clone = o => JSON.parse(JSON.stringify(o));

function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const todayStr = () => ymd(new Date());
function parseYMD(s) { if (!s) return null; const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseYMD(s); d.setDate(d.getDate() + n); return ymd(d); }
function daysUntil(s) { if (!s) return null; return Math.round((parseYMD(s) - parseYMD(todayStr())) / 864e5); }
function fmtDate(s, opts) { if (!s) return '—'; return parseYMD(s).toLocaleDateString('en-GB', opts || { day: 'numeric', month: 'short', year: 'numeric' }); }
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
function relDays(d) {
  if (d === null) return '';
  if (d === 0) return 'Today';
  if (d === 1) return 'Tomorrow';
  if (d === -1) return 'Yesterday';
  return d < 0 ? `${-d} days ago` : `in ${d} days`;
}
function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(u)) return 'https://' + u;
  return '';
}
function initials(n) { return String(n || '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?'; }
const AVATAR_COLOURS = ['bg-teal-100 text-teal-700', 'bg-sky-100 text-sky-700', 'bg-violet-100 text-violet-700', 'bg-rose-100 text-rose-700', 'bg-amber-100 text-amber-700', 'bg-emerald-100 text-emerald-700', 'bg-indigo-100 text-indigo-700'];
function avatarCls(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVATAR_COLOURS[h % AVATAR_COLOURS.length]; }

/* ===================== 3. STATE: DEFAULTS & STORAGE ==================== */
function defaultState() {
  return {
    version: 1,
    tasks: [],
    checklists: [],
    people: [],
    christmas: { year: new Date().getFullYear(), budget: 0, recipients: [], archive: [] },
    vault: [],
    settings: { sync: { enabled: false, provider: 'firebase', url: '', key: '', householdId: '', lastSync: null } },
    meta: { updatedAt: Date.now(), updatedBy: CLIENT_ID }
  };
}

  ];
  s.people.forEach(p => { p.cycleFor = nextBirthday(p).date; });

    recipients: [

let state;
let ui = {
  taskFilter: 'open', taskCat: 'all', tasksTab: 'tasks',
  clCollapsed: {}, personOpen: {},
  xmasFilter: 'all', vaultCat: 'all', vaultSearch: ''
};

/** Fill in any missing keys so older/imported data never crashes the UI. */
function normalise(raw) {
  const d = defaultState();
  const s = Object.assign(d, raw || {});
  s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
  s.checklists = (Array.isArray(s.checklists) ? s.checklists : []).map(c => ({ items: [], ...c, items: Array.isArray(c.items) ? c.items : [] }));
  s.people = (Array.isArray(s.people) ? s.people : []).map(p => ({ ideas: [], history: [], finalGift: null, cardBought: false, cardSent: false, yearKnown: true, ...p,
    ideas: Array.isArray(p.ideas) ? p.ideas : [], history: Array.isArray(p.history) ? p.history : [] }));
  s.christmas = Object.assign({ year: new Date().getFullYear(), budget: 0, recipients: [], archive: [] }, s.christmas || {});
  s.christmas.recipients = (s.christmas.recipients || []).map(r => ({ gifts: [], ...r, gifts: Array.isArray(r.gifts) ? r.gifts : [] }));
  s.vault = Array.isArray(s.vault) ? s.vault : [];
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  s.settings.sync = Object.assign(defaultState().settings.sync, s.settings.sync || {});
  s.meta = Object.assign({ updatedAt: Date.now(), updatedBy: CLIENT_ID }, s.meta || {});
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return normalise(JSON.parse(raw));
  } catch (e) { console.warn('Could not read saved data', e); }
  const s = sampleState();
  localStorage.setItem(STORE_KEY, JSON.stringify(s));
  return s;
}

/** Write to localStorage only (no timestamp bump, no cloud push). */
function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/** Record a user change: bump timestamp, persist and (if enabled) push to the cloud. */
function save() {
  state.meta.updatedAt = Date.now();
  state.meta.updatedBy = CLIENT_ID;
  try { persist(); } catch (e) { toast('Could not save – storage may be full', 'error'); }
  Sync.schedulePush();
}
function commit() { save(); render(); }

/** The shareable part of state (device-specific sync settings are excluded). */
function exportable() {
  const { settings, ...rest } = state;
  return clone(rest);
}

/* ======================== 4. DOMAIN HELPERS ========================== */
function bdayInYear(dob, year) {
  const [, m, d] = dob.split('-').map(Number);
  const day = (m === 2 && d === 29 && !isLeap(year)) ? 28 : d;
  return ymd(new Date(year, m - 1, day));
}
/** Next occurrence (today counts) – returns { date, days, turning } */
function nextBirthday(p) {
  if (!p.dob) return { date: null, days: 9999, turning: null };
  const t = todayStr();
  const y = new Date().getFullYear();
  let date = bdayInYear(p.dob, y);
  if (date < t) date = bdayInYear(p.dob, y + 1);
  const turning = p.yearKnown !== false ? Number(date.slice(0, 4)) - Number(p.dob.slice(0, 4)) : null;
  return { date, days: daysUntil(date), turning };
}

/** Once a birthday has passed, archive the chosen gift and reset card/gift trackers for next year. */
function ensureCycles() {
  let changed = false;
  const t = todayStr();
  state.people.forEach(p => {
    if (!p.dob) return;
    const nb = nextBirthday(p).date;
    if (!p.cycleFor) { p.cycleFor = nb; changed = true; return; }
    if (p.cycleFor < t) {
      if (p.finalGift && p.finalGift.title) {
        p.history.unshift({ id: uid(), year: Number(p.cycleFor.slice(0, 4)), occasion: 'Birthday', gift: p.finalGift.title, price: num(p.finalGift.price), notes: 'Auto-archived after birthday' });
      }
      p.finalGift = null; p.cardBought = false; p.cardSent = false; p.cycleFor = nb;
      touch(p); changed = true;
    }
  });
  if (changed) save();
}

const recipientDone = r => r.gifts.length > 0 && r.gifts.every(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX);
const recipientSpent = r => sum(r.gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX), g => num(g.price));
function xmasStats() {
  const c = state.christmas, R = c.recipients;
  const gifts = R.flatMap(r => r.gifts);
  const spent = sum(gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX), g => num(g.price));
  return {
    budget: num(c.budget), spent,
    planned: sum(gifts, g => num(g.price)),
    budgeted: sum(R, r => num(r.budget)),
    remaining: num(c.budget) - spent,
    done: R.filter(recipientDone).length, total: R.length,
    giftsTotal: gifts.length, giftsBought: gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX).length,
    days: daysUntil(`${c.year}-12-25`)
  };
}

function sortTasks(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  const ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
  if (ad !== bd) return ad < bd ? -1 : 1;
  return (PRIORITIES[a.priority]?.rank ?? 1) - (PRIORITIES[b.priority]?.rank ?? 1);
}

const icon = (n, c = 'w-4 h-4') => `<i data-lucide="${n}" class="${c}"></i>`;
const pill = (text, cls) => `<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${cls}">${text}</span>`;

function progress(pct, colour = 'bg-teal-500', h = 'h-2') {

  return `<div class="${h} rounded-full bg-slate-100 overflow-hidden"><div class="h-full ${colour} rounded-full transition-all duration-500" style="width:${pct}%"></div></div>`;
}
function emptyBox(iconName, title, sub, actionHtml = '') {
  return `<div class="text-center py-10 px-4">
    <div class="mx-auto w-12 h-12 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mb-3">${icon(iconName, 'w-6 h-6')}</div>

}
function filterPills(items, current, action) {
  return `<div class="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1">${items.map(([val, label, count]) => `
    <button type="button" data-action="${action}" data-val="${val}"

      ${label}${count !== undefined ? ` <span class="${current === val ? 'text-slate-300' : 'text-slate-400'}">${count}</span>` : ''}

}
function renewalBadge(s) {
  const d = daysUntil(s);
  if (d === null) return pill('No date', 'bg-slate-50 text-slate-500 ring-slate-200');
  if (d < 0) return pill(`${icon('triangle-alert', 'w-3 h-3')} Ended ${-d}d ago`, 'bg-rose-50 text-rose-700 ring-rose-200');
  const label = d === 0 ? 'Today' : d > 90 ? `${Math.round(d / 30.4)} months` : `${d} day${d === 1 ? '' : 's'}`;
  if (d < 14) return pill(`${icon('clock', 'w-3 h-3')} ${label}`, 'bg-rose-50 text-rose-700 ring-rose-200');
  if (d < 60) return pill(`${icon('clock', 'w-3 h-3')} ${label}`, 'bg-amber-50 text-amber-700 ring-amber-200');
  return pill(label, 'bg-emerald-50 text-emerald-700 ring-emerald-200');
}

const field = (label, input, hint = '') => `<label class="block"><span class="block text-sm font-medium text-slate-700 mb-1.5">${label}</span>${input}${hint ? `<span class="block text-xs text-slate-500 mt-1">${hint}</span>` : ''}</label>`;
const inp = (name, val = '', attrs = '') => `<input name="${name}" value="${esc(val)}" class="${INPUT}" ${attrs}>`;

const sel = (name, opts, val) => `<select name="${name}" class="${INPUT}">${opts.map(([k, v]) => `<option value="${esc(k)}" ${String(k) === String(val) ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select>`;
const chk = (name, label, checked, hint = '') => `<label class="flex items-start gap-3 rounded-xl bg-slate-50 px-3 py-3 cursor-pointer">

function refreshIcons() { if (window.lucide) { try { lucide.createIcons(); } catch (e) { /* offline */ } } }

// ---- Toast ----
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `anim-up pointer-events-auto rounded-xl px-4 py-2.5 text-sm font-medium shadow-lg ${type === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white'}`;
  el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2600);
}

// ---- Modal (one at a time; bottom-sheet on mobile, centred dialog on desktop) ----
let modalHandler = null, modalSeq = 0;
function openModal({ title, body, submitLabel = 'Save', onSubmit = null, footer = '', danger = false, wide = false }) {
  modalSeq++;
  modalHandler = onSubmit;
  $('#modal-root').innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center sm:p-4">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] anim-fade" data-action="close-modal"></div>
    <form id="modal-form" class="relative anim-up bg-white w-full ${wide ? 'sm:max-w-2xl' : 'sm:max-w-lg'} rounded-t-3xl sm:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col" autocomplete="off">
      <div class="flex items-center gap-3 px-5 pt-5 pb-3 border-b border-slate-100">

      </div>

      ${onSubmit ? `<div class="flex gap-2 justify-end px-5 py-4 border-t border-slate-100 safe-bottom">
        <button type="button" data-action="close-modal" class="${BTN_GHOST}">Cancel</button>
        <button type="submit" class="${danger ? `${BTN} bg-rose-600 hover:bg-rose-700 text-white` : BTN_PRIMARY}">${submitLabel}</button>
      </div>` : (footer ? `<div class="px-5 py-4 border-t border-slate-100 safe-bottom">${footer}</div>` : '<div class="h-3 safe-bottom"></div>')}
    </form>
  </div>`;
  document.body.style.overflow = 'hidden';
  refreshIcons();
  if (window.matchMedia('(min-width: 640px)').matches) {
    const first = $('#modal-form input:not([type=hidden]):not([type=checkbox]):not([type=radio]), #modal-form textarea');
    if (first) first.focus();
  }
}
function closeModal() { $('#modal-root').innerHTML = ''; modalHandler = null; document.body.style.overflow = ''; }
function confirmModal(message, onYes, { title = 'Are you sure?', yesLabel = 'Delete', danger = true } = {}) {
  openModal({ title, body: `<p class="text-slate-600">${message}</p>`, submitLabel: yesLabel, danger, onSubmit: () => { onYes(); } });

  if (!p.finalGift) return pill(`${icon('gift', 'w-3 h-3')} No gift yet`, 'bg-rose-50 text-rose-700 ring-rose-200');
  if (p.finalGift.status === 'ready') return pill(`${icon('gift', 'w-3 h-3')} Gift ready`, 'bg-emerald-50 text-emerald-700 ring-emerald-200');
  if (p.finalGift.status === 'ordered') return pill(`${icon('package', 'w-3 h-3')} Gift ordered`, 'bg-sky-50 text-sky-700 ring-sky-200');
  return pill(`${icon('lightbulb', 'w-3 h-3')} Gift: idea only`, 'bg-amber-50 text-amber-700 ring-amber-200');

function cardStatusPill(p) {
  if (!p.cardBought) return pill(`${icon('mail', 'w-3 h-3')} Card needed`, 'bg-rose-50 text-rose-700 ring-rose-200');
  if (!p.cardSent) return pill(`${icon('mail', 'w-3 h-3')} Card to write/send`, 'bg-amber-50 text-amber-700 ring-amber-200');
  return pill(`${icon('mail', 'w-3 h-3')} Card sent`, 'bg-emerald-50 text-emerald-700 ring-emerald-200');
}
function daysPill(d) {
  if (d === 0) return pill('🎉 Today', 'bg-teal-600 text-white ring-teal-600');

  return pill(relDays(d), 'bg-slate-50 text-slate-600 ring-slate-200');
}

  </div>`;
}

/* ---------- 6.2 TASKS & CHECKLISTS ---------- */
function renderTasks() {
  const tabs = `<div class="inline-flex rounded-xl bg-slate-100 p-1 mb-5">
    ${[['tasks', 'Tasks', 'list-todo'], ['checklists', 'Checklists', 'list-checks']].map(([v, l, i]) => `
      <button type="button" data-action="tasks-tab" data-val="${v}" class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium transition ${ui.tasksTab === v ? 'bg-white shadow-sm text-slate-900' : 'text-slate-500 hover:text-slate-700'}">${icon(i)}${l}</button>`).join('')}
  </div>`;
  return tabs + (ui.tasksTab === 'checklists' ? renderChecklists() : renderTaskList());
}

function renderTaskList() {
  const t = todayStr();
  const T = state.tasks;
  const filters = {
    open: x => !x.done,
    today: x => !x.done && x.due === t,
    overdue: x => !x.done && x.due && x.due < t,
    upcoming: x => !x.done && x.due && x.due > t,
    done: x => x.done,
    all: () => true
  };
  const catOk = x => ui.taskCat === 'all' || x.category === ui.taskCat;
  const list = T.filter(filters[ui.taskFilter] || filters.open).filter(catOk).sort(sortTasks);
  const count = k => T.filter(filters[k]).filter(catOk).length;
  const doneCount = T.filter(x => x.done).length;

  return `
  <form data-form="task-quick" class="${CARD} p-3 md:p-4 mb-5">
    <div class="flex gap-2">
      <input name="title" required placeholder="Add a task… e.g. Book dentist" class="${INPUT} flex-1">
      <button type="submit" class="${BTN_PRIMARY} shrink-0">${icon('plus')}<span class="hidden sm:inline">Add</span></button>
    </div>
    <div class="grid grid-cols-3 gap-2 mt-2">
      <input type="date" name="due" class="${INPUT} !py-2" aria-label="Due date">
      ${sel('priority', Object.entries(PRIORITIES).map(([k, v]) => [k, v.label + ' priority']), 'medium').replace(INPUT, INPUT + ' !py-2')}
      ${sel('category', Object.entries(TASK_CATS), 'general').replace(INPUT, INPUT + ' !py-2')}
    </div>
  </form>

  <div class="space-y-2 mb-4">
    ${filterPills([['open', 'Open', count('open')], ['today', 'Today', count('today')], ['overdue', 'Overdue', count('overdue')], ['upcoming', 'Upcoming', count('upcoming')], ['done', 'Completed', count('done')], ['all', 'All', count('all')]], ui.taskFilter, 'task-filter')}
    ${filterPills([['all', 'All categories'], ...Object.entries(TASK_CATS)], ui.taskCat, 'task-cat')}
  </div>

  <section class="${CARD} px-4 md:px-5">
    ${list.length ? `<ul class="divide-y divide-slate-100">${list.map(taskRow).join('')}</ul>` : emptyBox('circle-check', 'No tasks here', ui.taskFilter === 'done' ? 'Completed tasks will appear here.' : 'Use the box above to add one.')}
  </section>
  ${doneCount ? `<div class="mt-3 text-right"><button type="button" data-action="tasks-clear-done" class="text-sm text-slate-500 hover:text-rose-600">Clear ${doneCount} completed</button></div>` : ''}`;
}

function renderChecklists() {
  const C = state.checklists;
  return `
  <div class="flex items-center justify-between mb-4">
    <p class="text-sm text-slate-500">Reusable templates can be reset or copied each time you need them.</p>
    <button type="button" data-action="cl-new" class="${BTN_PRIMARY} shrink-0">${icon('plus')}New</button>
  </div>
  ${C.length ? `<div class="grid md:grid-cols-2 gap-4 items-start">${C.map(checklistCard).join('')}</div>`
    : `<div class="${CARD}">${emptyBox('list-checks', 'No checklists yet', 'Create one for packing, food shops, projects…', `<button type="button" data-action="cl-new" class="${BTN_SOFT}">${icon('plus')}Create checklist</button>`)}</div>`}`;
}

function checklistCard(c) {
  const done = c.items.filter(i => i.done).length, total = c.items.length;
  const pct = total ? done / total * 100 : 0;
  const collapsed = !!ui.clCollapsed[c.id];
  return `<section class="${CARD} overflow-hidden">
    <button type="button" data-action="cl-collapse" data-id="${c.id}" class="w-full text-left p-4 md:p-5">
      <div class="flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap"><h3 class="font-semibold text-slate-900">${esc(c.title)}</h3>
            ${c.reusable ? pill(`${icon('repeat', 'w-3 h-3')} Reusable`, 'bg-sky-50 text-sky-700 ring-sky-200') : ''}
            ${total && done === total ? pill(`${icon('check', 'w-3 h-3')} Complete`, 'bg-emerald-50 text-emerald-700 ring-emerald-200') : ''}</div>
          <p class="text-xs text-slate-500 mt-1">${done} of ${total} done</p>
        </div>
        <span class="text-slate-400 transition ${collapsed ? '' : 'rotate-180'}">${icon('chevron-down', 'w-5 h-5')}</span>
      </div>
      <div class="mt-3">${progress(pct, done === total && total ? 'bg-emerald-500' : 'bg-sky-500')}</div>
    </button>
    ${collapsed ? '' : `
    <div class="px-4 md:px-5 pb-4">
      <ul class="space-y-1">${c.items.map(i => `
        <li class="flex items-center gap-2 group">
          <button type="button" data-action="cl-toggle-item" data-id="${c.id}" data-item="${i.id}" class="flex-1 flex items-center gap-3 rounded-lg px-2 py-2 hover:bg-slate-50 text-left">
            <span class="w-5 h-5 shrink-0 rounded-md border-2 flex items-center justify-center ${i.done ? 'bg-sky-500 border-sky-500 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'w-3 h-3')}</span>
            <span class="text-sm ${i.done ? 'line-through text-slate-400' : 'text-slate-700'} break-words">${esc(i.text)}</span>
          </button>
          <button type="button" data-action="cl-del-item" data-id="${c.id}" data-item="${i.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Remove item">${icon('x', 'w-3.5 h-3.5')}</button>
        </li>`).join('')}</ul>
      <form data-form="cl-add-item" data-id="${c.id}" class="flex gap-2 mt-2">
        <input name="text" required placeholder="Add item…" class="${INPUT} !py-2" data-focus-key="cl-${c.id}">
        <button type="submit" class="${BTN_SOFT} shrink-0" aria-label="Add item">${icon('plus')}</button>
      </form>
      <div class="flex flex-wrap gap-2 mt-4 pt-3 border-t border-slate-100">
        ${c.reusable ? `<button type="button" data-action="cl-reset" data-id="${c.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('rotate-ccw', 'w-3.5 h-3.5')}Reset ticks</button>` : ''}
        <button type="button" data-action="cl-dup" data-id="${c.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('copy-plus', 'w-3.5 h-3.5')}${c.reusable ? 'Use as new list' : 'Duplicate'}</button>
        <button type="button" data-action="cl-edit" data-id="${c.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('pencil', 'w-3.5 h-3.5')}Edit</button>
        <button type="button" data-action="cl-delete" data-id="${c.id}" class="${BTN_DANGER} !py-1.5 !text-xs ml-auto">${icon('trash-2', 'w-3.5 h-3.5')}Delete</button>
      </div>
    </div>`}
  </section>`;
}

/* ---------- 6.3 BIRTHDAYS ---------- */
function renderBirthdays() {
  const list = state.people.map(p => ({ p, nb: nextBirthday(p) })).sort((a, b) => a.nb.days - b.nb.days);
  let lastMonth = '';
  const rows = list.map(({ p, nb }) => {
    const m = nb.date ? parseYMD(nb.date).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) : 'No date';
    const header = m !== lastMonth ? `<h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400 pt-4 pb-1 px-1">${m}</h3>` : '';
    lastMonth = m;
    return header + personCard(p, nb);
  }).join('');

  return `
  <div class="flex items-center justify-between gap-3 mb-2">
    <p class="text-sm text-slate-500">${state.people.length} ${state.people.length === 1 ? 'person' : 'people'} · sorted by next birthday</p>
    <button type="button" data-action="person-new" class="${BTN_PRIMARY}">${icon('user-plus')}Add person</button>
  </div>
  ${list.length ? `<div class="space-y-3">${rows}</div>` : `<div class="${CARD}">${emptyBox('cake', 'No birthdays yet', 'Add family and friends to start tracking.', `<button type="button" data-action="person-new" class="${BTN_SOFT}">${icon('user-plus')}Add person</button>`)}</div>`}`;
}

function personCard(p, nb) {
  const open = !!ui.personOpen[p.id];
  const fg = p.finalGift;
  const givenBefore = title => {
    const tl = String(title || '').toLowerCase().trim();
    if (!tl) return null;
    const h = p.history.find(x => { const g = String(x.gift || '').toLowerCase(); return g && (g.includes(tl) || tl.includes(g)); });
    return h ? h.year : null;
  };

  return `<article class="${CARD} overflow-hidden" id="person-${p.id}">
    <button type="button" data-action="person-toggle" data-id="${p.id}" class="w-full text-left p-4 flex items-start gap-3">
      <div class="w-12 h-12 rounded-full ${avatarCls(p.name)} flex items-center justify-center font-semibold shrink-0">${initials(p.name)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0"><p class="font-semibold text-slate-900 truncate">${esc(p.name)}</p>
          <p class="text-xs text-slate-500">${p.relationship ? esc(p.relationship) + ' · ' : ''}${nb.date ? fmtDate(nb.date, { weekday: 'short', day: 'numeric', month: 'long' }) : 'No date set'}${nb.turning !== null && nb.date ? ` · <span class="font-medium text-slate-700">turning ${nb.turning}</span>` : ''}</p></div>
          ${nb.date ? daysPill(nb.days) : ''}
        </div>
        <div class="flex flex-wrap gap-1.5 mt-2">${giftStatusPill(p)}${cardStatusPill(p)}${p.ideas.length ? pill(`${icon('lightbulb', 'w-3 h-3')} ${p.ideas.length} idea${p.ideas.length > 1 ? 's' : ''}`, 'bg-slate-50 text-slate-600 ring-slate-200') : ''}</div>
      </div>
      <span class="text-slate-400 mt-1 transition ${open ? 'rotate-180' : ''}">${icon('chevron-down', 'w-5 h-5')}</span>
    </button>

    ${!open ? '' : `
    <div class="border-t border-slate-100 bg-slate-50/50 p-4 space-y-5">
      ${p.notes ? `<p class="text-sm text-slate-600 bg-white rounded-xl px-3 py-2 ring-1 ring-slate-200">${icon('info', 'w-4 h-4 inline -mt-0.5 text-slate-400')} ${esc(p.notes)}</p>` : ''}

      <!-- Final gift -->
      <div>
        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Final gift</h4>
        ${fg ? `<div class="bg-white rounded-xl ring-1 ring-slate-200 p-3">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0"><p class="font-medium text-slate-800 break-words">${icon('gift', 'w-4 h-4 inline -mt-0.5 text-teal-600')} ${esc(fg.title)}</p>
              <p class="text-xs text-slate-500">${fg.price ? money(fg.price) : 'No price set'}</p></div>
              <div class="flex shrink-0"><button type="button" data-action="final-custom" data-id="${p.id}" class="${ICON_BTN}" aria-label="Edit final gift">${icon('pencil')}</button>
              <button type="button" data-action="final-clear" data-id="${p.id}" class="${ICON_BTN}" aria-label="Clear final gift">${icon('x')}</button></div>
            </div>
            <div class="grid grid-cols-3 gap-1 mt-3 rounded-xl bg-slate-100 p-1">
              ${GIFT_STATUS.map((s, i) => { const cur = GIFT_STATUS.findIndex(x => x.id === fg.status); const on = s.id === fg.status; return `
                <button type="button" data-action="final-status" data-id="${p.id}" data-val="${s.id}" class="flex flex-col sm:flex-row items-center justify-center gap-1 rounded-lg px-2 py-2 text-xs font-medium transition ${on ? 'bg-white shadow-sm text-teal-700' : i < cur ? 'text-teal-600' : 'text-slate-500 hover:text-slate-700'}">${icon(i < cur ? 'circle-check' : s.icon, 'w-4 h-4')}<span>${s.label}</span></button>`; }).join('')}
            </div>
          </div>`
        : `<div class="bg-white rounded-xl ring-1 ring-dashed ring-slate-300 p-3 text-sm text-slate-500 flex flex-wrap items-center justify-between gap-2">
            <span>No final gift chosen – select one of the ideas below, or</span>
            <button type="button" data-action="final-custom" data-id="${p.id}" class="${BTN_SOFT} !py-1.5">${icon('plus', 'w-3.5 h-3.5')}Enter custom gift</button></div>`}
      </div>

      <!-- Card tracker -->
      <div>
        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Card tracker</h4>
        <div class="grid grid-cols-2 gap-2">
          ${[['card-bought', p.cardBought, 'Card bought', 'shopping-bag'], ['card-sent', p.cardSent, 'Card written / sent', 'send']].map(([a, on, l, i]) => `
            <button type="button" data-action="${a}" data-id="${p.id}" aria-pressed="${on}" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-left ring-1 transition ${on ? 'bg-emerald-50 ring-emerald-200 text-emerald-800' : 'bg-white ring-slate-200 text-slate-600 hover:ring-teal-300'}">
              <span class="w-6 h-6 shrink-0 rounded-md border-2 flex items-center justify-center ${on ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 text-transparent'}">${icon('check', 'w-3.5 h-3.5')}</span>${l}</button>`).join('')}
        </div>
      </div>

      <!-- Gift ideas -->
      <div>
        <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Gift ideas</h4>
        ${p.ideas.length ? `<ul class="space-y-2 mb-2">${p.ideas.map(idea => { const isSel = fg && fg.ideaId === idea.id; const yr = givenBefore(idea.title); const url = safeUrl(idea.link); return `
          <li class="bg-white rounded-xl ring-1 ${isSel ? 'ring-teal-300' : 'ring-slate-200'} p-3 flex flex-wrap items-center gap-2">
            <div class="flex-1 min-w-[10rem]"><p class="text-sm font-medium text-slate-800 break-words">${esc(idea.title)}</p>
              <p class="text-xs text-slate-500 flex flex-wrap gap-x-3">${idea.price ? `<span>${money(idea.price)}</span>` : ''}${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="text-teal-700 hover:underline inline-flex items-center gap-1">${icon('external-link', 'w-3 h-3')}Link</a>` : ''}
              ${yr ? `<span class="text-amber-700 font-medium">${icon('triangle-alert', 'w-3 h-3 inline -mt-0.5')} Similar gift given in ${yr}</span>` : ''}</p></div>
            ${isSel ? pill(`${icon('star', 'w-3 h-3')} Selected`, 'bg-teal-50 text-teal-700 ring-teal-200')
              : `<button type="button" data-action="idea-select" data-id="${p.id}" data-item="${idea.id}" class="${BTN_SOFT} !py-1.5 !text-xs">${icon('star', 'w-3.5 h-3.5')}Select as final gift</button>`}
            <button type="button" data-action="idea-delete" data-id="${p.id}" data-item="${idea.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Delete idea">${icon('trash-2', 'w-3.5 h-3.5')}</button>
          </li>`; }).join('')}</ul>` : ''}
        <form data-form="idea-add" data-id="${p.id}" class="grid grid-cols-[1fr_6rem] sm:grid-cols-[1fr_6rem_1fr_auto] gap-2">
          <input name="title" required placeholder="Gift idea" class="${INPUT} !py-2" data-focus-key="idea-${p.id}">
          <input name="price" inputmode="decimal" placeholder="£ est." class="${INPUT} !py-2">
          <input name="link" placeholder="Link (optional)" class="${INPUT} !py-2 col-span-2 sm:col-span-1">
          <button type="submit" class="${BTN_SOFT} col-span-2 sm:col-span-1">${icon('plus')}Add idea</button>
        </form>
      </div>

      <!-- History -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <h4 class="text-xs font-semibold uppercase tracking-wider text-slate-500">Gift history</h4>
          <button type="button" data-action="history-add" data-id="${p.id}" class="text-xs font-medium text-teal-700 hover:underline">+ Add past gift</button>
        </div>
        ${p.history.length ? `<ul class="bg-white rounded-xl ring-1 ring-slate-200 divide-y divide-slate-100">${[...p.history].sort((a, b) => b.year - a.year).map(h => `
          <li class="flex items-center gap-3 px-3 py-2">
            <span class="text-xs font-semibold text-slate-500 w-10 shrink-0">${esc(h.year)}</span>
            <div class="flex-1 min-w-0"><p class="text-sm text-slate-800 break-words">${esc(h.gift)}</p>
              <p class="text-xs text-slate-500">${esc(h.occasion || 'Birthday')}${h.price ? ' · ' + money(h.price) : ''}${h.notes ? ' · ' + esc(h.notes) : ''}</p></div>
            <button type="button" data-action="history-delete" data-id="${p.id}" data-item="${h.id}" class="${ICON_BTN} !w-8 !h-8" aria-label="Delete history entry">${icon('x', 'w-3.5 h-3.5')}</button>
          </li>`).join('')}</ul>` : '<p class="text-sm text-slate-500">No past gifts logged. Final gifts are archived here automatically after each birthday.</p>'}
      </div>

      <div class="flex flex-wrap gap-2 pt-3 border-t border-slate-200">
        <button type="button" data-action="person-edit" data-id="${p.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('pencil', 'w-3.5 h-3.5')}Edit details</button>
        ${fg ? `<button type="button" data-action="person-archive" data-id="${p.id}" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('archive', 'w-3.5 h-3.5')}Archive gift to history now</button>` : ''}
        <button type="button" data-action="person-delete" data-id="${p.id}" class="${BTN_DANGER} !py-1.5 !text-xs ml-auto">${icon('trash-2', 'w-3.5 h-3.5')}Delete</button>
      </div>
    </div>`}
  </article>`;
}

/* ---------- 6.4 CHRISTMAS ---------- */
function renderChristmas() {
  const c = state.christmas, xs = xmasStats();
  const R = c.recipients;
  const filtered = R.filter(r => ui.xmasFilter === 'all' ? true : ui.xmasFilter === 'done' ? recipientDone(r) : !recipientDone(r))
    .sort((a, b) => (recipientDone(a) - recipientDone(b)) || a.name.localeCompare(b.name));
  const over = xs.budget && xs.spent > xs.budget;

  const tile = (label, val, sub = '', cls = 'text-slate-900') => `<div class="${CARD} p-4"><p class="text-xs text-slate-500">${label}</p><p class="text-xl md:text-2xl font-bold ${cls} mt-1">${val}</p>${sub ? `<p class="text-xs text-slate-500 mt-0.5">${sub}</p>` : ''}</div>`;

  return `
  <div class="rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-5 md:p-6 mb-4 shadow-sm relative overflow-hidden">
    <div class="absolute right-4 top-4 opacity-20">${icon('snowflake', 'w-20 h-20')}</div>
    <div class="relative flex flex-wrap items-end justify-between gap-4">
      <div>
        <p class="text-emerald-100 text-sm">Christmas ${c.year}</p>
        <p class="text-3xl font-bold mt-1">${xs.days > 0 ? `${xs.days} days to go` : xs.days === 0 ? 'Merry Christmas! 🎄' : 'All done for this year'}</p>
        <p class="text-emerald-100 text-sm mt-1">${xs.done} of ${xs.total} people sorted · ${xs.giftsBought} of ${xs.giftsTotal} gifts bought</p>
      </div>
      <button type="button" data-action="xmas-budget" class="${BTN} bg-white/15 hover:bg-white/25 text-white ring-1 ring-white/30">${icon('wallet')}Overall budget: ${money(xs.budget)}</button>
    </div>
    <div class="relative mt-4 space-y-2">
      <div class="flex justify-between text-xs text-emerald-50"><span>Spent ${money(xs.spent)}</span><span>${over ? 'Over budget!' : money(xs.remaining) + ' left'}</span></div>
      <div class="h-2.5 rounded-full bg-white/20 overflow-hidden"><div class="h-full rounded-full ${over ? 'bg-rose-300' : 'bg-white'}" style="width:${Math.min(100, xs.budget ? xs.spent / xs.budget * 100 : 0)}%"></div></div>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
    ${tile('Overall budget', money(xs.budget))}
    ${tile('Total budgeted (per person)', money(xs.budgeted), xs.budget && xs.budgeted > xs.budget ? '<span class="text-rose-600">Exceeds overall budget</span>' : `${money(xs.budget - xs.budgeted)} unallocated`)}
    ${tile('Total spent', money(xs.spent), `${money(xs.planned)} incl. ideas`)}
    ${tile('Remaining budget', money(xs.remaining), '', xs.remaining < 0 ? 'text-rose-600' : 'text-emerald-700')}
  </div>

  <div class="flex flex-wrap items-center gap-2 mb-4">
    <button type="button" data-action="xmas-recipient-new" class="${BTN_PRIMARY}">${icon('user-plus')}Add recipient</button>
    <button type="button" data-action="xmas-import" class="${BTN_GHOST}">${icon('users')}Import from birthdays</button>
    <button type="button" data-action="xmas-new-year" class="${BTN_GHOST} sm:ml-auto">${icon('archive')}Start ${c.year + 1}</button>
  </div>
  <div class="mb-4">${filterPills([['all', 'Everyone', R.length], ['todo', 'Still need to buy', R.filter(r => !recipientDone(r)).length], ['done', 'Completed', xs.done]], ui.xmasFilter, 'xmas-filter')}</div>

  ${filtered.length ? `<div class="grid md:grid-cols-2 gap-4 items-start">${filtered.map(recipientCard).join('')}</div>`
    : `<div class="${CARD}">${emptyBox('gift', R.length ? 'Nobody in this view' : 'No recipients yet', R.length ? '' : 'Import people from your birthday list or add Christmas-only recipients.')}</div>`}`;
}

function recipientCard(r) {
  const spent = recipientSpent(r), budget = num(r.budget), planned = sum(r.gifts, g => num(g.price));
  const done = recipientDone(r);
  const person = r.personId ? byId(state.people, r.personId) : null;
  const past = person ? [...person.history].sort((a, b) => b.year - a.year).slice(0, 3) : [];
  return `<article class="${CARD} p-4 md:p-5">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-full ${avatarCls(r.name)} flex items-center justify-center text-sm font-semibold shrink-0">${initials(r.name)}</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 flex-wrap"><h3 class="font-semibold text-slate-900 break-words">${esc(r.name)}</h3>

/* ---------- 6.5 HOUSEHOLD VAULT ---------- */
function vaultMatches(v) {
  const q = ui.vaultSearch.trim().toLowerCase();
  if (ui.vaultCat !== 'all' && v.category !== ui.vaultCat) return false;
  if (!q) return true;
  return [v.provider, v.name, v.accountNo, v.location, v.notes, (VAULT_CAT[v.category] || {}).label].some(x => String(x || '').toLowerCase().includes(q));
}
function vaultListHTML() {
  const items = state.vault.filter(vaultMatches).sort((a, b) => (a.renewalDate || '9999') < (b.renewalDate || '9999') ? -1 : 1);
  if (!items.length) return `<div class="${CARD}">${emptyBox('search', state.vault.length ? 'No matches' : 'Your vault is empty', state.vault.length ? 'Try a different search or category.' : 'Add mortgages, insurance, utilities and savings so you both know where everything lives.', state.vault.length ? '' : `<button type="button" data-action="vault-new" class="${BTN_SOFT}">${icon('plus')}Add first entry</button>`)}</div>`;
  const cats = ui.vaultCat === 'all' ? VAULT_CATS : [VAULT_CAT[ui.vaultCat]];
  return cats.map(c => {
    const group = items.filter(v => (VAULT_CAT[v.category] ? v.category : 'other') === c.id);
    if (!group.length) return '';
    return `<section class="mb-6">
      <h3 class="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-3"><span class="w-7 h-7 rounded-lg ${c.bg} ${c.fg} flex items-center justify-center">${icon(c.icon, 'w-4 h-4')}</span>${c.label}<span class="text-slate-400 font-normal">${group.length}</span></h3>
      <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 items-start">${group.map(vaultCard).join('')}</div>
    </section>`;
  }).join('');
}
function vaultCard(v) {
  const c = VAULT_CAT[v.category] || VAULT_CAT.other;
  const cost = num(v.cost), monthly = v.costPeriod === 'monthly';
  const url = safeUrl(v.url);
  return `<article class="${CARD} p-4 flex flex-col gap-3">
    <div class="flex items-start gap-3">
      <div class="w-10 h-10 rounded-xl ${c.bg} ${c.fg} flex items-center justify-center shrink-0">${icon(c.icon, 'w-5 h-5')}</div>
      <div class="flex-1 min-w-0"><h4 class="font-semibold text-slate-900 break-words">${esc(v.provider)}</h4><p class="text-xs text-slate-500 break-words">${esc(v.name || c.label)}</p></div>
      ${renewalBadge(v.renewalDate)}
    </div>
    <dl class="grid grid-cols-2 gap-x-4 gap-y-3 text-sm">
      <div class="col-span-2"><dt class="text-xs text-slate-500">Policy / account number</dt>
        <dd class="flex items-center gap-1 font-mono text-[13px] text-slate-800 break-all">${v.accountNo ? `${esc(v.accountNo)}<button type="button" data-action="copy" data-val="${esc(v.accountNo)}" class="${ICON_BTN} !w-7 !h-7" aria-label="Copy number">${icon('copy', 'w-3.5 h-3.5')}</button>` : '—'}</dd></div>
      <div><dt class="text-xs text-slate-500">Renewal / end date</dt><dd class="text-slate-800">${fmtDate(v.renewalDate)}</dd></div>
      <div><dt class="text-xs text-slate-500">Auto-renew</dt><dd>${v.autoRenew ? pill('Yes', 'bg-emerald-50 text-emerald-700 ring-emerald-200') : pill('No', 'bg-rose-50 text-rose-700 ring-rose-200')}</dd></div>
      <div class="col-span-2"><dt class="text-xs text-slate-500">Cost</dt><dd class="text-slate-800">${cost ? `<span class="font-semibold">${money(cost)}</span> / ${monthly ? 'month' : 'year'} <span class="text-xs text-slate-400">(≈ ${monthly ? money(cost * 12) + ' a year' : money(cost / 12) + ' a month'})</span>` : '—'}</dd></div>
    </dl>
    ${v.location ? `<div class="rounded-xl bg-teal-50 ring-1 ring-teal-100 p-3 flex gap-2.5">
        <span class="text-teal-600 mt-0.5">${icon('map-pin', 'w-4 h-4')}</span>
        <div><p class="text-[11px] font-semibold text-teal-800 uppercase tracking-wider">Where to find it</p><p class="text-sm text-teal-900 break-words">${esc(v.location)}</p></div></div>`
      : `<button type="button" data-action="vault-edit" data-id="${v.id}" class="rounded-xl bg-amber-50 ring-1 ring-amber-100 p-3 text-left text-sm text-amber-800 flex gap-2">${icon('map-pin', 'w-4 h-4 mt-0.5')}Add where the documents are kept</button>`}
    ${v.notes ? `<p class="text-sm text-slate-600 whitespace-pre-line bg-slate-50 rounded-xl p-3 break-words">${esc(v.notes)}</p>` : ''}
    <div class="flex items-center gap-2 pt-1 mt-auto">
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" class="${BTN_SOFT} !py-1.5 !text-xs">${icon('external-link', 'w-3.5 h-3.5')}Login / portal</a>` : ''}
      <button type="button" data-action="vault-edit" data-id="${v.id}" class="${ICON_BTN} ml-auto" aria-label="Edit">${icon('pencil')}</button>

    </div>
  </article>`;
}
function renderVault() {
  const V = state.vault;
  const monthlyTotal = sum(V, v => v.costPeriod === 'monthly' ? num(v.cost) : num(v.cost) / 12);
  const soon = V.filter(v => { const d = daysUntil(v.renewalDate); return d !== null && d < 60; }).length;

  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">

    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Renewing within 60 days</p><p class="text-2xl font-bold ${soon ? 'text-amber-600' : 'text-slate-900'} mt-1">${soon}</p></div>

  <div id="vault-list">${vaultListHTML()}</div>`;
}

/* ============================== 7. FORMS ============================== */
function taskForm(id) {
  const t = id ? byId(state.tasks, id) : null;
  openModal({
    title: t ? 'Edit task' : 'New task', submitLabel: t ? 'Save' : 'Add task',
    body: `${field('Task', inp('title', t?.title, 'required placeholder="What needs doing?"'))}
      <div class="grid grid-cols-2 gap-3">${field('Due date', inp('due', t?.due, 'type="date"'))}
      ${field('Priority', sel('priority', Object.entries(PRIORITIES).map(([k, v]) => [k, v.label]), t?.priority || 'medium'))}</div>
      ${field('Category', sel('category', Object.entries(TASK_CATS), t?.category || 'general'))}
      ${field('Notes', ta('notes', t?.notes, 'placeholder="Optional"'))}`,
    onSubmit: fd => {
      const data = { title: fd.get('title').trim(), due: fd.get('due') || '', priority: fd.get('priority'), category: fd.get('category'), notes: fd.get('notes').trim() };
      const cur = id ? byId(state.tasks, id) : null;
      if (cur) Object.assign(cur, data, { updatedAt: Date.now() });
      else state.tasks.push(touch({ id: uid(), done: false, ...data }));
      commit(); toast(cur ? 'Task updated' : 'Task added');
    }
  });
}

function checklistForm(id) {
  const c = id ? byId(state.checklists, id) : null;
  openModal({
    title: c ? 'Edit checklist' : 'New checklist', submitLabel: c ? 'Save' : 'Create',
    body: `${field('Title', inp('title', c?.title, 'required placeholder="e.g. Holiday Packing"'))}
      ${chk('reusable', 'Reusable template', c ? c.reusable : true, 'Keep it and reset the ticks each time (e.g. Food Shop).')}
      ${c ? '' : field('Items', ta('items', '', 'rows="6" placeholder="One item per line"'), 'You can add more items later.')}`,
    onSubmit: fd => {
      const cur = id ? byId(state.checklists, id) : null;
      if (cur) { cur.title = fd.get('title').trim(); cur.reusable = fd.get('reusable') === 'on'; touch(cur); }
      else {
        const items = String(fd.get('items') || '').split('\n').map(s => s.trim()).filter(Boolean).map(text => ({ id: uid(), text, done: false }));
        state.checklists.unshift(touch({ id: uid(), title: fd.get('title').trim(), reusable: fd.get('reusable') === 'on', items }));
        ui.tasksTab = 'checklists';
        if (route() !== 'tasks') location.hash = '#/tasks';
      }
      commit();
    }
  });
}

function personForm(id) {
  const p = id ? byId(state.people, id) : null;
  openModal({
    title: p ? 'Edit person' : 'Add birthday', submitLabel: p ? 'Save' : 'Add',
    body: `${field('Name', inp('name', p?.name, 'required placeholder="e.g. Auntie Sue"'))}
      ${field('Relationship', inp('relationship', p?.relationship, 'placeholder="e.g. Aunt, Friend, Colleague" list="rel-list"') + `<datalist id="rel-list">${['Mother', 'Father', 'Sister', 'Brother', 'Son', 'Daughter', 'Grandparent', 'Aunt', 'Uncle', 'Cousin', 'Niece', 'Nephew', 'Friend', 'Godchild', 'Colleague'].map(x => `<option value="${x}">`).join('')}</datalist>`)}
      ${field('Date of birth', inp('dob', p?.dob, 'type="date" required'), 'If you don\'t know the year, pick any year and tick the box below.')}
      ${chk('yearUnknown', 'Birth year unknown (don\'t show age)', p ? p.yearKnown === false : false)}
      ${field('Notes', ta('notes', p?.notes, 'placeholder="Likes, sizes, allergies…"'))}`,
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), relationship: fd.get('relationship').trim(), dob: fd.get('dob'), yearKnown: fd.get('yearUnknown') !== 'on', notes: fd.get('notes').trim() };
      const cur = id ? byId(state.people, id) : null;
      if (cur) { const dobChanged = cur.dob !== data.dob; Object.assign(cur, data); if (dobChanged) cur.cycleFor = nextBirthday(cur).date; touch(cur); }
      else { const np = { id: uid(), ideas: [], history: [], finalGift: null, cardBought: false, cardSent: false, ...data }; np.cycleFor = nextBirthday(np).date; state.people.push(touch(np)); ui.personOpen[np.id] = true; }
      commit(); toast(cur ? 'Saved' : 'Birthday added');
    }
  });
}

function finalGiftForm(pid) {
  const p = byId(state.people, pid); if (!p) return;

function backupFile() {
  const payload = { app: 'home-hub', format: 1, exportedAt: new Date().toISOString(), data: exportable() };

  return { name, blob: new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }) };
}
function exportJSON() {
  const { name, blob } = backupFile();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}
async function shareJSON() {
  const { name, blob } = backupFile();
  const file = new File([blob], name, { type: 'application/json' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Home Hub backup' }); }

  } catch (e) { if (e.name !== 'AbortError') exportJSON(); }
}

/** Parse an imported file and ask whether to replace or merge. */
function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('That file is not valid JSON', 'error'); return; }
    const data = obj && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.people) || !Array.isArray(data.vault)) { toast('This does not look like a Home Hub backup', 'error'); return; }
    const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('en-GB') : 'unknown date';
    openModal({
      title: 'Import backup',
      body: `<p class="text-sm text-slate-600">Backup from <b>${esc(when)}</b> containing ${data.tasks.length} tasks, ${data.people.length} people, ${(data.christmas?.recipients || []).length} Christmas recipients and ${data.vault.length} vault entries.</p>
        <div class="grid gap-3">
          <button type="button" data-action="import-replace" class="rounded-2xl ring-1 ring-slate-200 hover:ring-teal-300 p-4 text-left">
            <span class="font-semibold text-slate-800 flex items-center gap-2">${icon('refresh-cw', 'w-4 h-4 text-teal-600')}Replace my data</span>
            <span class="block text-xs text-slate-500 mt-1">Best when your partner has the latest version. Your current data is overwritten.</span></button>
          <button type="button" data-action="import-merge" class="rounded-2xl ring-1 ring-slate-200 hover:ring-teal-300 p-4 text-left">
            <span class="font-semibold text-slate-800 flex items-center gap-2">${icon('git-merge', 'w-4 h-4 text-sky-600')}Merge with my data</span>
            <span class="block text-xs text-slate-500 mt-1">Adds anything new and keeps the most recently edited version of each item. Deletions are not carried across.</span></button>
        </div>`
    });
    pendingImport = data;
  };
  reader.readAsText(file);
}
let pendingImport = null;
function mergeArrays(local, incoming) {
  const map = new Map(local.map(x => [x.id, x]));
  (incoming || []).forEach(x => {
    if (!x || !x.id) return;
    const cur = map.get(x.id);
    if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) map.set(x.id, x);
  });
  return Array.from(map.values());
}
function applyImport(mode) {
  const data = pendingImport; pendingImport = null;
  if (!data) return;
  if (mode === 'replace') {
    const keep = state.settings;
    state = normalise({ ...clone(data), settings: keep });
  } else {
    const inc = normalise(clone(data));
    state.tasks = mergeArrays(state.tasks, inc.tasks);
    state.checklists = mergeArrays(state.checklists, inc.checklists);
    state.people = mergeArrays(state.people, inc.people);
    state.vault = mergeArrays(state.vault, inc.vault);
    if (inc.christmas.year === state.christmas.year) {
      state.christmas.recipients = mergeArrays(state.christmas.recipients, inc.christmas.recipients);
      if (!state.christmas.budget) state.christmas.budget = inc.christmas.budget;
    }
  }
  ensureCycles();
  closeModal(); commit();
  toast(mode === 'replace' ? 'Data replaced from backup' : 'Backup merged');
}

/* =========================== 9. CLOUD SYNC =========================== */
/* Whole-document, last-write-wins sync. Data is stored as a JSON string so
   Firebase never mangles arrays/empty values. Device-specific sync settings
   (URL, key) are never uploaded. */
const Sync = {
  status: 'off', message: '', es: null, pushTimer: null, pollTimer: null,
  cfg() { return state.settings.sync; },
  enabled() { const c = this.cfg(); return !!(c.enabled && c.url && c.householdId); },
  base() { return String(this.cfg().url).trim().replace(/\/+$/, ''); },
  fbUrl() {
    const c = this.cfg();
    return `${this.base()}/households/${encodeURIComponent(c.householdId.trim())}.json${c.key ? '?auth=' + encodeURIComponent(c.key.trim()) : ''}`;
  },
  sbHeaders() { const k = this.cfg().key.trim(); return { apikey: k, Authorization: 'Bearer ' + k }; },
  setStatus(s, msg = '') { this.status = s; this.message = msg; updateSyncIndicators(); },

  start() {
    this.stop();
    if (!this.enabled()) { this.setStatus('off'); return; }
    this.setStatus('connecting');
    if (this.cfg().provider === 'firebase') {
      // Firebase REST streaming (Server-Sent Events) gives instant updates without the SDK
      try {
        this.es = new EventSource(this.fbUrl());
        this.es.addEventListener('put', ev => { try { const m = JSON.parse(ev.data); if (m.path === '/') this.handleRemote(m.data); else this.pull(); } catch (e) { this.pull(); } });
        this.es.addEventListener('patch', () => this.pull());
        this.es.addEventListener('cancel', () => this.setStatus('error', 'Permission denied – check your database rules.'));
        this.es.addEventListener('auth_revoked', () => this.setStatus('error', 'Auth token revoked.'));
        this.es.onerror = () => { if (this.status !== 'error') this.setStatus('error', 'Cannot reach the database – check the URL and rules. Retrying…'); };
        this.es.onopen = () => { if (this.status === 'error' || this.status === 'connecting') this.setStatus('live'); };
      } catch (e) { this.setStatus('error', e.message); }
    } else {
      this.pull();
      this.pollTimer = setInterval(() => this.pull(), 10000);
    }
  },
  stop() {
    if (this.es) { this.es.close(); this.es = null; }
    clearInterval(this.pollTimer); this.pollTimer = null;
    clearTimeout(this.pushTimer);
  },

  async pull() {
    if (!this.enabled()) return;
    try {
      let rec = null;
      if (this.cfg().provider === 'firebase') {
        const r = await fetch(this.fbUrl(), { cache: 'no-store' });
        if (!r.ok) throw new Error(`Firebase responded ${r.status}`);
        rec = await r.json();
      } else {
        const id = encodeURIComponent(this.cfg().householdId.trim());
        const r = await fetch(`${this.base()}/rest/v1/household_sync?id=eq.${id}&select=payload,updated_at,updated_by`, { headers: this.sbHeaders(), cache: 'no-store' });
        if (!r.ok) throw new Error(`Supabase responded ${r.status}`);
        const rows = await r.json();
        rec = rows[0] ? { payload: rows[0].payload, updatedAt: Number(rows[0].updated_at), updatedBy: rows[0].updated_by } : null;
      }
      this.handleRemote(rec);
    } catch (e) { this.setStatus('error', e.message); }
  },

  handleRemote(rec) {
    if (!rec || !rec.payload) { this.push(); return; }               // empty cloud → upload ours
    const remoteAt = Number(rec.updatedAt) || 0, localAt = state.meta.updatedAt || 0;
    if (remoteAt > localAt) {
      try {
        const data = JSON.parse(rec.payload);
        const keep = state.settings;
        state = normalise({ ...data, settings: keep });
        state.meta.updatedAt = remoteAt; state.meta.updatedBy = rec.updatedBy;
        state.settings.sync.lastSync = Date.now();
        persist();
        this.setStatus('live');
        scheduleRender();
      } catch (e) { this.setStatus('error', 'Cloud data could not be read'); }
    } else if (remoteAt < localAt) {
      this.push();                                                     // ours is newer
    } else {
      this.setStatus('live');
    }
  },

  schedulePush() {
    if (!this.enabled()) return;
    this.setStatus('pending');
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.push(), 700);
  },

  async push() {
    if (!this.enabled()) return;
    const payload = JSON.stringify(exportable());
    const updatedAt = state.meta.updatedAt, updatedBy = state.meta.updatedBy || CLIENT_ID;
    try {
      let r;
      if (this.cfg().provider === 'firebase') {
        r = await fetch(this.fbUrl(), { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ payload, updatedAt, updatedBy }) });
      } else {
        r = await fetch(`${this.base()}/rest/v1/household_sync`, {
          method: 'POST',
          headers: { ...this.sbHeaders(), 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify({ id: this.cfg().householdId.trim(), payload, updated_at: updatedAt, updated_by: updatedBy })
        });
      }
      if (!r.ok) throw new Error(`Upload failed (${r.status}) – check URL, key and rules`);
      state.settings.sync.lastSync = Date.now(); persist();
      this.setStatus('live');
    } catch (e) { this.setStatus('error', e.message); }
  }
};

/** Encode sync settings in a link so the second phone can connect in one tap. */
function syncSetupLink() {
  const c = state.settings.sync;
  const json = JSON.stringify({ p: c.provider, u: c.url, k: c.key, h: c.householdId });
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return location.href.split('#')[0] + '#sync=' + encodeURIComponent(b64);
}
function checkSyncLink() {
  if (!location.hash.startsWith('#sync=')) return false;
  let cfg;
  try { cfg = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(location.hash.slice(6)))))); } catch (e) { cfg = null; }
  history.replaceState(null, '', location.pathname + location.search + '#/settings');
  if (!cfg || !cfg.u || !cfg.h) { toast('Invalid setup link', 'error'); return false; }
  setTimeout(() => openModal({
    title: 'Connect to household sync?',
    body: `<p class="text-sm text-slate-600">This device will connect to <b>${esc(cfg.p === 'supabase' ? 'Supabase' : 'Firebase')}</b> household <code class="bg-slate-100 px-1 rounded">${esc(cfg.h)}</code>.</p>
      <p class="text-sm text-slate-600">If the cloud already has data, it will replace the sample data on this device.</p>`,
    submitLabel: 'Connect',
    onSubmit: () => {
      Object.assign(state.settings.sync, { provider: cfg.p || 'firebase', url: cfg.u, key: cfg.k || '', householdId: cfg.h, enabled: true });
      state.meta.updatedAt = 0; // let the cloud copy win on first connect
      persist(); Sync.start(); render(); toast('Connecting to household…');
    }
  }), 50);
  return true;
}

/* ===================== 10. ACTIONS & EVENT DELEGATION ===================== */
const findPerson = el => byId(state.people, el.dataset.id);
const findRecipient = el => byId(state.christmas.recipients, el.dataset.id);
const findList = el => byId(state.checklists, el.dataset.id);

const ACTIONS = {
  'close-modal': () => closeModal(),
  'open-backup': () => openBackupModal(),
  'open-quickadd': () => openQuickAdd(),
  'select-all': () => $$('#modal-form input[name=pid]').forEach(c => { c.checked = true; }),

  /* Tasks */
  'quick-task': () => taskForm(),
  'task-toggle': el => { const t = byId(state.tasks, el.dataset.id); if (!t) return; t.done = !t.done; touch(t); commit(); if (t.done) toast('Nice – task completed ✓'); },
  'task-edit': el => taskForm(el.dataset.id),
  'task-delete': el => confirmModal('Delete this task?', () => { state.tasks = state.tasks.filter(x => x.id !== el.dataset.id); commit(); }),
  'task-filter': el => { ui.taskFilter = el.dataset.val; render(); },
  'task-cat': el => { ui.taskCat = el.dataset.val; render(); },
  'tasks-tab': el => { ui.tasksTab = el.dataset.val; if (route() === 'tasks') render(); else location.hash = '#/tasks'; },
  'tasks-clear-done': () => confirmModal('Remove all completed tasks?', () => { state.tasks = state.tasks.filter(x => !x.done); commit(); }, { yesLabel: 'Clear' }),

  /* Checklists */
  'cl-new': () => checklistForm(),
  'cl-edit': el => checklistForm(el.dataset.id),
  'cl-collapse': el => { ui.clCollapsed[el.dataset.id] = !ui.clCollapsed[el.dataset.id]; render(); },
  'cl-toggle-item': el => { const c = findList(el); const i = c && byId(c.items, el.dataset.item); if (!i) return; i.done = !i.done; touch(c); commit(); },
  'cl-del-item': el => { const c = findList(el); if (!c) return; c.items = c.items.filter(i => i.id !== el.dataset.item); touch(c); commit(); },
  'cl-reset': el => { const c = findList(el); if (!c) return; c.items.forEach(i => { i.done = false; }); touch(c); commit(); toast('Checklist reset'); },
  'cl-dup': el => { const c = findList(el); if (!c) return; const copy = touch({ id: uid(), title: `${c.title} – ${fmtDate(todayStr(), { day: 'numeric', month: 'short' })}`, reusable: false, items: c.items.map(i => ({ id: uid(), text: i.text, done: false })) }); state.checklists.unshift(copy); commit(); toast('New checklist created from template'); },
  'cl-delete': el => confirmModal('Delete this checklist and all its items?', () => { state.checklists = state.checklists.filter(x => x.id !== el.dataset.id); commit(); }),

  /* Birthdays */
  'person-new': () => personForm(),
  'person-edit': el => personForm(el.dataset.id),
  'person-toggle': el => { ui.personOpen[el.dataset.id] = !ui.personOpen[el.dataset.id]; render(); },
  'person-open': (el, e) => { e.preventDefault(); ui.personOpen[el.dataset.id] = true; location.hash = '#/birthdays'; setTimeout(() => { const n = document.getElementById('person-' + el.dataset.id); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); },
  'person-delete': el => { const p = findPerson(el); if (p) confirmModal(`Delete ${esc(p.name)} and all their gift ideas and history?`, () => { state.people = state.people.filter(x => x.id !== p.id); state.christmas.recipients.forEach(r => { if (r.personId === p.id) r.personId = null; }); commit(); }); },
  'person-archive': el => { const p = findPerson(el); if (!p || !p.finalGift) return; p.history.push({ id: uid(), year: Number((p.cycleFor || todayStr()).slice(0, 4)), occasion: 'Birthday', gift: p.finalGift.title, price: num(p.finalGift.price), notes: '' }); p.finalGift = null; p.cardBought = false; p.cardSent = false; touch(p); commit(); toast('Archived to gift history'); },
  'idea-select': el => { const p = findPerson(el); const i = p && byId(p.ideas, el.dataset.item); if (!i) return; p.finalGift = { title: i.title, price: num(i.price), status: p.finalGift?.status || 'idea', ideaId: i.id }; touch(p); commit(); toast('Final gift selected'); },
  'idea-delete': el => { const p = findPerson(el); if (!p) return; p.ideas = p.ideas.filter(i => i.id !== el.dataset.item); if (p.finalGift && p.finalGift.ideaId === el.dataset.item) p.finalGift.ideaId = null; touch(p); commit(); },
  'final-custom': el => finalGiftForm(el.dataset.id),
  'final-clear': el => { const p = findPerson(el); if (!p) return; p.finalGift = null; touch(p); commit(); },
  'final-status': el => { const p = findPerson(el); if (!p || !p.finalGift) return; p.finalGift.status = el.dataset.val; touch(p); commit(); },
  'card-bought': el => { const p = findPerson(el); if (!p) return; p.cardBought = !p.cardBought; if (!p.cardBought) p.cardSent = false; touch(p); commit(); },
  'card-sent': el => { const p = findPerson(el); if (!p) return; p.cardSent = !p.cardSent; if (p.cardSent) p.cardBought = true; touch(p); commit(); },
  'history-add': el => historyForm(el.dataset.id),
  'history-delete': el => { const p = findPerson(el); if (!p) return; p.history = p.history.filter(h => h.id !== el.dataset.item); touch(p); commit(); },

  /* Christmas */
  'xmas-budget': () => budgetForm(),
  'xmas-import': () => importRecipientsForm(),
  'xmas-recipient-new': () => recipientForm(),
  'xmas-recipient-edit': el => recipientForm(el.dataset.id),
  'xmas-recipient-delete': el => { const r = findRecipient(el); if (r) confirmModal(`Remove ${esc(r.name)} and their ${r.gifts.length} gift(s) from Christmas ${state.christmas.year}?`, () => { state.christmas.recipients = state.christmas.recipients.filter(x => x.id !== r.id); commit(); }, { yesLabel: 'Remove' }); },
  'xmas-gift-new': el => xmasGiftForm(el.dataset.id || null),
  'xmas-gift-edit': el => xmasGiftForm(el.dataset.id, el.dataset.item),
  'xmas-gift-delete': el => { const r = findRecipient(el); if (!r) return; r.gifts = r.gifts.filter(g => g.id !== el.dataset.item); touch(r); commit(); },
  'xmas-filter': el => { ui.xmasFilter = el.dataset.val; render(); },
  'xmas-new-year': () => {
    const c = state.christmas;
    confirmModal(`This archives Christmas ${c.year}: purchased gifts are copied into each linked person's gift history, gifts are cleared, and your recipient list and budgets are kept for ${c.year + 1}.`, () => {
      const xs = xmasStats();
      c.archive.push({ year: c.year, budget: c.budget, spent: xs.spent, recipients: clone(c.recipients) });
      c.recipients.forEach(r => {
        const p = r.personId ? byId(state.people, r.personId) : null;
        if (p) { r.gifts.filter(g => XMAS_IDX[g.status] >= XMAS_BOUGHT_IDX).forEach(g => p.history.push({ id: uid(), year: c.year, occasion: 'Christmas', gift: g.title, price: num(g.price), notes: '' })); touch(p); }
        r.gifts = []; touch(r);
      });
      c.year += 1; commit(); toast(`Ready for Christmas ${c.year} 🎄`);
    }, { title: `Start Christmas ${c.year + 1}?`, yesLabel: 'Archive & start', danger: false });
  },

  /* Vault */
  'vault-new': () => vaultForm(),
  'vault-edit': el => vaultForm(el.dataset.id),
  'vault-delete': el => confirmModal('Delete this vault entry?', () => { state.vault = state.vault.filter(x => x.id !== el.dataset.id); commit(); }),
  'vault-cat': el => { ui.vaultCat = el.dataset.val; render(); },
  'copy': el => { const v = el.dataset.val; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Copied to clipboard')).catch(() => toast('Copy not available – select the text manually', 'error')); },

  /* Backup & data */
  'export-json': () => exportJSON(),
  'share-json': () => shareJSON(),
  'import-json': () => { const f = $('#import-file'); f.value = ''; f.click(); },
  'import-replace': () => applyImport('replace'),
  'import-merge': () => applyImport('merge'),
  'clear-sample': () => confirmModal('Remove all sample entries? Anything you have added yourself is kept.', () => {
    const real = x => !x.sample;
    const sampleIds = new Set(state.people.filter(x => x.sample).map(x => x.id));
    state.tasks = state.tasks.filter(real); state.checklists = state.checklists.filter(real); state.people = state.people.filter(real); state.vault = state.vault.filter(real);
    state.christmas.recipients = state.christmas.recipients.filter(r => real(r) && !sampleIds.has(r.personId));
    if (state.christmas.sampleBudget) { state.christmas.budget = 0; delete state.christmas.sampleBudget; }
    commit(); toast('Sample data cleared');
  }, { yesLabel: 'Clear sample data' }),
  'load-sample': () => confirmModal('Add the sample entries back alongside your own data?', () => {
    const s = sampleState();
    const strip = arr => arr.filter(x => !x.sample);
    state.tasks = [...strip(state.tasks), ...s.tasks]; state.checklists = [...strip(state.checklists), ...s.checklists];
    state.people = [...strip(state.people), ...s.people]; state.vault = [...strip(state.vault), ...s.vault];
    state.christmas.recipients = [...strip(state.christmas.recipients), ...s.christmas.recipients];
    if (!state.christmas.budget) { state.christmas.budget = s.christmas.budget; state.christmas.sampleBudget = true; }
    commit(); toast('Sample data loaded');
  }, { yesLabel: 'Load samples', danger: false }),
  'reset-all': () => confirmModal('Erase ALL data on this device? Export a backup first if unsure. If live sync is on, the empty data will also sync to your partner.', () => {
    const keep = state.settings; state = defaultState(); state.settings = keep; commit(); toast('All data erased');
  }, { yesLabel: 'Erase everything' }),

  /* Sync */
  'sync-genid': () => { const i = $('input[name=householdId]'); if (i) i.value = 'home-' + Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); },
  'sync-now': () => { if (!Sync.enabled()) { toast('Live sync is not enabled', 'error'); return; } Sync.setStatus('connecting'); Sync.pull(); },
  'sync-copy-link': () => { const l = syncSetupLink(); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => toast('Setup link copied – send it to the other phone')).catch(() => prompt('Copy this link:', l)); }
};

const FORMS = {
  'task-quick': (fd, form) => {
    const title = String(fd.get('title') || '').trim(); if (!title) return;
    state.tasks.push(touch({ id: uid(), title, due: fd.get('due') || '', priority: fd.get('priority') || 'medium', category: fd.get('category') || 'general', notes: '', done: false }));
    focusAfterRender = '[data-form="task-quick"] input[name=title]';
    commit(); toast('Task added');
  },
  'cl-add-item': (fd, form) => {
    const c = byId(state.checklists, form.dataset.id); const text = String(fd.get('text') || '').trim();
    if (!c || !text) return;
    c.items.push({ id: uid(), text, done: false }); touch(c);
    focusAfterRender = `[data-focus-key="cl-${c.id}"]`;
    commit();
  },
  'idea-add': (fd, form) => {
    const p = byId(state.people, form.dataset.id); const title = String(fd.get('title') || '').trim();
    if (!p || !title) return;
    p.ideas.push({ id: uid(), title, price: num(fd.get('price')), link: String(fd.get('link') || '').trim() }); touch(p);
    focusAfterRender = `[data-focus-key="idea-${p.id}"]`;
    commit();
  },
  'sync-settings': fd => {
    const sc = state.settings.sync;
    Object.assign(sc, { provider: fd.get('provider') || 'firebase', url: String(fd.get('url') || '').trim(), key: String(fd.get('key') || '').trim(), householdId: String(fd.get('householdId') || '').trim(), enabled: fd.get('enabled') === 'on' });
    if (sc.enabled && (!sc.url || !sc.householdId)) { toast('Enter a URL and Household ID first', 'error'); sc.enabled = false; }
    if (sc.enabled && sc.provider === 'supabase' && !sc.key) { toast('Supabase needs the anon key', 'error'); sc.enabled = false; }
    persist(); Sync.start(); render();
    toast(sc.enabled ? 'Sync settings saved – connecting…' : 'Sync settings saved (sync off)');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  if (el.tagName === 'A' && el.dataset.action !== 'close-modal') e.preventDefault();
  fn(el, e);
});

document.addEventListener('submit', e => {
  const form = e.target;
  if (form.id === 'modal-form') {
    e.preventDefault();
    if (!modalHandler) return;
    const seq = modalSeq, handler = modalHandler;
    const result = handler(new FormData(form), form);
    if (result !== false && seq === modalSeq) closeModal();   // don't close a modal opened by the handler
    return;
  }
  const key = form.dataset.form;
  if (key && FORMS[key]) { e.preventDefault(); FORMS[key](new FormData(form), form); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'import-file' && el.files && el.files[0]) { closeModal(); handleImportFile(el.files[0]); return; }
  if (el.dataset.change === 'xmas-gift-status') {
    const r = byId(state.christmas.recipients, el.dataset.id); const g = r && byId(r.gifts, el.dataset.item);
    if (!g) return; g.status = el.value; touch(r); commit();
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.input === 'vault-search') {
    ui.vaultSearch = e.target.value;
    $('#vault-list').innerHTML = vaultListHTML(); refreshIcons();
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* ============================ 11. ROUTER & BOOT ============================ */
let focusAfterRender = null, renderDeferred = false;
const route = () => { const r = (location.hash.match(/^#\/(\w+)/) || [])[1]; return TITLES[r] ? r : 'dashboard'; };

function renderNav(r) {
  $('#side-nav').innerHTML = NAV.map(n => `
    <a href="#/${n.id}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition ${r === n.id ? 'bg-teal-50 text-teal-800' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}">
      ${icon(n.icon, 'w-5 h-5 ' + (r === n.id ? 'text-teal-600' : 'text-slate-400'))}${n.label}</a>`).join('');
  $('#bottom-nav-inner').innerHTML = NAV.filter(n => !n.desktopOnly).map(n => `
    <a href="#/${n.id}" class="flex flex-col items-center justify-center gap-1 py-2.5 text-[11px] font-medium ${r === n.id ? 'text-teal-700' : 'text-slate-500'}">
      <span class="w-12 h-7 rounded-full flex items-center justify-center ${r === n.id ? 'bg-teal-50' : ''}">${icon(n.icon, 'w-5 h-5')}</span>${n.label}</a>`).join('');
}

const VIEWS = { dashboard: renderDashboard, tasks: renderTasks, birthdays: renderBirthdays, christmas: renderChristmas, vault: renderVault, settings: renderSettings };

function render() {
  renderDeferred = false;
  const r = route();
  $('#page-title').textContent = TITLES[r];
  document.title = `${TITLES[r]} · Home Hub`;
  renderNav(r);
  try { $('#view').innerHTML = `<div class="anim-fade">${VIEWS[r]()}</div>`; }
  catch (err) { console.error(err); $('#view').innerHTML = `<div class="${CARD} p-6 text-rose-700">Something went wrong displaying this page: ${esc(err.message)}. Try Settings → Export, then reload.</div>`; }
  updateSyncIndicators();
  refreshIcons();
  if (focusAfterRender) { const f = $(focusAfterRender); if (f) f.focus({ preventScroll: true }); focusAfterRender = null; }
}

/** For remote sync updates: don't wipe something the user is typing – wait until they leave the field. */
function scheduleRender() {
  const a = document.activeElement;
  if (a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { renderDeferred = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (renderDeferred) setTimeout(() => { if (renderDeferred) scheduleRender(); }, 50); });

window.addEventListener('hashchange', () => { if (checkSyncLink()) return; render(); window.scrollTo({ top: 0 }); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { ensureCycles(); if (Sync.enabled()) Sync.pull(); render(); }
});
window.addEventListener('storage', e => { if (e.key === STORE_KEY && e.newValue) { state = normalise(JSON.parse(e.newValue)); scheduleRender(); } }); // other tabs

// Boot
state = load();
ensureCycles();
checkSyncLink();
render();
Sync.start();
</script>
</body>
