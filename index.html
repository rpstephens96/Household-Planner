}

function finOutTab(st) {
  const F = fin();
  const filters = { all: () => true, monthly: o => o.frequency !== 'yearly', yearly: o => o.frequency === 'yearly', essential: o => o.type !== 'discretionary', discretionary: o => o.type === 'discretionary' };
  const f = filters[ui.finOutFilter] || filters.all;
  const list = st.outs.filter(f);
  const groups = F.outCats.map(c => ({ c, items: list.filter(o => finCat('out', o.categoryId).id === c.id).sort((a, b) => monthlyOf(b) - monthlyOf(a)) })).filter(g => g.items.length);
  const count = k => st.outs.filter(filters[k]).length;
  return `
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Monthly bills</p><p class="text-xl font-bold text-slate-900 tabular-nums">${money(st.monthlyOut)}</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Yearly bills</p><p class="text-xl font-bold text-slate-900 tabular-nums">${money(st.yearlyTotal)}</p><p class="text-xs text-slate-500">${money(st.billsPot)}/mo to the pot</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Essential</p><p class="text-xl font-bold text-teal-700 tabular-nums">${money(st.essential)}</p><p class="text-xs text-slate-500">per month</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Discretionary</p><p class="text-xl font-bold text-violet-700 tabular-nums">${money(st.discretionary)}</p><p class="text-xs text-slate-500">per month</p></div>
  </div>
  <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
    ${filterPills([['all', 'All', count('all')], ['monthly', 'Monthly', count('monthly')], ['yearly', 'Yearly', count('yearly')], ['essential', 'Essential', count('essential')], ['discretionary', 'Discretionary', count('discretionary')]], ui.finOutFilter, 'fin-out-filter')}
    <div class="flex gap-2"><button type="button" data-action="fin-cats" data-val="out" class="${BTN_GHOST}">${icon('tags')}Categories</button>
    <button type="button" data-action="fin-add-out" class="${BTN_PRIMARY}">${icon('plus')}Add outgoing</button></div>
  </div>
  <p class="text-xs text-slate-500 mb-4">${icon('info', 'w-3.5 h-3.5 inline -mt-0.5')} Vault entries with “Include in budget” ticked appear here automatically – edit their cost in the vault.</p>
  ${groups.length ? `<div class="space-y-4">${groups.map(g => `<section class="${CARD} px-4 md:px-5 pt-3">
      <div class="flex justify-between text-sm"><h3 class="font-semibold text-slate-800">${esc(g.c.label)}</h3><span class="text-slate-500 tabular-nums">${money(sum(g.items, monthlyOf))}/mo</span></div>
      <ul class="divide-y divide-slate-100">${g.items.map(o => finRow(o, 'out')).join('')}</ul></section>`).join('')}</div>`
    : `<div class="${CARD}">${emptyBox('receipt', st.outs.length ? 'Nothing in this view' : 'No outgoings yet', st.outs.length ? '' : 'Add regular bills, or use “Find from bank CSV”.')}</div>`}`;
}

function finSavingsTab(st) {
  const F = fin();
  return `
  <div class="grid grid-cols-3 gap-3 mb-4">
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Available after bills</p><p class="text-xl font-bold tabular-nums ${st.available < 0 ? 'text-rose-600' : 'text-slate-900'}">${money(st.available)}</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">To savings</p><p class="text-xl font-bold text-sky-700 tabular-nums">${money(st.savings)}</p></div>
    <div class="${CARD} p-4"><p class="text-xs text-slate-500">Left to spend</p><p class="text-xl font-bold tabular-nums ${st.left < 0 ? 'text-rose-600' : 'text-emerald-700'}">${money(st.left)}</p></div>
  </div>
  <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
    <p class="text-sm text-slate-500">Try different monthly amounts – the totals update as you change them.</p>
    <button type="button" data-action="pot-new" class="${BTN_PRIMARY}">${icon('plus')}Add savings pot</button>
  </div>
  <div class="grid md:grid-cols-2 gap-4 items-start mb-4">
    ${st.potAlloc.length ? st.potAlloc.map(({ p, monthly }) => {
      const target = num(p.target), bal = num(p.balance);
      const toGo = Math.max(0, target - bal);
      const months = target && monthly > 0 ? Math.ceil(toGo / monthly) : null;
      const reach = months !== null ? new Date(new Date().getFullYear(), new Date().getMonth() + months, 1).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' }) : '';
      let byDate = '';
      if (target && p.targetDate) {
        const m = Math.max(1, Math.ceil(daysUntil(p.targetDate) / 30.44));
        const need = toGo / m;
        byDate = `<p class="text-xs mt-1 ${need > monthly + 0.5 ? 'text-amber-700' : 'text-emerald-700'}">To reach it by ${fmtDate(p.targetDate)}: ${money(need)}/mo${need > monthly + 0.5 ? ` (${money(need - monthly)} more than now)` : ' ✓'}</p>`;
      }
      return `<article class="${CARD} p-4 md:p-5">
        <div class="flex items-start gap-3">
          <span class="w-10 h-10 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center shrink-0">${icon('piggy-bank', 'w-5 h-5')}</span>
          <div class="flex-1 min-w-0"><h3 class="font-semibold text-slate-900 break-words">${esc(p.name)}</h3>${p.notes ? `<p class="text-xs text-slate-500 break-words">${esc(p.notes)}</p>` : ''}</div>
          <button type="button" data-action="pot-edit" data-id="${p.id}" class="${ICON_BTN}" aria-label="Edit pot">${icon('pencil')}</button>
          <button type="button" data-action="pot-del" data-id="${p.id}" class="${ICON_BTN} -mr-2 hover:!text-rose-600" aria-label="Delete pot">${icon('trash-2')}</button>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-2">
          <div class="relative w-28">${p.mode === 'percent' ? '' : '<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">£</span>'}
            <input data-change="pot-value" data-id="${p.id}" value="${esc(p.value || '')}" inputmode="decimal" aria-label="Monthly allocation" class="${INPUT} !py-2 ${p.mode === 'percent' ? '' : 'pl-7'}"></div>
          <select data-change="pot-mode" data-id="${p.id}" aria-label="Allocation type" class="${INPUT} !py-2 !w-auto">
            <option value="fixed" ${p.mode !== 'percent' ? 'selected' : ''}>£ per month</option><option value="percent" ${p.mode === 'percent' ? 'selected' : ''}>% of available</option></select>
          <span class="text-sm text-slate-600">= <b class="tabular-nums">${money(monthly)}</b>/mo</span>
        </div>
        ${target ? `<div class="mt-3"><div class="flex justify-between text-xs text-slate-500 mb-1"><span>${money(bal)} of ${money(target)}</span><span>${months === null ? '' : months === 0 ? 'Target reached' : `≈ ${months} month${months === 1 ? '' : 's'} (${reach})`}</span></div>${progress(target ? bal / target * 100 : 0, 'bg-sky-500')}${byDate}</div>`
          : bal ? `<p class="text-xs text-slate-500 mt-3">Current balance ${money(bal)}</p>` : ''}
      </article>`;
    }).join('') : `<div class="${CARD} md:col-span-2">${emptyBox('piggy-bank', 'No savings pots yet', 'Create the savings accounts you’re considering, then try different monthly amounts to see what’s left.')}</div>`}
  </div>
  ${finBillsPotCard()}`;
}

function finImportTab() {
  const S = csvSession;
  const colOpts = f => [[-1, '— none —'], ...f.header.map((h, i) => [i, h || `Column ${i + 1}`])];
  const mapSel = (f, fi, key, label) => `<label class="block"><span class="block text-xs text-slate-500 mb-1">${label}</span>
    <select data-change="csv-map" data-file="${fi}" data-key="${key}" class="${INPUT} !py-1.5 !text-sm">${colOpts(f).map(([k, v]) => `<option value="${k}" ${Number(f.map[key]) === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>`;
  const filesHtml = S ? S.files.map((f, fi) => {
    const tx = f.txns || [];
    const dates = tx.map(t => t.date).sort();
    return `<div class="rounded-xl bg-slate-50 ring-1 ring-slate-200 p-3">
      <div class="flex items-start gap-3">
        <span class="w-9 h-9 rounded-lg bg-white ring-1 ring-slate-200 text-slate-500 flex items-center justify-center shrink-0">${icon('file-text')}</span>
        <div class="flex-1 min-w-0"><p class="text-sm font-medium text-slate-800 truncate">${esc(f.name)}</p>
          <p class="text-xs ${f.error ? 'text-rose-600' : 'text-slate-500'}">${f.error ? esc(f.error) : `${esc(f.bank)} · ${tx.length} transactions${dates.length ? ` · ${fmtDate(dates[0])} – ${fmtDate(dates[dates.length - 1])}` : ''}`}</p></div>
        <button type="button" data-action="csv-remove" data-val="${fi}" class="${ICON_BTN} !w-8 !h-8" aria-label="Remove file">${icon('x', 'w-3.5 h-3.5')}</button>
      </div>
      ${!f.error && f.header ? `<details class="mt-2" ${tx.length ? '' : 'open'}><summary class="text-xs font-medium text-teal-700">Column mapping${tx.length ? '' : ' – no transactions found, please check'}</summary>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">
          ${mapSel(f, fi, 'date', 'Date')}${mapSel(f, fi, 'desc', 'Description / payee')}${mapSel(f, fi, 'amount', 'Amount (+/−)')}
          ${mapSel(f, fi, 'in', 'Money in')}${mapSel(f, fi, 'out', 'Money out')}${mapSel(f, fi, 'type', 'Type (optional)')}
        </div>
        <label class="mt-2 flex items-center gap-2 text-xs text-slate-600"><input type="checkbox" data-change="csv-map" data-file="${fi}" data-key="flip" ${f.map.flip ? 'checked' : ''} class="accent-teal-600"> Payments out are shown as positive numbers in this file</label>
        <p class="text-[11px] text-slate-400 mt-1">Use either Amount, or Money in + Money out. The mapping is remembered for this layout.</p>
      </details>` : ''}
    </div>`;
  }).join('') : '';

  const confPill = s => s.conf === 'high' ? pill('Strong match', 'bg-emerald-50 text-emerald-700 ring-emerald-200') : s.conf === 'medium' ? pill('Likely', 'bg-amber-50 text-amber-700 ring-amber-200') : pill('Possible', 'bg-slate-100 text-slate-600 ring-slate-200');
  const sugCard = (s, i) => {
    const cats = s.dir === 'in' ? fin().incomeCats : fin().outCats;
    const evidence = s.kind === 'variable'
      ? `${s.count} payments over the period · averages ${money(s.amount)}/month`
      : s.kind === 'once' ? `Direct debit seen once on ${fmtDate(s.last)} – may be annual`
      : `${s.count} payments · ${s.intervalLabel} (~${s.interval} days) · last ${fmtDate(s.last)}${s.min !== s.max ? ` · ${money(s.min)}–${money(s.max)}` : ''}${s.intervalLabel === 'weekly' || s.intervalLabel === 'fortnightly' ? ' · converted to monthly' : ''}${s.intervalLabel === 'quarterly' || s.intervalLabel === 'six-monthly' ? ' · converted to a yearly total' : ''}`;
    return `<div class="rounded-xl ring-1 ring-slate-200 p-3 ${s.tracked || s.transfer ? 'bg-slate-50' : 'bg-white'}">
      <label class="flex items-start gap-3 cursor-pointer">
        <input type="checkbox" name="pick" value="${i}" ${s.checked ? 'checked' : ''} class="mt-0.5 w-5 h-5 accent-teal-600 shrink-0">
        <span class="flex-1 min-w-0"><span class="flex flex-wrap gap-1.5 mb-1">${confPill(s)}
          ${s.mandate ? pill('Direct debit / SO', 'bg-sky-50 text-sky-700 ring-sky-200') : ''}
          ${s.tracked ? pill('Already in budget', 'bg-teal-50 text-teal-700 ring-teal-200') : ''}
          ${s.transfer ? pill('Looks like a transfer', 'bg-slate-100 text-slate-600 ring-slate-200') : ''}
          ${s.stopped ? pill('May have stopped', 'bg-rose-50 text-rose-700 ring-rose-200') : ''}
          ${pill(esc(s.account), 'bg-white text-slate-500 ring-slate-200')}</span>
          <span class="block text-xs text-slate-500">${evidence}</span></span>
      </label>
      <div class="grid grid-cols-2 sm:grid-cols-6 gap-2 mt-2">
        <input name="name_${i}" value="${esc(s.name)}" aria-label="Name" class="${INPUT} !py-2 col-span-2">
        <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">£</span><input name="amount_${i}" value="${(Math.round(s.amount * 100) / 100).toFixed(2)}" inputmode="decimal" aria-label="Amount" class="${INPUT} !py-2 pl-7"></div>
        <select name="freq_${i}" aria-label="Frequency" class="${INPUT} !py-2">${Object.entries(FIN_FREQ).map(([k, l]) => `<option value="${k}" ${s.freq === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select name="cat_${i}" aria-label="Category" class="${INPUT} !py-2 ${s.dir === 'in' ? 'col-span-2' : ''}">${cats.map(c => `<option value="${c.id}" ${s.categoryId === c.id ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}</select>
        ${s.dir === 'out' ? `<select name="type_${i}" aria-label="Essential or discretionary" class="${INPUT} !py-2">${Object.entries(FIN_TYPES).map(([k, l]) => `<option value="${k}" ${s.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : ''}
      </div>
      ${s.vaultId ? `<label class="mt-2 flex items-start gap-2 text-xs text-indigo-800 bg-indigo-50 rounded-lg px-2.5 py-2"><input type="checkbox" name="link_${i}" checked class="mt-0.5 accent-indigo-600">
        Matches vault entry “${esc(s.vaultName)}” – include that entry in the budget instead of adding a duplicate (its vault cost is used).</label>` : ''}
    </div>`;
  };
  const sugs = S ? S.sugs : [];
  const section = (title, sub, filter) => {
    const idx = sugs.map((s, i) => [s, i]).filter(([s]) => filter(s));
    return idx.length ? `<div class="space-y-2"><h4 class="text-sm font-semibold text-slate-800 mt-4">${title} <span class="font-normal text-slate-400">${idx.length}</span></h4>${sub ? `<p class="text-xs text-slate-500">${sub}</p>` : ''}${idx.map(([s, i]) => sugCard(s, i)).join('')}</div>` : '';
  };

  return `
  <section class="${CARD} p-5 mb-4">
    <h3 class="font-semibold text-slate-900 flex items-center gap-2 mb-1">${icon('file-search', 'w-5 h-5 text-teal-600')} Find regular payments from bank statements</h3>
    <p class="text-sm text-slate-500">Upload CSV exports from Monzo, HSBC or Santander (or any bank). 3–12 months of history works best – yearly bills need at least a year to be spotted reliably.</p>
    <p class="mt-3 text-xs rounded-xl bg-teal-50 text-teal-800 px-3 py-2 flex gap-2">${icon('lock', 'w-4 h-4 shrink-0')}<span>Files are read on this device only. Transactions are never saved or uploaded – only the items you choose to add are kept.</span></p>
    <label class="mt-4 flex flex-col items-center justify-center gap-2 rounded-2xl border-2 border-dashed border-slate-300 hover:border-teal-400 hover:bg-teal-50/40 p-6 cursor-pointer transition text-center">
      <span class="w-11 h-11 rounded-xl bg-teal-50 text-teal-600 flex items-center justify-center">${icon('upload', 'w-5 h-5')}</span>
      <span class="text-sm font-medium text-slate-800">${S ? 'Add more statement files' : 'Choose statement files'}</span>
      <span class="text-xs text-slate-500">.csv (Monzo, HSBC, Santander, others) or Santander .txt · select several at once</span>
      <input type="file" id="csv-input" multiple accept=".csv,.txt,text/csv,text/plain" class="sr-only">
    </label>
    <details class="mt-3"><summary class="text-xs font-medium text-slate-600 flex items-center gap-1">How to export from each bank<span class="chev transition">${icon('chevron-down', 'w-3.5 h-3.5')}</span></summary>
      <ul class="mt-2 text-xs text-slate-600 space-y-1.5 list-disc pl-5">
        <li><b>Monzo:</b> app → Home → account → <i>Statements</i> / <i>Export transactions</i> → choose CSV and a date range (or web.monzo.com).</li>
        <li><b>HSBC:</b> online banking → account → <i>Download transactions</i> → CSV.</li>
        <li><b>Santander:</b> online banking → account → <i>Download transactions</i> → choose the CSV or text (.txt) option.</li>
      </ul></details>
  </section>

  ${S ? `<section class="${CARD} p-5 mb-4">
    <div class="flex items-center justify-between gap-2 mb-3"><h3 class="font-semibold text-slate-900">Files <span class="font-normal text-slate-400">${S.files.length}</span></h3>
      <button type="button" data-action="csv-clear" class="${BTN_GHOST} !py-1.5 !text-xs">${icon('eraser', 'w-3.5 h-3.5')}Clear all</button></div>
    <div class="space-y-2">${filesHtml}</div>
  </section>

  <form data-form="csv-apply" class="${CARD} p-5">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h3 class="font-semibold text-slate-900">${sugs.length ? `Suggestions <span class="font-normal text-slate-400">${sugs.length}</span>` : 'No regular payments found'}</h3>
      ${sugs.length ? `<div class="flex gap-2"><button type="button" data-action="csv-sel" data-val="all" class="text-xs font-medium text-teal-700">Select all</button><span class="text-slate-300">|</span><button type="button" data-action="csv-sel" data-val="none" class="text-xs font-medium text-teal-700">Select none</button></div>` : ''}
    </div>
    ${sugs.length ? `<p class="text-xs text-slate-500 mt-1">Strong and likely matches are pre-ticked. Check names, amounts and categories, then add.</p>` : `<p class="text-sm text-slate-500 mt-1">${S.txCount ? 'Try a longer date range, or check the column mapping above.' : 'No transactions could be read – check the column mapping above.'}</p>`}
    ${section('Income', 'Regular money coming in (e.g. salaries).', s => s.dir === 'in')}
    ${section('Regular outgoings', 'Payments that repeat on a schedule.', s => s.dir === 'out' && s.kind !== 'variable')}
    ${section('Variable spending', 'Frequent but irregular spending (e.g. groceries, fuel), shown as a monthly average. Not ticked by default.', s => s.kind === 'variable')}
    ${sugs.length ? `<div class="sticky bottom-20 md:bottom-4 mt-5 flex justify-end"><button type="submit" class="${BTN_PRIMARY} shadow-lg">${icon('check')}Add selected to budget</button></div>` : ''}
  </form>` : ''}`;
}

/* ============================== 7. FORMS ============================== */
function taskForm(id) {
  const t = id ? byId(state.tasks, id) : null;
  openModal({
    title: t ? 'Edit task' : 'New task', submitLabel: t ? 'Save' : 'Add task',
    body: `${field('Task', inp('title', t?.title, 'required placeholder="What needs doing?"'))}
      <div class="grid grid-cols-2 gap-3">${field('Due date', inp('due', t?.due, 'type="date"'))}
      ${field('Priority', sel('priority', Object.entries(PRIORITIES).map(([k, v]) => [k, v.label]), t?.priority || 'medium'))}</div>
      ${field('Category', sel('category', Object.entries(TASK_CATS), t?.category || 'general'))}
      ${field('Notes', ta('notes', t?.notes, 'placeholder="Optional"'))}`,
    onSubmit: fd => {
      const data = { title: fd.get('title').trim(), due: fd.get('due') || '', priority: fd.get('priority'), category: fd.get('category'), notes: fd.get('notes').trim() };
      const cur = id ? byId(state.tasks, id) : null;
      if (cur) Object.assign(cur, data, { updatedAt: Date.now() });
      else state.tasks.push(touch({ id: uid(), done: false, ...data }));
      commit(); toast(cur ? 'Task updated' : 'Task added');
    }
  });
}

function checklistForm(id) {
  const c = id ? byId(state.checklists, id) : null;
  openModal({
    title: c ? 'Edit checklist' : 'New checklist', submitLabel: c ? 'Save' : 'Create',
    body: `${field('Title', inp('title', c?.title, 'required placeholder="e.g. Holiday Packing"'))}
      ${chk('reusable', 'Reusable template', c ? c.reusable : true, 'Keep it and reset the ticks each time (e.g. Food Shop).')}
      ${c ? '' : field('Items', ta('items', '', 'rows="6" placeholder="One item per line"'), 'You can add more items later.')}`,
    onSubmit: fd => {
      const cur = id ? byId(state.checklists, id) : null;
      if (cur) { cur.title = fd.get('title').trim(); cur.reusable = fd.get('reusable') === 'on'; touch(cur); }
      else {
        const items = String(fd.get('items') || '').split('\n').map(s => s.trim()).filter(Boolean).map(text => ({ id: uid(), text, done: false }));
        state.checklists.unshift(touch({ id: uid(), title: fd.get('title').trim(), reusable: fd.get('reusable') === 'on', items }));
        ui.tasksTab = 'checklists';
        if (route() !== 'tasks') location.hash = '#/tasks';
      }
      commit();
    }
  });
}

function personForm(id) {
  const p = id ? byId(state.people, id) : null;
  openModal({
    title: p ? 'Edit person' : 'Add birthday', submitLabel: p ? 'Save' : 'Add',
    body: `${field('Name', inp('name', p?.name, 'required placeholder="e.g. Auntie Sue"'))}
      ${field('Relationship', inp('relationship', p?.relationship, 'placeholder="e.g. Aunt, Friend, Colleague" list="rel-list"') + `<datalist id="rel-list">${['Mother', 'Father', 'Sister', 'Brother', 'Son', 'Daughter', 'Grandparent', 'Aunt', 'Uncle', 'Cousin', 'Niece', 'Nephew', 'Friend', 'Godchild', 'Colleague'].map(x => `<option value="${x}">`).join('')}</datalist>`)}
      ${field('Date of birth', inp('dob', p?.dob, 'type="date" required'), 'If you don\'t know the year, pick any year and tick the box below.')}
      ${chk('yearUnknown', 'Birth year unknown (don\'t show age)', p ? p.yearKnown === false : false)}
      ${field('Notes', ta('notes', p?.notes, 'placeholder="Likes, sizes, allergies…"'))}`,
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), relationship: fd.get('relationship').trim(), dob: fd.get('dob'), yearKnown: fd.get('yearUnknown') !== 'on', notes: fd.get('notes').trim() };
      const cur = id ? byId(state.people, id) : null;
      if (cur) { const dobChanged = cur.dob !== data.dob; Object.assign(cur, data); if (dobChanged) cur.cycleFor = nextBirthday(cur).date; touch(cur); }
      else { const np = { id: uid(), ideas: [], history: [], finalGift: null, cardBought: false, cardSent: false, ...data }; np.cycleFor = nextBirthday(np).date; state.people.push(touch(np)); ui.personOpen[np.id] = true; }
      commit(); toast(cur ? 'Saved' : 'Birthday added');
    }
  });
}

function finalGiftForm(pid) {
  const p = byId(state.people, pid); if (!p) return;

function recipientForm(id) {
  const r = id ? byId(state.christmas.recipients, id) : null;
  openModal({
    title: r ? 'Edit recipient' : 'Add Christmas recipient', submitLabel: r ? 'Save' : 'Add',
    body: `${field('Name', inp('name', r?.name, 'required placeholder="e.g. Mrs Jones (teacher)"'))}
      ${field('Target budget', moneyInp('budget', r?.budget))}
      ${field('Notes', inp('notes', r?.notes, 'placeholder="Optional – sizes, Secret Santa limit…"'))}`,
    onSubmit: fd => {
      const data = { name: fd.get('name').trim(), budget: num(fd.get('budget')), notes: fd.get('notes').trim() };
      const cur = id ? byId(state.christmas.recipients, id) : null;
      if (cur) Object.assign(cur, data, { updatedAt: Date.now() });

function xmasGiftForm(rid, gid) {
  const R = state.christmas.recipients;
  const r = rid ? byId(R, rid) : null;
  const g = r && gid ? byId(r.gifts, gid) : null;
  const recipientPicker = r ? '' : field('For', sel('rid', [...R.map(x => [x.id, x.name]), ['__new', '+ New recipient…']], R[0]?.id || '__new'))
    + `<div data-newname class="${R.length ? 'hidden' : ''}">${field('New recipient name', inp('newName', '', 'placeholder="Name"'))}</div>`;
  openModal({
    title: g ? 'Edit gift' : `Add gift${r ? ' for ' + esc(r.name) : ''}`, submitLabel: g ? 'Save' : 'Add gift',
    body: `${recipientPicker}
      ${field('Gift', inp('title', g?.title, 'required placeholder="e.g. Cosy slippers"'))}
      <div class="grid grid-cols-2 gap-3">${field('Price', moneyInp('price', g?.price))}
      ${field('Status', sel('status', XMAS_STATUS.map(s => [s.id, s.label]), g?.status || 'idea'))}</div>
      ${field('Link', inp('link', g?.link, 'placeholder="Optional shop link"'))}`,
    onSubmit: fd => {
      let rr = rid ? byId(state.christmas.recipients, rid) : null;
      if (!rr) {
        const sid = fd.get('rid');
        if (sid && sid !== '__new') rr = byId(state.christmas.recipients, sid);
        else {
          const nm = String(fd.get('newName') || '').trim();
          if (!nm) { toast('Enter a name for the new recipient', 'error'); return false; }
          rr = touch({ id: uid(), name: nm, personId: null, budget: 0, notes: '', gifts: [] });
          state.christmas.recipients.push(rr);
        }
      }
      if (!rr) return;
      const data = { title: fd.get('title').trim(), price: num(fd.get('price')), status: fd.get('status'), link: fd.get('link').trim() };
      const cur = gid ? byId(rr.gifts, gid) : null;
      if (cur) Object.assign(cur, data); else rr.gifts.push({ id: uid(), ...data });
      touch(rr); commit();
      if (route() !== 'christmas') toast(`Gift added for ${rr.name}`);
    }
  });
  const s = $('#modal-form select[name=rid]');
  if (s) s.addEventListener('change', () => $('#modal-form [data-newname]').classList.toggle('hidden', s.value !== '__new'));
}

function importRecipientsForm() {
  const linked = new Set(state.christmas.recipients.map(r => r.personId).filter(Boolean));
  const avail = state.people.filter(p => !linked.has(p.id)).sort((a, b) => a.name.localeCompare(b.name));
  if (!avail.length) { toast(state.people.length ? 'Everyone on the birthday list is already added' : 'Your birthday list is empty'); return; }
  openModal({
    title: 'Import from birthday list', submitLabel: 'Import selected',
    body: `<div class="flex justify-between items-center"><p class="text-sm text-slate-500">Choose who to add to Christmas ${state.christmas.year}.</p>
        <button type="button" data-action="select-all" class="text-sm text-teal-700 font-medium">Select all</button></div>
      <div class="space-y-2">${avail.map(p => `<label class="flex items-center gap-3 rounded-xl ring-1 ring-slate-200 px-3 py-2.5 cursor-pointer has-[:checked]:ring-teal-400 has-[:checked]:bg-teal-50/50">
        <input type="checkbox" name="pid" value="${p.id}" class="w-5 h-5 accent-teal-600">
        <span class="w-8 h-8 rounded-full ${avatarCls(p.name)} flex items-center justify-center text-xs font-semibold">${initials(p.name)}</span>
        <span class="text-sm font-medium text-slate-800">${esc(p.name)}<span class="block text-xs font-normal text-slate-500">${esc(p.relationship || '')}</span></span></label>`).join('')}</div>
      ${field('Default target budget each', moneyInp('budget', ''))}`,
    onSubmit: fd => {
      const ids = fd.getAll('pid');
      if (!ids.length) { toast('Select at least one person', 'error'); return false; }
      const b = num(fd.get('budget'));
      ids.forEach(pid => { const p = byId(state.people, pid); if (p) state.christmas.recipients.push(touch({ id: uid(), name: p.name, personId: p.id, budget: b, notes: '', gifts: [] })); });
      commit(); toast(`${ids.length} recipient${ids.length > 1 ? 's' : ''} added`);
    }
  });
}

/* ---------- Finance forms ---------- */
function finItemForm(kind, id) {
  const F = fin();
  const list = kind === 'income' ? F.incomes : F.outgoings;
  const o = id ? byId(list, id) : null;
  const cats = kind === 'income' ? F.incomeCats : F.outCats;
  const defCat = (o && o.categoryId) || (cats[0] && cats[0].id);
  const defType = o ? o.type : ((cats.find(c => c.id === defCat) || {}).essential === false ? 'discretionary' : 'essential');
  openModal({
    title: o ? `Edit ${kind === 'income' ? 'income' : 'outgoing'}` : (kind === 'income' ? 'Add income' : 'Add outgoing'), submitLabel: o ? 'Save' : 'Add',
    body: `${field('Name', inp('name', o?.name, `required placeholder="${kind === 'income' ? 'e.g. Rob – salary' : 'e.g. Council tax'}"`))}
      ${field(kind === 'income' ? 'Take-home amount' : 'Amount', moneyInp('amount', o?.amount), kind === 'income' ? 'After tax, NI and pension.' : '')}
      ${fieldDiv('How often', seg('frequency', Object.entries(FIN_FREQ), o?.frequency || 'monthly'), kind === 'out' ? 'Yearly bills are saved for at ÷ 12 a month in the bills pot.' : 'Yearly amounts are spread ÷ 12.')}
      ${field('Category', sel('categoryId', cats.map(c => [c.id, c.label]), defCat))}
      ${kind === 'out' ? fieldDiv('Type', seg('type', Object.entries(FIN_TYPES), defType || 'essential')) : ''}
      ${kind === 'out' ? field('Next payment date (yearly bills)', inp('dueDate', o?.dueDate, 'type="date"'), 'Used to check the bills pot is on track. Leave blank for monthly items.') : ''}
      ${field('Notes', ta('notes', o?.notes, 'placeholder="Optional"'))}`,
    onSubmit: fd => {
      const amount = num(fd.get('amount'));
      if (amount <= 0) { toast('Enter an amount above £0', 'error'); return false; }
      const data = { name: String(fd.get('name') || '').trim(), amount, frequency: fd.get('frequency') === 'yearly' ? 'yearly' : 'monthly', categoryId: fd.get('categoryId'), notes: String(fd.get('notes') || '').trim() };
      if (kind === 'out') { data.type = fd.get('type') === 'discretionary' ? 'discretionary' : 'essential'; data.dueDate = fd.get('dueDate') || ''; }
      const arr = kind === 'income' ? fin().incomes : fin().outgoings;
      const cur = id ? byId(arr, id) : null;
      if (cur) Object.assign(cur, data, { updatedAt: Date.now() }); else arr.push(touch({ id: uid(), ...data }));
      commit(); toast(cur ? 'Saved' : 'Added');
    }
  });
  if (kind === 'out' && !o) {   // new outgoing: default Essential/Discretionary from the chosen category
    const s = $('#modal-form select[name=categoryId]');
    if (s) s.addEventListener('change', () => {
      const c = fin().outCats.find(x => x.id === s.value);
      const r = $(`#modal-form input[name=type][value=${c && c.essential === false ? 'discretionary' : 'essential'}]`);
      if (r) r.checked = true;
    });
  }
}

let csvSession = null;

function payeeKey(s, words) {

  t = t.replace(/,?\s*\b(ref(erence)?|mandate( no)?|on \d{1,2}[-\/]\d{1,2}[-\/]\d{2,4}|via)\b.*$/, ' ');

  }

    const first = Math.max(0, rows.findIndex(r => parseDateAny(r[0])));
    const sample = rows.slice(first, first + 15);
    const ncol = Math.max(0, ...sample.map(r => r.length));

    if (amount < 0) for (let c = 1; c < ncol; c++) if (numeric(c)) { amount = c; break; }

    amount: find(/^amount$/, /^value$/, /^amount \(gbp\)$/, /^amount(?!.*local)/),
    in: find(/money in/, /paid in/, /^credit/, /^in$/, /credit amount/),
    out: find(/money out/, /paid out/, /^debit/, /^out$/, /debit amount/),
    type: find(/^type$/, /transaction type/),
    cat: find(/^category$/),

const OUT_RULES = [
  [/mortgage|\brent\b|council tax|ground rent|service charge|lettings|housing assoc/, 'housing'],
  [/octopus|british gas|\bedf\b|e\.?on|\bovo\b|scottish power|so energy|utility warehouse|water|thames|severn|anglian|united utilities|\bbt\b|sky digital|\bsky\b|virgin media|plusnet|talktalk|vodafone|\bee\b|\bo2\b|three|giffgaff|tv licen|hyperoptic|community fibre|energy/, 'utilities'],

  [/tesco|sainsbury|asda|aldi|lidl|morrisons|ocado|waitrose|co-?op|iceland|m ?& ?s|marks|farmfoods|grocer/, 'food'],
  [/nursery|childcare|childminder|school|tax-?free childcare|after school/, 'childcare'],

  [/\bgym\b|puregym|the gym|david lloyd|nuffield|restaurant|deliveroo|just eat|uber eats|cinema|odeon|cineworld|\bpub\b|costa|starbucks|greggs/, 'leisure']
];
const MONZO_CATS = { bills: 'utilities', groceries: 'food', transport: 'transport', entertainment: 'leisure', eating_out: 'leisure', 'eating out': 'leisure', holidays: 'leisure', family: 'childcare', finances: 'debt', gifts: 'gifts' };
function guessFinCat(dir, text, mcat) {

  const has = (L, id) => L.some(c => c.id === id);
  if (dir === 'in') {

function classifyInterval(d) {

  if (d >= 12 && d <= 17) return { freq: 'monthly', mult: 26 / 12, label: 'fortnightly', tol: [11, 18] };
  if (d >= 24 && d <= 36) return { freq: 'monthly', mult: 1, label: 'monthly', tol: [20, 40] };
  if (d >= 80 && d <= 100) return { freq: 'yearly', mult: 4, label: 'quarterly', tol: [75, 105] };
  if (d >= 170 && d <= 200) return { freq: 'yearly', mult: 2, label: 'six-monthly', tol: [160, 210] };

  const top = (Object.entries(counts).sort((a, b) => b[1] - a[1])[0] || [''])[0];

/** Group transactions by payee + direction + account, then look for a repeating interval and steady amount. */
function analyseCsv() {
  const S = csvSession; if (!S) return;
  S.files.forEach(f => { if (!f.error) buildTxns(f); });
  const all = S.files.flatMap(f => f.txns || []);
  S.txCount = all.length; S.sugs = [];
  if (!all.length) return;
  const dates = all.map(t => t.date).sort();
  S.from = dates[0]; S.to = dates[dates.length - 1];
  const span = Math.max(1, dayDiff(S.from, S.to));
  const groups = new Map();
  all.forEach(t => {
    if (/pot transfer|flex/i.test(t.type)) return;          // Monzo pot moves are never bills
    const dir = t.amount < 0 ? 'out' : 'in';
    const key = payeeKey(t.desc); if (!key) return;
    const k = dir + '|' + key + '|' + t.account;
    if (!groups.has(k)) groups.set(k, { dir, key, account: t.account, list: [] });
    groups.get(k).list.push(t);
  });

  const existingIn = fin().incomes.map(o => payeeKey(o.name)).filter(Boolean);
  groups.forEach(g => {
    const list = g.list.sort((a, b) => a.date < b.date ? -1 : 1);
    const amts = list.map(t => Math.abs(t.amount));
    const udates = [...new Set(list.map(t => t.date))];
    const intervals = udates.slice(1).map((d, i) => dayDiff(udates[i], d));
    const last = udates[udates.length - 1];
    const text = list.map(t => t.desc + ' ' + t.type).join(' ');
    const isMandate = /direct debit|standing order|\bdd\b|\bso\b|d\/d|s\/o/i.test(text);
    const isTransfer = /\b(transfer|tfr|pot|savings?|isa|own account|monzo|santander|hsbc|round ?ups?)\b/i.test(list[0].desc);

        }

      }

    }

}

async function loadCsvFiles(fileList) {
  const files = Array.from(fileList || []); if (!files.length) return;
  const read = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('read failed')); r.readAsText(f); });
  if (!csvSession) csvSession = { files: [], sugs: [] };
  for (const file of files) {
    const entry = { name: file.name };
    try {
      const text = await read(file);
      if (/^\s*Date\s*:/mi.test(text) && /^\s*Amount\s*:/mi.test(text)) {
        const rows = parseSantanderTxt(text);
        Object.assign(entry, { rows, start: 1, header: rows[0], map: { date: 0, desc: 1, amount: 2, in: -1, out: -1, type: -1, cat: -1, flip: false }, bank: 'Santander', headerless: false, sig: 'santander-txt' });
      } else {
        const rows = parseCSVText(text);
        if (!rows.length) throw new Error('the file is empty');
        Object.assign(entry, { rows }, detectLayout(rows));
        entry.sig = entry.headerless ? 'headerless:' + entry.header.length : entry.header.map(x => x.toLowerCase()).join('|');
        const saved = fin().csvProfiles[entry.sig];
        if (saved) entry.map = Object.assign({}, entry.map, saved);
      }
      const base = entry.bank.split(/[ /]/)[0];
      const same = csvSession.files.filter(f => f.label && f.label.startsWith(base)).length;
      entry.label = same ? `${base} ${same + 1}` : base;
    } catch (e) {
      entry.error = 'Could not read this file: ' + (e.message || e);
      entry.label = file.name;
    }
    csvSession.files.push(entry);
  }
  if (!appBooted || !csvSession) return;   // signed out while reading
  analyseCsv();
  render();
}

/** Parse an imported file and ask whether to replace or merge. */
function handleImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); } catch (e) { toast('That file is not valid JSON', 'error'); return; }
    const data = obj && obj.data ? obj.data : obj;
    if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.people) || !Array.isArray(data.vault)) { toast('This does not look like a Home Hub backup', 'error'); return; }
    const when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleString('en-GB') : 'unknown date';
    openModal({
      title: 'Import backup',
      body: `<p class="text-sm text-slate-600">Backup from <b>${esc(when)}</b> containing ${data.tasks.length} tasks, ${data.people.length} people, ${(data.christmas?.recipients || []).length} Christmas recipients and ${data.vault.length} vault entries.</p>
        <div class="grid gap-3">
          <button type="button" data-action="import-replace" class="rounded-2xl ring-1 ring-slate-200 hover:ring-teal-300 p-4 text-left">
            <span class="font-semibold text-slate-800 flex items-center gap-2">${icon('refresh-cw', 'w-4 h-4 text-teal-600')}Replace my data</span>
            <span class="block text-xs text-slate-500 mt-1">Best when your partner has the latest version. Your current data is overwritten.</span></button>
          <button type="button" data-action="import-merge" class="rounded-2xl ring-1 ring-slate-200 hover:ring-teal-300 p-4 text-left">
            <span class="font-semibold text-slate-800 flex items-center gap-2">${icon('git-merge', 'w-4 h-4 text-sky-600')}Merge with my data</span>
            <span class="block text-xs text-slate-500 mt-1">Adds anything new and keeps the most recently edited version of each item. Deletions are not carried across.</span></button>
        </div>`
    });
    pendingImport = data;
  };
  reader.readAsText(file);
}
let pendingImport = null;
function mergeArrays(local, incoming) {
  const map = new Map(local.map(x => [x.id, x]));
  (incoming || []).forEach(x => {
    if (!x || !x.id) return;
    const cur = map.get(x.id);
    if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) map.set(x.id, x);
  });
  return Array.from(map.values());
}
function applyImport(mode) {
  const data = pendingImport; pendingImport = null;
  if (!data) return;
  if (mode === 'replace') {
    const keep = state.settings;
    state = normalise({ ...clone(data), settings: keep });
  } else {
    const inc = normalise(clone(data));
    state.tasks = mergeArrays(state.tasks, inc.tasks);
    state.checklists = mergeArrays(state.checklists, inc.checklists);
    state.people = mergeArrays(state.people, inc.people);
    state.vault = mergeArrays(state.vault, inc.vault);
    state.vaultCats = mergeArrays(state.vaultCats, inc.vaultCats);
    ['incomes', 'outgoings', 'pots', 'incomeCats', 'outCats'].forEach(k => { state.finance[k] = mergeArrays(state.finance[k], inc.finance[k]); });
    if (inc.christmas.year === state.christmas.year) {
      state.christmas.recipients = mergeArrays(state.christmas.recipients, inc.christmas.recipients);
      if (!state.christmas.budget) state.christmas.budget = inc.christmas.budget;
    }
  }
  ensureCycles();
  closeModal(); commit();
  toast(mode === 'replace' ? 'Data replaced from backup' : 'Backup merged');
}

/* =========================== 9. CLOUD SYNC =========================== */
/* Whole-document, last-write-wins sync. Data is stored as a JSON string so
   Firebase never mangles arrays/empty values. Device-specific sync settings
   (URL, key) are never uploaded. */
const RULES_TEXT = `{
  "rules": {
    ".read": false,
    ".write": false,
    "households": {
      "$householdId": {
        ".read":  "auth != null && auth.token.email_verified == true && (auth.token.email == '${ALLOWED_EMAILS[0] || 'you@gmail.com'}' || auth.token.email == '${ALLOWED_EMAILS[1] || 'partner@gmail.com'}')",
        ".write": "auth != null && auth.token.email_verified == true && (auth.token.email == '${ALLOWED_EMAILS[0] || 'you@gmail.com'}' || auth.token.email == '${ALLOWED_EMAILS[1] || 'partner@gmail.com'}')",
        ".validate": "newData.hasChildren(['payload', 'updatedAt', 'updatedBy']) && $householdId.matches(/^[A-Za-z0-9_-]{6,64}$/)",
        "payload":   { ".validate": "newData.isString() && newData.val().length < 5000000" },
        "updatedAt": { ".validate": "newData.isNumber()" },
        "updatedBy": { ".validate": "newData.isString() && newData.val().length < 200" },
        "$other":    { ".validate": false }
      }
    }
  }
}`;

function friendlyFbError(e) {
  const m = String((e && (e.code || e.message)) || e || '');
  if (/permission[_ -]?denied/i.test(m)) return 'Permission denied – check the Security Rules are published and you are signed in with an approved account.';
  if (/network|unavailable|offline/i.test(m)) return 'Network problem – changes are saved on this device and will sync when back online.';
  return m || 'Unknown sync error';
}

/* Whole-document, last-write-wins sync via the Firebase modular SDK.
   Every read/write is made with the signed-in user's ID token, so the
   Security Rules decide access. Nothing runs until Auth has approved the user. */
const Sync = {
  status: 'off', message: '', unsub: null, unsubConn: null, pushTimer: null, ready: false, connected: true,
  cfg() { return state.settings.sync; },
  householdId() { return String(this.cfg().householdId || '').trim(); },
  enabled() { return !!(window.FB && Auth.user && state && this.cfg().enabled && HOUSEHOLD_ID_RE.test(this.householdId())); },
  nodeRef() { return FB.ref(FB.db, 'households/' + this.householdId()); },
  setStatus(s, msg = '') { this.status = s; this.message = msg; updateSyncIndicators(); },

  start() {
    this.stop();
    if (!this.enabled()) { this.setStatus('off'); ensureCycles(); return; }
    this.setStatus('connecting');
    try {
      // Fires once immediately with the current cloud copy, then on every change
      this.unsub = FB.onValue(this.nodeRef(), snap => this.handleRemote(snap.val()), err => this.setStatus('error', friendlyFbError(err)));
      this.unsubConn = FB.onValue(FB.ref(FB.db, '.info/connected'), snap => {
        this.connected = !!snap.val();
        if (!this.connected && this.ready && this.status !== 'error') this.setStatus('offline');
        else if (this.connected && this.status === 'offline') this.setStatus('live');
      });
    } catch (e) { this.setStatus('error', friendlyFbError(e)); }
  },
  stop() {
    if (this.unsub) { try { this.unsub(); } catch (e) { /* ignore */ } this.unsub = null; }
    if (this.unsubConn) { try { this.unsubConn(); } catch (e) { /* ignore */ } this.unsubConn = null; }
    clearTimeout(this.pushTimer); this.pushTimer = null;
    this.ready = false;
  },

  async pull() {
    if (!this.enabled()) return;
    try { const snap = await FB.get(this.nodeRef()); this.handleRemote(snap.val()); }
    catch (e) { this.setStatus('error', friendlyFbError(e)); }
  },

  handleRemote(rec) {
    this.ready = true;
    if (!rec || !rec.payload) { this.push(); ensureCycles(); return; }   // empty cloud → upload ours
    const remoteAt = Number(rec.updatedAt) || 0, localAt = state.meta.updatedAt || 0;
    if (remoteAt > localAt) {
      try {
        const data = JSON.parse(rec.payload);
        const keep = state.settings;
        state = normalise({ ...data, settings: keep });
        state.meta.updatedAt = remoteAt; state.meta.updatedBy = rec.updatedBy;
        state.settings.sync.lastSync = Date.now();
        persist();
        this.setStatus(this.connected ? 'live' : 'offline');
        scheduleRender();
      } catch (e) { this.setStatus('error', 'Cloud data could not be read'); }
    } else if (remoteAt < localAt) {
      this.push();                                                       // ours is newer
    } else if (this.status !== 'pending') {
      this.setStatus(this.connected ? 'live' : 'offline');
    }
    ensureCycles();   // run birthday roll-over only once we hold the latest data
  },

  schedulePush() {
    if (!this.enabled()) return;
    this.setStatus('pending');
    if (!this.ready) return;                 // first snapshot will decide who wins
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.push(), 700);
  },

  async push() {
    if (!this.enabled() || !this.ready) return;
    if (!state.meta.updatedAt) { state.meta.updatedAt = Date.now(); persist(); }
    const rec = { payload: JSON.stringify(exportable()), updatedAt: state.meta.updatedAt, updatedBy: Auth.email() || CLIENT_ID };
    this.setStatus('pending');
    try {
      await FB.set(this.nodeRef(), rec);    // resolves once the server has accepted the write
      state.settings.sync.lastSync = Date.now(); persist();
      this.setStatus(this.connected ? 'live' : 'offline');
    } catch (e) { this.setStatus('error', friendlyFbError(e)); }
  }
};

function updateSyncIndicators() {

}
function checkSyncLink() {
  if (!location.hash.startsWith('#sync=')) return false;
  let raw = decodeURIComponent(location.hash.slice(6)), id = raw;
  try { const old = JSON.parse(decodeURIComponent(escape(atob(raw)))); if (old && old.h) id = old.h; } catch (e) { /* new format */ }

    title: 'Connect to household sync?',
    body: `<p class="text-sm text-slate-600">This device will connect to household <code class="bg-slate-100 px-1 rounded">${esc(id)}</code> as <b>${esc(Auth.email())}</b>.</p>

  'csv-clear': () => { csvSession = null; render(); toast('Statement data cleared'); },
  'csv-sel': el => $$('#view input[name=pick]').forEach(c => { c.checked = el.dataset.val === 'all'; }),

  /* Backup & data */
  'export-json': () => exportJSON(),
  'share-json': () => shareJSON(),
  'import-json': () => { const f = $('#import-file'); f.value = ''; f.click(); },
  'import-replace': () => applyImport('replace'),
  'import-merge': () => applyImport('merge'),
  'clear-sample': () => confirmModal('Remove all sample entries? Anything you have added yourself is kept.', () => {
    const real = x => !x.sample;
    const sampleIds = new Set(state.people.filter(x => x.sample).map(x => x.id));
    state.tasks = state.tasks.filter(real); state.checklists = state.checklists.filter(real); state.people = state.people.filter(real); state.vault = state.vault.filter(real);
    state.christmas.recipients = state.christmas.recipients.filter(r => real(r) && !sampleIds.has(r.personId));
    if (state.christmas.sampleBudget) { state.christmas.budget = 0; delete state.christmas.sampleBudget; }
    commit(); toast('Sample data cleared');
  }, { yesLabel: 'Clear sample data' }),
  'load-sample': () => confirmModal('Add the sample entries back alongside your own data?', () => {
    const s = sampleState();
    const strip = arr => arr.filter(x => !x.sample);
    state.tasks = [...strip(state.tasks), ...s.tasks]; state.checklists = [...strip(state.checklists), ...s.checklists];
    state.people = [...strip(state.people), ...s.people]; state.vault = [...strip(state.vault), ...s.vault];
    state.christmas.recipients = [...strip(state.christmas.recipients), ...s.christmas.recipients];
    if (!state.christmas.budget) { state.christmas.budget = s.christmas.budget; state.christmas.sampleBudget = true; }
    commit(); toast('Sample data loaded');
  }, { yesLabel: 'Load samples', danger: false }),
  'reset-all': () => confirmModal('Erase ALL data on this device? Export a backup first if unsure. If live sync is on, the empty data will also sync to your partner.', () => {
    const keep = state.settings; state = defaultState(); state.settings = keep; commit(); toast('All data erased');
  }, { yesLabel: 'Erase everything' }),

  /* Sync */
  'sync-genid': () => { const i = $('input[name=householdId]'); if (i) i.value = 'home-' + Array.from(crypto.getRandomValues(new Uint8Array(10)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join(''); },
  'sync-now': () => { if (!Sync.enabled()) { toast('Live sync is not enabled', 'error'); return; } Sync.setStatus('connecting'); Sync.pull(); },
  'sync-copy-link': () => { const l = syncSetupLink(); (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => toast('Setup link copied – send it to the other phone')).catch(() => prompt('Copy this link:', l)); }
};

const FORMS = {
  'csv-apply': fd => {
    const S = csvSession; if (!S) return;
    const picks = fd.getAll('pick').map(Number);
    if (!picks.length) { toast('Tick at least one suggestion', 'error'); return; }
    let nIn = 0, nOut = 0, nLink = 0;
    picks.forEach(i => {
      const s = S.sugs[i]; if (!s) return;
      const name = String(fd.get('name_' + i) || s.name).trim() || s.name;
      const amount = num(fd.get('amount_' + i));
      const frequency = fd.get('freq_' + i) === 'yearly' ? 'yearly' : 'monthly';
      const categoryId = fd.get('cat_' + i) || (s.dir === 'in' ? 'inc_other' : 'out_other');
      if (amount <= 0) return;
      if (s.dir === 'in') { fin().incomes.push(touch({ id: uid(), name, amount, frequency, categoryId, notes: 'Found from bank statement' })); nIn++; return; }
      const type = fd.get('type_' + i) === 'discretionary' ? 'discretionary' : 'essential';
      const v = s.vaultId && fd.get('link_' + i) === 'on' ? byId(state.vault, s.vaultId) : null;
      if (v) { v.inBudget = true; v.finCat = categoryId; v.finType = type; touch(v); nLink++; return; }
      fin().outgoings.push(touch({ id: uid(), name, amount, frequency, categoryId, type, dueDate: frequency === 'yearly' ? (nextAnnual(s.last) || '') : '',
        notes: s.kind === 'variable' ? 'Average from bank statement' : 'Found from bank statement' }));
      nOut++;
    });
    csvSession = null;                       // statement data is discarded once used
    ui.finTab = nIn && !nOut && !nLink ? 'income' : 'outgoings';
    commit(); window.scrollTo({ top: 0 });
    toast(`Added ${nIn + nOut} item${nIn + nOut === 1 ? '' : 's'}${nLink ? ` · linked ${nLink} vault entr${nLink === 1 ? 'y' : 'ies'}` : ''}`);
  },
  'task-quick': (fd, form) => {
    const title = String(fd.get('title') || '').trim(); if (!title) return;
    state.tasks.push(touch({ id: uid(), title, due: fd.get('due') || '', priority: fd.get('priority') || 'medium', category: fd.get('category') || 'general', notes: '', done: false }));
    focusAfterRender = '[data-form="task-quick"] input[name=title]';
    commit(); toast('Task added');
  },
  'cl-add-item': (fd, form) => {
    const c = byId(state.checklists, form.dataset.id); const text = String(fd.get('text') || '').trim();
    if (!c || !text) return;
    c.items.push({ id: uid(), text, done: false }); touch(c);
    focusAfterRender = `[data-focus-key="cl-${c.id}"]`;
    commit();
  },
  'idea-add': (fd, form) => {
    const p = byId(state.people, form.dataset.id); const title = String(fd.get('title') || '').trim();
    if (!p || !title) return;
    p.ideas.push({ id: uid(), title, price: num(fd.get('price')), link: String(fd.get('link') || '').trim() }); touch(p);
    focusAfterRender = `[data-focus-key="idea-${p.id}"]`;
    commit();
  },
  'sync-settings': fd => {
    const sc = state.settings.sync;
    const newId = String(fd.get('householdId') || '').trim();
    const enabled = fd.get('enabled') === 'on';
    if (newId && !HOUSEHOLD_ID_RE.test(newId)) { toast('Household ID: 6–64 letters, numbers, - or _', 'error'); return; }
    if (enabled && !newId) { toast('Enter or generate a Household ID first', 'error'); return; }
    if (newId !== sc.householdId) state.meta.updatedAt = 0;   // joining a household: existing cloud data wins; empty cloud receives ours
    Object.assign(sc, { householdId: newId, enabled });
    persist(); Sync.start(); render();
    toast(sc.enabled ? 'Sync settings saved – connecting…' : 'Sync settings saved (sync off)');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  if (!appBooted && el.dataset.action !== 'sign-in') return;   // auth gate: nothing works before sign-in
  if (el.tagName === 'A' && el.dataset.action !== 'close-modal') e.preventDefault();
  fn(el, e);
});

document.addEventListener('submit', e => {
  const form = e.target;
  if (!appBooted) { e.preventDefault(); return; }
  if (form.id === 'modal-form') {
    e.preventDefault();
    if (!modalHandler) return;
    const seq = modalSeq, handler = modalHandler;
    const result = handler(new FormData(form), form);
    if (result !== false && seq === modalSeq) closeModal();   // don't close a modal opened by the handler
    return;
  }
  const key = form.dataset.form;
  if (key && FORMS[key]) { e.preventDefault(); FORMS[key](new FormData(form), form); }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (!appBooted) return;
  if (el.id === 'import-file' && el.files && el.files[0]) { closeModal(); handleImportFile(el.files[0]); return; }
  if (el.id === 'csv-input' && el.files && el.files.length) { loadCsvFiles(el.files); return; }
  if (el.dataset.change === 'csv-map' && csvSession) {
    const f = csvSession.files[Number(el.dataset.file)]; if (!f) return;
    if (el.dataset.key === 'flip') f.map.flip = el.checked; else f.map[el.dataset.key] = Number(el.value);
    if (el.dataset.key === 'amount' && f.map.amount >= 0) { f.map.in = -1; f.map.out = -1; }
    if ((el.dataset.key === 'in' || el.dataset.key === 'out') && Number(el.value) >= 0) f.map.amount = -1;
    if (f.sig) { fin().csvProfiles[f.sig] = { ...f.map }; save(); }   // remember layout only – never transactions
    analyseCsv(); render(); return;
  }
  if (el.dataset.change === 'pot-value' || el.dataset.change === 'pot-mode') {
    const p = byId(fin().pots, el.dataset.id); if (!p) return;
    if (el.dataset.change === 'pot-value') p.value = num(el.value); else p.mode = el.value === 'percent' ? 'percent' : 'fixed';
    touch(p); commit(); return;
  }
  if (el.dataset.change === 'xmas-gift-status') {
    const r = byId(state.christmas.recipients, el.dataset.id); const g = r && byId(r.gifts, el.dataset.item);
    if (!g) return; g.status = el.value; touch(r); commit();
  }
});

document.addEventListener('input', e => {
  if (e.target.dataset.input === 'vault-search') {
    ui.vaultSearch = e.target.value;
    $('#vault-list').innerHTML = vaultListHTML(); refreshIcons();
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* ============================ 11. ROUTER & BOOT ============================ */
let focusAfterRender = null, renderDeferred = false, appBooted = false;
const route = () => { const r = (location.hash.match(/^#\/(\w+)/) || [])[1]; return TITLES[r] ? r : 'dashboard'; };

function renderNav(r) {
  if (r === 'tools' || r === 'finance') r = 'settings';   // hidden tools live under Settings
  $('#side-nav').innerHTML = NAV.map(n => `
    <a href="#/${n.id}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium transition ${r === n.id ? 'bg-teal-50 text-teal-800' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}">
      ${icon(n.icon, 'w-5 h-5 ' + (r === n.id ? 'text-teal-600' : 'text-slate-400'))}${n.label}</a>`).join('');
  $('#bottom-nav-inner').innerHTML = NAV.filter(n => !n.desktopOnly).map(n => `
    <a href="#/${n.id}" class="flex flex-col items-center justify-center gap-1 py-2.5 text-[11px] font-medium ${r === n.id ? 'text-teal-700' : 'text-slate-500'}">
      <span class="w-12 h-7 rounded-full flex items-center justify-center ${r === n.id ? 'bg-teal-50' : ''}">${icon(n.icon, 'w-5 h-5')}</span>${n.label}</a>`).join('');
}

const VIEWS = { dashboard: renderDashboard, tasks: renderTasks, birthdays: renderBirthdays, christmas: renderChristmas, vault: renderVault, settings: renderSettings, tools: renderTools, finance: renderFinance };

function render() {
  renderDeferred = false;
  const r = route();
  $('#page-title').textContent = TITLES[r];
  document.title = `${TITLES[r]} · Home Hub`;
  renderNav(r);
  try { $('#view').innerHTML = `<div class="anim-fade">${VIEWS[r]()}</div>`; }
  catch (err) { console.error(err); $('#view').innerHTML = `<div class="${CARD} p-6 text-rose-700">Something went wrong displaying this page: ${esc(err.message)}. Try Settings → Export, then reload.</div>`; }
  updateSyncIndicators();
  refreshIcons();
  if (focusAfterRender) { const f = $(focusAfterRender); if (f) f.focus({ preventScroll: true }); focusAfterRender = null; }
}

/** For remote sync updates: don't wipe something the user is typing – wait until they leave the field. */
function scheduleRender() {
  const a = document.activeElement;
  if (a && $('#view').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { renderDeferred = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (appBooted && renderDeferred) setTimeout(() => { if (renderDeferred) scheduleRender(); }, 50); });

window.addEventListener('hashchange', () => { if (!appBooted) return; if (checkSyncLink()) return; if (route() !== 'finance') csvSession = null; render(); window.scrollTo({ top: 0 }); });
document.addEventListener('visibilitychange', () => {
  if (!appBooted || document.visibilityState !== 'visible') return;
  if (Sync.enabled()) Sync.pull(); else ensureCycles();
  render();
});
window.addEventListener('storage', e => { if (appBooted && e.key === STORE_KEY && e.newValue) { state = normalise(JSON.parse(e.newValue)); scheduleRender(); } }); // other tabs

/* ---------- Authentication gate ----------
   The Firebase module script (below) calls Auth.onUser() from onAuthStateChanged.
   The app shell stays hidden, and no data is loaded, rendered or synced, until the
   signed-in Google account is verified AND on the allow-list. The real enforcement
   is server-side in the Security Rules; this is the matching client-side gate. */
const Auth = {
  user: null, deniedEmail: null, busy: false,
  email() { return this.user ? String(this.user.email || '').toLowerCase() : ''; },
  isAllowed(u) { return !!(u && u.emailVerified && ALLOWED_EMAILS.includes(String(u.email || '').toLowerCase())); },

  async onUser(u) {
    if (!u) {
      this.user = null; lockApp();
      if (this.deniedEmail) { renderGate('denied', this.deniedEmail); this.deniedEmail = null; }
      else renderGate('signin');
      return;
    }
    if (!this.isAllowed(u)) {
      this.user = null; this.deniedEmail = u.email || 'this account';
      lockApp(); renderGate('denied', this.deniedEmail);
      try { await FB.signOut(); } catch (e) { /* ignore */ }
      return;
    }
    this.user = u; this.deniedEmail = null;
    bootApp();
  },

  async signIn() {
    if (this.busy) return;
    if (!window.FB) { renderGate('error', 'Sign-in is still loading – check your connection and try again.'); return; }
    this.busy = true; renderGate('signin', null, true);
    try { await FB.signIn(); }
    catch (e) {
      const code = e && e.code || '';
      if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') renderGate('signin');
      else if (code === 'auth/unauthorized-domain') renderGate('error', `This web address (${location.hostname}) is not in Firebase → Authentication → Settings → Authorized domains.`);
      else renderGate('error', (e && e.message) || 'Sign-in failed');
    } finally { this.busy = false; }
  },

  confirmSignOut() {
    const synced = !!(state && Sync.enabled() && state.settings.sync.lastSync);
    openModal({
      title: 'Sign out?', submitLabel: 'Sign out',
      body: `<p class="text-sm text-slate-600">You are signed in as <b>${esc(this.email())}</b>.</p>
        ${chk('wipe', 'Also remove the cached copy from this device', synced, synced ? 'Recommended on shared devices. Your data stays safe in Firebase and reloads when you sign in again.' : '<span class="text-rose-600">Not synced to the cloud – removing it would delete your only copy. Export a backup first.</span>')}`,
      onSubmit: fd => { this.signOut(fd.get('wipe') === 'on'); }
    });
  },

  async signOut(wipe) {
    Sync.stop();
    if (wipe && state) {
      // keep only the device's sync settings; meta.updatedAt 0 so the cloud copy wins on next sign-in
      localStorage.setItem(STORE_KEY, JSON.stringify({ tasks: [], checklists: [], people: [], vault: [], settings: state.settings, meta: { updatedAt: 0 } }));
    }
    try { await FB.signOut(); } catch (e) { toast('Sign-out failed: ' + e.message, 'error'); }
  }
};

function showShell(on) {
  const shell = $('#app-shell'), gate = $('#auth-gate');
  shell.classList.toggle('hidden', !on); shell.setAttribute('aria-hidden', on ? 'false' : 'true');
  gate.classList.toggle('hidden', on);
}
function lockApp() {
  Sync.stop();
  closeModal();
  appBooted = false; renderDeferred = false;
  state = undefined;                               // drop data from memory
  csvSession = null;
  $('#view').innerHTML = '';
  showShell(false);
}
function bootApp() {
  if (appBooted) { render(); return; }            // already running for this user
  state = load();                                  // local cache first (instant), cloud copy follows
  appBooted = true;
  showShell(true);
  checkSyncLink();
  render();
  Sync.start();                                    // runs ensureCycles once it has the latest data
}

function renderGate(mode, detail, busy) {
  const gate = $('#auth-gate');
  gate.classList.remove('hidden');
  const googleBtn = `<button type="button" data-action="sign-in" ${busy ? 'disabled' : ''} class="w-full inline-flex items-center justify-center gap-3 rounded-xl bg-white hover:bg-slate-50 ring-1 ring-slate-300 px-4 py-3 text-sm font-semibold text-slate-800 shadow-sm transition active:scale-[.98] disabled:opacity-60">
      <svg class="w-5 h-5" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      ${busy ? 'Waiting for Google…' : 'Sign in with Google'}</button>`;
  const panels = {
    loading: `<div class="flex items-center justify-center gap-2 text-sm text-slate-500 py-3">${icon('loader-circle', 'w-4 h-4 animate-spin')}Checking sign-in…</div>`,
    signin: `${googleBtn}<p class="text-xs text-slate-500 text-center mt-4">${icon('lock', 'w-3.5 h-3.5 inline -mt-0.5')} Private household app – only approved Google accounts can access it.</p>`,
    denied: `<div class="rounded-xl bg-rose-50 ring-1 ring-rose-200 p-4 mb-4 text-left">
        <p class="font-semibold text-rose-800 flex items-center gap-2">${icon('shield-x', 'w-5 h-5')}Access denied</p>
        <p class="text-sm text-rose-700 mt-1"><b>${esc(detail || '')}</b> is not authorised to use this app and has been signed out.</p></div>
      ${googleBtn}<p class="text-xs text-slate-500 text-center mt-3">Choose a different Google account.</p>`,
    config: `<div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 p-4 text-left text-sm text-amber-900">
        <p class="font-semibold flex items-center gap-2">${icon('settings', 'w-4 h-4')}Firebase not configured</p>
        <p class="mt-1">Edit <code>window.HOMEHUB_CONFIG</code> near the top of <code>index.html</code> and paste your Firebase web app config.</p></div>`,
    error: `<div class="rounded-xl bg-rose-50 ring-1 ring-rose-200 p-4 mb-4 text-left text-sm text-rose-800">
        <p class="font-semibold flex items-center gap-2">${icon('triangle-alert', 'w-4 h-4')}Sign-in problem</p><p class="mt-1">${esc(detail || '')}</p></div>${window.FB ? googleBtn : ''}`
  };
  gate.innerHTML = `<div class="w-full max-w-sm anim-up">
    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/60 ring-1 ring-slate-200/70 p-7 text-center">
      <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 text-white flex items-center justify-center shadow-sm mb-4">${icon('house', 'w-7 h-7')}</div>
      <h1 class="text-xl font-bold text-slate-900">Home Hub</h1>
      <p class="text-sm text-slate-500 mt-1 mb-6">Household organiser</p>
      ${panels[mode] || panels.loading}
    </div></div>`;
  refreshIcons();
}

// Boot: show the gate; the Firebase module takes over from here.
renderGate('loading');
if (!CFG.firebase || !CFG.firebase.apiKey || /PASTE_/.test(CFG.firebase.apiKey) || !CFG.firebase.databaseURL || /your-project/.test(CFG.firebase.databaseURL)) {
  renderGate('config');
} else {
  setTimeout(() => { if (!window.FB) renderGate('error', 'Could not load Firebase sign-in. Check your internet connection (or any content blocker) and reload the page.'); }, 12000);
}
</script>

<!-- ============ FIREBASE MODULAR SDK v10 (Auth + Realtime Database) ============ -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
           onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  import { getDatabase, ref, onValue, set, get } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

  const cfg = (window.HOMEHUB_CONFIG || {}).firebase || {};
  if (cfg.apiKey && !/PASTE_/.test(cfg.apiKey)) {
    try {
      const app  = initializeApp(cfg);
      const auth = getAuth(app);
      const db   = getDatabase(app);
      await setPersistence(auth, browserLocalPersistence).catch(() => {});   // stay signed in on this device

      const provider = new GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });           // always let you pick the account

      window.FB = {
        db, ref, onValue, set, get,
        async signIn() {
          try { await signInWithPopup(auth, provider); }
          catch (e) {
            // Some in-app/standalone browsers block pop-ups – fall back to a full-page redirect
            if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return signInWithRedirect(auth, provider);
            throw e;
          }
        },
        signOut: () => signOut(auth)
      };

      getRedirectResult(auth).catch(e => renderGate('error', e.message));
      onAuthStateChanged(auth, user => Auth.onUser(user));
    } catch (e) {
      renderGate('error', 'Firebase failed to start: ' + e.message);
    }
  }
</script>
</body>
